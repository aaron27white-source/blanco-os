  /* ---------------- console (OpenClaw · Claude Code · Hermes) ----------------
     Three commanders, three separate chains of command. Each brings its own
     sub-agent roster, its own threads, and its own way of holding a
     conversation open between turns — so switching commander switches which
     threads exist and who you can address, rather than pointing one thread at
     a different brain.

     The local Ollama tabs are gone. One model fit in memory at a time on this
     box, every switch paid an eviction and a multi-GB reload, and the answer
     came back with no tools, no vault and no memory. */
  chatEngine: 'openclaw',

  /* Which thread each commander is showing. Kept per commander rather than as
     one id, so tabbing between them lands back where you left off instead of
     resetting to the first thread every time. */
  chatSessionByEngine: {},

  get chatSession(){ return this.chatSessionByEngine[this.chatEngine] || null; },
  set chatSession(id){ this.chatSessionByEngine[this.chatEngine] = id; },

  /* Who the box you just typed into actually talks to. The console and the
     Personal dock share #chatInput and sendChat, so this has to be derived
     from the view every send — a sticky field left the Command Deck talking
     to whichever sub-agent the last Personal tab owned. */
  currentChatAgent(){
    if (this.agentDockAgent()) return this.agentDockAgent();
    return (this.currentSession() || {}).agent || '';
  },
  currentSession(){
    return (this.data.chatSessions || []).find(s => s.id === this.chatSession) || null;
  },
  chatStream: null,
  thinkTimer: null,

  /* The one definition of what belongs in the thread. Both surfaces share the
     #thread id, so a live repaint has to filter exactly the way whichever one
     is on screen built itself — this used to be spelled out in three places,
     free to drift apart. */
  threadMessages(){
    // A dock: one sub-agent's own conversation.
    const own = this.dockThread();
    if (own) return own.messages;
    const all = this.data.messages || [];
    // Command Deck: strictly this thread. OS notices live in the alert tray,
    // where they can be acknowledged — in here they only scrolled away
    // between two questions.
    return all.filter(m => (m.session_id || 1) === this.chatSession);
  },

  /* Repaint the thread alone. A full render() rebuilds the view and takes the
     textarea — its focus, and anything half-typed — with it, which is not
     acceptable several times a second while an answer streams in. */
  paintThread(){
    // Coalesced to one repaint per frame. Claude emits a text delta every few
    // characters, and rebuilding the thread's innerHTML on each one made a
    // fast answer stutter — the browser was doing more layout work than the
    // model was doing writing.
    if (this._paintQueued) return;
    this._paintQueued = true;
    requestAnimationFrame(() => {
      this._paintQueued = false;
      const el = $('thread');
      if (!el) return;
      el.innerHTML = this.chatBubblesHTML(this.threadMessages(),
        this.agentDockTarget() ? this.dockRoster() : (this.data.chatAgents || []));
    });
  },
  _paintQueued: false,

  /* The three tabs come from the API so a missing CLI reads as "not
     installed" rather than as a broken turn. Until that fetch lands, these
     stand in — the set is closed, so there is nothing to discover. */
  engineList(){
    const fetched = this.data.chatEngines;
    if (fetched && fetched.length) return fetched;
    return [
      {id:'openclaw', name:'OpenClaw', emoji:'🍯', available:true,
       note:'Sweet Jones and her domain sub-agents'},
      {id:'claude', name:'Claude Code', emoji:'🦊', available:true,
       note:'headless build turns from the workspace root'},
      {id:'hermes', name:'Hermes', emoji:'⚡', available:true,
       note:'the gateway agent — tools, skills and memory'},
    ];
  },

  engineMeta(id){
    return this.engineList().find(e => e.id === (id || this.chatEngine)) || this.engineList()[0];
  },

  /* Switching commander reloads that commander's threads and roster. The API
     opens a first thread on demand, so a commander never lands on an empty
     tab strip. */
  async switchEngine(engine){
    if (engine === this.chatEngine) return;
    this.stopWatching();
    this.chatEngine = engine;
    this.render();
    try {
      const [sessions, agents] = await Promise.all([
        api('/api/chat/sessions?engine=' + encodeURIComponent(engine)),
        api('/api/chat/agents?engine=' + encodeURIComponent(engine)),
      ]);
      this.data.chatSessions = sessions;
      this.data.chatAgents = agents;
      if (!sessions.some(s => s.id === this.chatSession)) this.chatSession = sessions[0].id;
      await this.loadThread();
    } catch (err) { this.toast('Could not open ' + engine + ': ' + err.message); }
    this.render();
  },

  /* One thread's history, rather than the last 80 messages across every
     thread on the box. */
  async loadThread(){
    if (!this.chatSession) return;
    this.data.messages = await api('/api/chat?limit=120&session_id=' + this.chatSession);
  },

  async newSession(){
    const meta = this.engineMeta();
    const count = (this.data.chatSessions || []).length + 1;
    const label = await Bubble.ask('Name this ' + meta.name + ' thread', meta.name + ' ' + count,
      {heading:'New thread', ok:'Open thread',
       validate: v => v.trim() ? null : 'Give the thread a name.'});
    if (label === null) return;
    try {
      const session = await api('/api/chat/sessions', {method:'POST', body: JSON.stringify({
        label: label.trim(), engine: this.chatEngine, agent: this.currentChatAgent(),
      })});
      this.data.chatSessions = [...(this.data.chatSessions || []), session];
      await this.switchSession(session.id);
    } catch (err) { this.toast('Could not open thread: ' + err.message); }
  },

  async switchSession(id){
    if (id === this.chatSession) return;
    this.stopWatching();
    this.chatSession = id;
    try { await this.loadThread(); }
    catch (err) { this.toast('Could not load that thread: ' + err.message); }
    this.render();
    // Threads run independently, so switching into one mid-turn should show
    // it working rather than a frozen bubble.
    if ((this.data.messages || []).some(m => m.status === 'pending')) this.resumePending();
  },

  async renameSession(id){
    const session = (this.data.chatSessions || []).find(s => s.id === id);
    const label = await Bubble.ask('Rename thread', session ? session.label : '',
      {heading:'Thread', validate: v => v.trim() ? null : 'Give the thread a name.'});
    if (label === null) return;
    try {
      const updated = await api('/api/chat/sessions/' + id,
        {method:'PATCH', body: JSON.stringify({label: label.trim()})});
      this.data.chatSessions = (this.data.chatSessions || []).map(s => s.id === id ? updated : s);
      this.render();
    } catch (err) { this.toast('Could not rename: ' + err.message); }
  },

  async deleteSession(id){
    const ok = await Bubble.confirm('Close this thread?',
      {heading:'Close thread', sub:'Its history goes with it.', ok:'Close it', cancel:'Keep it'});
    if (!ok) return;
    try {
      await api('/api/chat/sessions/' + id, {method:'DELETE'});
      this.data.chatSessions = (this.data.chatSessions || []).filter(s => s.id !== id);
      if (this.chatSession === id){
        this.chatSession = this.data.chatSessions[0].id;
        await this.loadThread();
      }
      this.render();
    } catch (err) { this.toast('Could not close it: ' + err.message); }
  },

  /* Point this thread at one of the commander's sub-agents. The remembered
     conversation goes with it — a resume handle belongs to the sub-agent that
     produced it, and reusing one is how you get an agent answering with
     somebody else's context. */
  async setThreadAgent(agentId){
    const id = this.chatSession;
    if (!id || agentId === this.currentChatAgent()) return;
    try {
      const updated = await api('/api/chat/sessions/' + id,
        {method:'PATCH', body: JSON.stringify({agent: agentId})});
      this.data.chatSessions = (this.data.chatSessions || []).map(s => s.id === id ? updated : s);
      this.render();
    } catch (err) { this.toast('Could not switch agent: ' + err.message); }
  },

  /* Start the commander's side of this thread over while keeping the
     scrollback. Useful when a long thread has drifted, or has grown expensive
     enough that the next turn is mostly re-reading itself. */
  async forgetThread(){
    const id = this.chatSession;
    if (!id) return;
    const ok = await Bubble.confirm('Start a fresh conversation?',
      {heading:'Forget the thread', sub:'The transcript stays on screen; the agent forgets it.',
       ok:'Fresh start', cancel:'Keep going', danger:false});
    if (!ok) return;
    try {
      const updated = await api('/api/chat/sessions/' + id,
        {method:'PATCH', body: JSON.stringify({forget: true})});
      this.data.chatSessions = (this.data.chatSessions || []).map(s => s.id === id ? updated : s);
      this.toast('Fresh start — the transcript above is still here.');
      this.render();
    } catch (err) { this.toast('Could not reset: ' + err.message); }
  },

  /* Who to draw on a reply bubble: the sub-agent that answered, falling back
     to the commander itself. */
  agentFace(m, agents){
    const found = (agents || []).find(a => a.id === m.agent && a.engine === (m.engine || 'openclaw'));
    return found || this.engineMeta(m.engine);
  },

  /* The working, shown while the turn runs and folded away once it lands.

     This is the whole point of the rebuild: a terminal is not silent while an
     agent thinks, and neither is the commander — it says which tool it reached
     for and what came back. The console just never listened. */
  ACT_ICONS: {tool:'\u25b6', thought:'\u2726', status:'\u00b7', note:'\u201c',
              wait:'\u25cc', ok:'\u2713', warn:'\u26a0', denied:'\u2298', plan:'\u2261'},

  activityHTML(m){
    const items = m.activity || [];
    if (!items.length) return '';
    return `<div class="tiny" style="margin-bottom:8px;padding-bottom:8px;
                 border-bottom:1px solid rgba(255,255,255,.06);color:#8a8386;
                 display:flex;flex-direction:column;gap:3px">
      ${items.map(a => {
        const running = a.state === 'running';
        const failed = a.state === 'failed';
        return `<div style="display:flex;gap:7px;align-items:baseline;
                     ${running ? 'color:#ffb020' : failed ? 'color:#ff8a94' : ''}">
          <span style="opacity:.75;width:10px;flex-shrink:0">${this.ACT_ICONS[a.icon] || '\u00b7'}</span>
          <span style="flex-shrink:0">${esc(a.label || '')}</span>
          ${a.detail ? `<span style="opacity:.6;overflow:hidden;text-overflow:ellipsis;
                              white-space:nowrap">${esc(a.detail)}</span>` : ''}
          ${running ? '<span class="dot live" style="background:#ffb020;flex-shrink:0"></span>' : ''}
        </div>`;
      }).join('')}
    </div>`;
  },

  /* What the turn cost. Claude reports dollars and tokens outright; the other
     two report what they can. Shown because a build turn that quietly spends
     real money should say so on the bubble, not only in the spend page. */
  usageHTML(m){
    const u = m.usage || {};
    const bits = [];
    if (u.cost_usd) bits.push('$' + Number(u.cost_usd).toFixed(4));
    if (u.output_tokens) bits.push(u.output_tokens + ' out');
    if (u.context_used && u.context_size)
      bits.push(Math.round(100 * u.context_used / u.context_size) + '% ctx');
    return bits.length ? ' \u00b7 ' + esc(bits.join(' \u00b7 ')) : '';
  },

  chatBubblesHTML(msgs, agents){
    if (!msgs.length){
      const meta = this.engineMeta();
      return `<div class="empty">Nothing here yet. ${esc(meta.name)} is listening —
        this thread stays open, so it remembers what you said last time.</div>`;
    }
    return msgs.map(m => {
      const mine = m.role === 'user';
      const who = this.agentFace(m, agents);
      const pending = m.status === 'pending';
      const failed = m.status === 'failed';
      return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};gap:10px;align-items:flex-end">
        ${mine ? '' : `<div class="ring" style="width:32px;height:32px;font-size:15px;flex-shrink:0;
            border:1px solid rgba(255,45,61,.3)">${who.emoji}</div>`}
        <div style="max-width:min(640px,80%)">
          ${mine ? '' : `<div class="tiny" style="margin-bottom:4px;color:#8a8386">${esc(who.name)}</div>`}
          <div style="padding:12px 15px;border-radius:${mine?'14px 14px 4px 14px':'14px 14px 14px 4px'};
               background:${mine?'rgba(255,45,61,.14)':'rgba(255,255,255,.03)'};
               border:1px solid ${mine?'rgba(255,45,61,.28)':'rgba(255,255,255,.07)'};
               ${failed?'border-color:rgba(255,45,61,.5)':''}">
            ${pending ? this.activityHTML(m) : ''}
            ${pending && m.body
              ? `<div style="font-size:14px;line-height:1.55;white-space:pre-wrap">${mdLite(m.body)}<span class="caret"></span></div>`
              : pending
              ? `<span class="tiny" style="color:#ff8a94">
                   <span class="dot live" style="background:#ff2d3d;display:inline-block"></span>
                   ${esc(who.name)} is working… <span id="thinkClock">0s</span>
                   <button class="chip" style="cursor:pointer;margin-left:8px"
                           onclick="App.stopChat(${m.id})">stop</button></span>`
              : failed
                ? `<div class="tiny" style="color:#ff8a94">couldn't answer — ${esc(m.error || 'unknown error')}
                     <button class="chip" style="cursor:pointer;margin-left:8px"
                             onclick="App.retry(${m.id})">retry</button></div>`
                : `<div style="font-size:14px;line-height:1.55;white-space:pre-wrap">${mdLite(m.body)}</div>`}
          </div>
          <div class="tiny" style="margin-top:4px;text-align:${mine?'right':'left'};color:#5c5659">
            ${esc(hhmm(m.created_at))}${m.duration_ms ? ' · ' + Math.round(m.duration_ms/1000) + 's' : ''}${this.usageHTML(m)}
          </div>
        </div>
      </div>`;
    }).join('');
  },

  /* Resend the question a failed reply belongs to, rather than making Blanco
     find it in the scrollback and retype it. */
  retry(replyId){
    const msgs = this.threadMessages();
    const index = msgs.findIndex(m => m.id === replyId);
    const question = index > 0 ? msgs[index - 1] : null;
    if (!question || question.role !== 'user') return this.toast('Nothing to resend.');
    const box = $('chatInput');
    if (box){ box.value = question.body; this.growInput(box); }
    this.sendChat();
  },

  engineTabsHTML(){
    const current = this.chatEngine;
    return `<div class="filters" style="margin:0">
      ${this.engineList().map(e => `<button class="${current===e.id?'on':''}"
        ${e.available === false ? 'disabled title="not installed on this machine"' : ''}
        onclick="App.switchEngine('${esc(e.id)}')"
        style="${e.available === false ? 'opacity:.4;cursor:not-allowed' : ''}"
        >${e.emoji} ${esc(e.name)}</button>`).join('')}
    </div>`;
  },

  sessionTabsHTML(){
    const sessions = this.data.chatSessions || [];
    const current = this.chatSession;
    return `<div class="filters" style="margin:0;flex-wrap:wrap">
      ${sessions.map(s => `<button class="${current===s.id?'on':''}"
          onclick="App.switchSession(${s.id})"
          ondblclick="App.renameSession(${s.id})"
          title="${esc(s.label)}${s.resumable ? ' — the agent remembers this thread' : ' — fresh, nothing remembered yet'}"
          >${s.resumable ? '<span class="dot live" style="background:#28c840;margin-right:6px"></span>' : ''}${esc(s.label)}${
            sessions.length > 1
              ? `<span class="tiny" style="margin-left:6px;opacity:.65"
                  onclick="event.stopPropagation();App.deleteSession(${s.id})">✕</span>`
              : ''
          }</button>`).join('')}
      <button class="chip" style="cursor:pointer" onclick="App.newSession()">+ thread</button>
    </div>`;
  },

  /* Only drawn when the commander actually has sub-agents. A picker with one
     entry is a label pretending to be a control. */
  agentPickerHTML(){
    const agents = this.data.chatAgents || [];
    if (agents.length < 2) return '';
    const current = this.currentChatAgent();
    return `<div class="filters" style="margin:0;flex-wrap:wrap">
      ${agents.map(a => `<button class="${current===a.id?'on':''}"
        onclick="App.setThreadAgent('${esc(a.id)}')" title="${esc(a.role || '')}"
        >${a.emoji} ${esc(a.name)}</button>`).join('')}
    </div>`;
  },

  /* ---- terminal: docked or full-screen ----
     Sticky across reloads: if Blanco left the terminal maximised, that is how
     he works, and the deck should come back that way rather than making him
     click it again every morning. */
  consoleMax: LS.get('blanco_os_console_max', '0') === '1',

  toggleConsoleMax(){
    this.consoleMax = !this.consoleMax;
    LS.set('blanco_os_console_max', this.consoleMax ? '1' : '0');
    this.render();
    // Focus follows the terminal — expanding it means you are about to type.
    requestAnimationFrame(() => $('chatInput')?.focus());
  },

  consoleHTML(){
    const meta = this.engineMeta();
    const agents = this.data.chatAgents || [];
    const who = agents.find(a => a.id === this.currentChatAgent()) || meta;
    const session = this.currentSession();
    const msgs = this.threadMessages();
    const busy = msgs.some(m => m.status === 'pending');

    return `<div class="stack">
      <div class="card${this.consoleMax ? ' consolemax' : ''}" style="padding:0;overflow:hidden;border-color:rgba(255,45,61,.26);
           box-shadow:0 0 0 1px rgba(255,106,61,.06),0 20px 50px rgba(0,0,0,.35)">

        <div style="display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px;
             border-bottom:1px solid rgba(255,255,255,.06);align-items:center">
          <span style="display:flex;gap:6px;margin-right:2px">
            <span style="width:9px;height:9px;border-radius:50%;background:#ff5f57"></span>
            <span style="width:9px;height:9px;border-radius:50%;background:#febc2e"></span>
            <span style="width:9px;height:9px;border-radius:50%;background:#28c840"></span>
          </span>
          ${this.engineTabsHTML()}
          <span class="tiny" style="color:#8a8386;flex:1;min-width:120px">${esc(meta.note || '')}</span>
          <button class="chip" style="cursor:pointer;padding:4px 9px"
                  onclick="App.toggleConsoleMax()"
                  title="${this.consoleMax ? 'Shrink the terminal back into the deck' : 'Expand the terminal to fill the screen'} (Ctrl+Shift+M)"
                  aria-label="${this.consoleMax ? 'Shrink terminal' : 'Expand terminal'}"
            >${this.consoleMax ? '⤡ shrink' : '⛶ expand'}</button>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;padding:10px 18px;
             border-bottom:1px solid rgba(255,255,255,.06);align-items:center">
          ${this.sessionTabsHTML()}
          <span style="margin-left:auto;display:flex;gap:6px">
            <button class="chip" style="cursor:pointer" onclick="App.forgetThread()"
              title="${session && session.resumable
                ? 'Start the agent fresh — the transcript above stays'
                : 'This thread has nothing remembered yet'}"
              ${session && session.resumable ? '' : 'disabled style="opacity:.4"'}>fresh start</button>
            <button class="chip" style="cursor:pointer" onclick="App.clearChat()">clear</button>
          </span>
        </div>

        ${agents.length > 1 ? `<div style="display:flex;gap:10px;flex-wrap:wrap;padding:10px 18px;
             border-bottom:1px solid rgba(255,255,255,.06);align-items:center">
          <span class="tiny" style="letter-spacing:1.5px;color:#726c6f">SUB-AGENT</span>
          ${this.agentPickerHTML()}
        </div>` : ''}

        <div id="thread" style="display:flex;flex-direction:column;gap:16px;padding:20px 18px;
             height:calc(100vh - 460px);min-height:${this.consoleMax ? '0' : '320px'};overflow-y:auto"
             >${this.chatBubblesHTML(msgs, agents)}</div>

        <div style="padding:14px 18px;border-top:1px solid rgba(255,255,255,.06)">
          <div style="display:flex;gap:10px;align-items:flex-end">
            <textarea id="chatInput" class="search" rows="1"
                      style="flex:1;font-family:var(--sans);resize:none;padding:12px 14px;
                             max-height:180px;overflow-y:auto"
                      placeholder="Message ${esc(who.name)}…"
                      oninput="App.growInput(this)"
                      onkeydown="App.inputKey(event)"></textarea>
            ${busy
              ? `<button class="sendbtn" onclick="App.stopChat(${
                   (msgs.filter(m => m.status === 'pending').pop() || {}).id})"
                   >Stop</button>`
              : `<button class="sendbtn" onclick="App.sendChat()">Send</button>`}
          </div>
          <div class="tiny" style="margin-top:8px;color:#5c5659;display:flex;gap:14px;flex-wrap:wrap">
            <span><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · <kbd>↑</kbd> edit last · <kbd>Esc</kbd> stop</span>
            <span style="margin-left:auto">${esc(meta.name)}${
              meta.model ? ' · ' + esc(meta.model) : ''}${
              session && session.resumable ? ' · remembering this thread' : ' · fresh thread'}</span>
          </div>
        </div>
      </div>
    </div>`;
  },

  /* The box grows with the message instead of scrolling a single line — a
     three-paragraph prompt was previously typed through a one-line slot. */
  growInput(box){
    if (!box) return;
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 180) + 'px';
  },

  inputKey(event){
    const box = event.target;
    if (event.key === 'Enter' && !event.shiftKey){
      event.preventDefault();
      return this.sendChat();
    }
    // Esc stops the running turn, the way it does in the CLIs themselves.
    if (event.key === 'Escape'){
      const running = this.threadMessages().filter(m => m.status === 'pending').pop();
      if (running){ event.preventDefault(); return this.stopChat(running.id); }
    }
    // ↑ on an empty box pulls the last thing you sent back for editing, the
    // way a shell history does. Only when empty, so it never eats a cursor
    // move inside a draft.
    if (event.key === 'ArrowUp' && !box.value){
      const mine = this.threadMessages().filter(m => m.role === 'user');
      if (!mine.length) return;
      event.preventDefault();
      box.value = mine[mine.length - 1].body;
      this.growInput(box);
    }
  },

  async sendChat(){
    const box = $('chatInput');
    const text = (box?.value || '').trim();
    if (!text) return;
    // clearField, not box.value = '' — the draft has to go with it, or the
    // repaint below would type the sent message straight back in.
    this.clearField(box);
    this.growInput(box);
    const dock = this.agentDockAgent();
    const own = this.dockThread();
    try {
      // The thread owns its commander and sub-agent; a dock is the one caller
      // that names its agent, and it sends into its own thread (an OpenClaw
      // dock's is the main thread, #1).
      const sessionId = own ? await this.ensureDockSession(own) : this.chatSession;
      const exchange = await api('/api/chat', {method:'POST', body: JSON.stringify({
        message: text,
        agent: dock || '',
        session_id: sessionId,
      })});
      // Paint straight from the response. Re-fetching the whole timeline just
      // to see your own message put a round trip between typing and seeing it.
      if (own) own.messages = [...own.messages, exchange.message, exchange.reply];
      else this.data.messages = [...(this.data.messages || []), exchange.message, exchange.reply];
      this.render();
      this.scrollThread();
      this.watchReply(exchange.reply.id);
    } catch (err) { this.toast('Could not send: ' + err.message); }
  },

  /* Watch one turn happen over SSE.

     This used to carry one thing: the answer so far. That is all a reader
     needs once the answer starts — and on an OpenClaw turn the answer starts
     at second 55 of 59, so the console was a spinner for the whole turn.

     Now every commander reports its working as it goes, and the bubble shows
     it: which tool it reached for, what came back, what it is thinking. The
     answer streams into the same bubble underneath. Events are numbered, so a
     dropped connection resumes at the last one seen instead of starting over
     or stranding the bubble as pending forever. */
  watchReply(replyId, opts){
    this.stopWatching();
    const row = (this.data.messages || []).find(m => m.id === replyId)
             || this.threadMessages().find(m => m.id === replyId);
    if (!row) return;
    row.activity = row.activity || [];
    row.usage = row.usage || {};

    const started = Date.now() - ((opts && opts.elapsedMs) || 0);
    this.thinkTimer = setInterval(() => {
      const clock = $('thinkClock');
      if (clock) clock.textContent = Math.round((Date.now() - started) / 1000) + 's';
    }, 250);

    let lastId = (opts && opts.after) || 0;
    const open = () => {
      const es = new EventSource(API + '/api/chat/' + replyId + '/stream?after=' + lastId);
      this.chatStream = es;

      es.addEventListener('delta', e => {
        if (e.lastEventId) lastId = +e.lastEventId;
        row.body += JSON.parse(e.data).text;
        row.streaming = true;
        this.paintThread(); this.scrollThread();
      });

      /* Hermes redraws its answer box rather than appending to it, so "what it
         has said so far" can genuinely shrink. Appending would duplicate. */
      es.addEventListener('replace', e => {
        if (e.lastEventId) lastId = +e.lastEventId;
        row.body = JSON.parse(e.data).text;
        row.streaming = true;
        this.paintThread(); this.scrollThread();
      });

      /* The working. A tool that is still running replaces its own earlier
         line rather than adding a second one, so the trace reads like a
         terminal's rather than like a log of every state change. */
      es.addEventListener('activity', e => {
        if (e.lastEventId) lastId = +e.lastEventId;
        const item = JSON.parse(e.data);
        // Match on the call's own id, not its name: two Bash calls in one turn
        // are two lines in a terminal, not one line rewritten twice.
        const at = item.key ? row.activity.findIndex(a => a.key === item.key) : -1;
        if (at > -1) row.activity[at] = item;
        else row.activity.push(item);
        if (row.activity.length > 60) row.activity = row.activity.slice(-60);
        this.paintThread(); this.scrollThread();
      });

      es.addEventListener('usage', e => {
        if (e.lastEventId) lastId = +e.lastEventId;
        row.usage = JSON.parse(e.data);
      });

      es.addEventListener('done', e => {
        const finished = JSON.parse(e.data);
        Object.assign(row, finished, {streaming: false});
        this.stopWatching();
        // A full render, not just the thread: the send button and the "fresh
        // thread" line both change when a turn ends, and a first turn is what
        // makes a thread resumable.
        this.render();
        this.scrollThread();
        // One catch-up fetch — alerts raised while the turn ran belong in the
        // tray, and nothing about them came down this stream.
        this.load({quiet:true});
      });

      /* A dropped stream is no longer the end of the turn. The turn is still
         running on the box, so reconnect from the last event seen — closing
         the laptop lid mid-answer used to lose the rest of it. */
      es.onerror = () => {
        es.close();
        if (this.chatStream !== es) return;
        this.chatStream = null;
        if (this.chatRetries++ > 6) { this.stopWatching(); this.load({quiet:true}); return; }
        setTimeout(() => { if (!this.chatStream) open(); }, 1000 * this.chatRetries);
      };
    };
    this.chatRetries = 0;
    open();
  },

  chatRetries: 0,

  /* Stop a running turn — what Esc does in a terminal. Whatever the agent had
     written by then is kept as the reply rather than thrown away. */
  async stopChat(replyId){
    try {
      await api('/api/chat/' + replyId + '/cancel', {method:'POST'});
      this.toast('Stopped.');
    } catch (err) { this.toast('Could not stop it: ' + err.message); }
    this.stopWatching();
    if (this.dockThread()) await this.loadDock({force:true});
    else await this.loadThread();
    this.render();
  },

  /* Re-attach to anything still running. A reload in the middle of a turn used
     to leave the bubble spinning forever, because nothing reconnected. */
  async resumePending(){
    try {
      const pending = await api('/api/chat/pending/all');
      const mine = pending.find(m => (m.session_id || 1) === this.chatSession);
      if (mine) this.watchReply(mine.id);
    } catch (err) { /* nothing running, or the box is busy — not worth a toast */ }
  },

  stopWatching(){
    clearInterval(this.thinkTimer);

                : this.trainScope === 'domain' ? msg.sender_domain
                : msg.category;
    if (!value) return alert('Nothing to match on for that scope.');

        note: `set from "${msg.subject}"`.slice(0, 140),

  /* ================= alarm ================= */

  /* One AudioContext for the life of the page. Browsers start it suspended
     until a gesture, so every entry point calls this and resumes. */
  _ensureAudio(){
    try {
      if (!this._actx){
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        this._actx = new Ctor();
      }
      if (this._actx.state === 'suspended') this._actx.resume().catch(() => {});
      return this._actx;
    } catch (err) { return null; }
  },

  alarmVol(){
    const v = parseInt(LS.get('blanco_os_alarm_volume', '60'), 10);
    return (Number.isFinite(v) ? Math.min(100, Math.max(0, v)) : 60) / 100;
  },
  alarmMuted(){ return LS.get('blanco_os_sound_muted') === '1'; },

  /* Fires when a block ends. Falls back down the chain — YouTube, then the
     uploaded song, then the synth — so the alarm is never silent. */
  async playAlarm(wasBreak){
    if (this.alarmMuted()) return;
    const mode = LS.get('blanco_os_alarm_mode', 'preloaded');
    const vol = this.alarmVol();
    if (!vol) return;
    try {
      if (mode === 'youtube' && await this._alarmYouTube(vol)) return;
      if (mode === 'song' && await this._alarmSong(vol)) return;
    } catch (err) { /* fall through to the synth */ }
    this._alarmSynth(LS.get('blanco_os_alarm_sound', 'classic'), vol, wasBreak ? 2 : 3);
  },

  _alarmSynth(id, vol, repeats = 3){
    const ctx = this._ensureAudio();
    if (!ctx) return false;
    this._killSynth();
    const g = ctx.createGain();
    g.gain.value = vol;
    g.connect(ctx.destination);
    this._alarmGain = g;
    const def = ALARM_SOUNDS.find(s => s.id === id) || ALARM_SOUNDS[0];
    let t = ctx.currentTime + 0.06;
    for (let i = 0; i < Math.max(1, repeats); i++) t = def.synth(ctx, g, t) + 0.35;
    const ms = Math.max(0, (t - ctx.currentTime) * 1000);
    clearTimeout(this._alarmTimer);
    this._alarmTimer = setTimeout(() => this.stopAlarm(), ms + 200);
    this.showAlarmBanner(def.name);
    return true;
  },

  _killSynth(){
    clearTimeout(this._alarmTimer);
    if (this._alarmGain){
      try { this._alarmGain.gain.cancelScheduledValues(0); this._alarmGain.disconnect(); } catch (err) {}
      this._alarmGain = null;
    }
  },

  async _alarmSong(vol){
    const blob = await idbGet('alarm_song').catch(() => null);
    if (!blob) return false;
    this._killSongAudio();
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    a.volume = vol;
    a.loop = true;
    this._alarmAudio = a;
    this._alarmAudioUrl = url;
    try { await a.play(); }
    catch (err) { this._killSongAudio(); return false; }   // autoplay blocked
    this.showAlarmBanner(LS.get('blanco_os_alarm_song_name', 'Your song'));
    return true;
  },

  _killSongAudio(){
    if (this._alarmAudio){
      try { this._alarmAudio.pause(); } catch (err) {}
      this._alarmAudio = null;
    }
    if (this._alarmAudioUrl){
      URL.revokeObjectURL(this._alarmAudioUrl);
      this._alarmAudioUrl = null;
    }
  },

  /* Borrows the shared music player: stashes whatever is playing, plays the
     alarm song, and hands playback back in stopAlarm(). */
  async _alarmYouTube(vol){
    const id = LS.get('blanco_os_alarm_youtube', '');
    if (!id) return false;
    const ok = await this.ytEnsure(2500);
    if (!ok) return false;
    const p = this.player;
    let at = 0;
    try { at = this.yt.getCurrentTime() || 0; } catch (err) {}
    p.saved = {idx: p.idx, time: at, playing: p.playing};
    p.alarm = true;
    try {
      this.yt.unMute();
      this.yt.setVolume(Math.round(vol * 100));
      this.yt.loadVideoById(id);
      this.yt.playVideo();
    } catch (err) { p.alarm = false; return false; }
    const meta = this._alarmYtMeta();
    this.showAlarmBanner(meta.title || 'YouTube alarm');
    this.paintPlayer();
    return true;
  },

  _alarmYtMeta(){
    try { return JSON.parse(LS.get('blanco_os_alarm_yt_meta', '{}')) || {}; }
    catch (err) { return {}; }
  },

  stopAlarm(){
    this._killSynth();
    this._killSongAudio();
    const p = this.player;
    if (p && p.alarm){
      p.alarm = false;
      const s = p.saved;
      p.saved = null;
      try {
        const item = s && s.idx >= 0 ? p.queue[s.idx] : null;
        if (item && item.id){
          this.yt.loadVideoById({videoId: item.id, startSeconds: s.time || 0});
          if (s.playing) this.yt.playVideo(); else this.yt.pauseVideo();
        } else {
          this.yt.stopVideo();
        }
      } catch (err) {}
    }
    this.hideAlarmBanner();
    this.paintPlayer();
  },

  /* Lives on <body>, outside every re-rendered region, so it survives a view
     switch or a focus-mini repaint while the alarm is going off. */
  showAlarmBanner(what){
    let el = $('alarmBanner');
    if (!el){
      el = document.createElement('div');
      el.id = 'alarmBanner';
      el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:120;' +
        'display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:14px;' +
        'background:rgba(255,45,61,.16);border:1px solid rgba(255,45,61,.5);backdrop-filter:blur(10px);' +
        'font-family:var(--mono);font-size:12px;color:#ffd7da;box-shadow:0 12px 40px rgba(0,0,0,.5)';
      document.body.appendChild(el);
    }
    el.innerHTML = `<span>🔔 ALARM · ${esc(what || '')}</span>
      <button class="fmbtn" style="color:#ff8a94" onclick="App.stopAlarm()">STOP</button>`;
    el.hidden = false;
  },
  hideAlarmBanner(){ const el = $('alarmBanner'); if (el) el.hidden = true; },

  testAlarm(){
    this._ensureAudio();
    const mode = LS.get('blanco_os_alarm_mode', 'preloaded');
    const vol = this.alarmVol() || 0.6;
    clearTimeout(this._testTimer);
    if (mode === 'song' || mode === 'youtube'){
      (mode === 'song' ? this._alarmSong(vol) : this._alarmYouTube(vol)).then(ok => {
        if (!ok) this._alarmSynth(LS.get('blanco_os_alarm_sound', 'classic'), vol, 1);
        this._testTimer = setTimeout(() => this.stopAlarm(), 4000);
      });
      return;
    }
    this._alarmSynth(LS.get('blanco_os_alarm_sound', 'classic'), vol, 1);
  },

  alarmSet(key, value){
    LS.set(key, value);
    this.paintAlarmCard();
  },
  alarmSetVol(v){
    LS.set('blanco_os_alarm_volume', String(v));
    const lab = $('alVolVal');
    if (lab) lab.textContent = v + '%';
    if (this._alarmGain) this._alarmGain.gain.value = v / 100;
    if (this._alarmAudio) this._alarmAudio.volume = v / 100;
  },
  alarmToggleMute(){
    const on = !this.alarmMuted();
    LS.set('blanco_os_sound_muted', on ? '1' : '0');
    if (on) this.stopAlarm();
    this.paintAlarmCard();
  },

  async alarmUpload(input){
    const file = input && input.files && input.files[0];
    if (!file) return;
    try {
      await idbPut('alarm_song', file);
      LS.set('blanco_os_alarm_song_name', file.name);
      LS.set('blanco_os_alarm_mode', 'song');
    } catch (err) { alert('Could not save that file: ' + err.message); }
    this.paintAlarmCard();
  },
  async alarmClearSong(){
    await idbDel('alarm_song').catch(() => {});
    LS.del('blanco_os_alarm_song_name');
    if (LS.get('blanco_os_alarm_mode') === 'song') LS.set('blanco_os_alarm_mode', 'preloaded');
    this.paintAlarmCard();
  },

  async alarmSetYouTube(){
    const raw = ($('alYtUrl') || {}).value || '';
    const parsed = ytParse(raw);
    if (!parsed || !parsed.id) return alert('Paste a YouTube video link (playlists need a video in them).');
    const meta = await this.ytMeta(parsed.id);
    LS.set('blanco_os_alarm_youtube', parsed.id);
    LS.set('blanco_os_alarm_yt_meta', JSON.stringify(meta));
    LS.set('blanco_os_alarm_mode', 'youtube');
    this.clearDrafts(['alYtUrl']);
    this.paintAlarmCard();
  },
  alarmClearYouTube(){
    LS.del('blanco_os_alarm_youtube');
    LS.del('blanco_os_alarm_yt_meta');
    if (LS.get('blanco_os_alarm_mode') === 'youtube') LS.set('blanco_os_alarm_mode', 'preloaded');
    this.paintAlarmCard();
  },

  paintAlarmCard(){
    const el = $('alarmCard');
    if (el) el.outerHTML = this.alarmCardHTML();
  },

  alarmCardHTML(){
    const mode = LS.get('blanco_os_alarm_mode', 'preloaded');
    const sound = LS.get('blanco_os_alarm_sound', 'classic');
    const vol = parseInt(LS.get('blanco_os_alarm_volume', '60'), 10) || 0;
    const muted = this.alarmMuted();
    const songName = LS.get('blanco_os_alarm_song_name', '');
    const yt = this._alarmYtMeta();
    const ytId = LS.get('blanco_os_alarm_youtube', '');

    const sounds = ALARM_SOUNDS.map(s =>
      `<option value="${s.id}"${s.id === sound ? ' selected' : ''}>${esc(s.name)} — ${esc(s.feel)}</option>`).join('');

    const modes = [['preloaded','Preloaded sound'], ['song','Custom song (file)'], ['youtube','YouTube song']]
      .map(([v, l]) => `<option value="${v}"${v === mode ? ' selected' : ''}>${l}</option>`).join('');

    let detail = '';
    if (mode === 'preloaded'){
      detail = `<select class="search" style="margin-top:10px;text-transform:none"
                  onchange="App.alarmSet('blanco_os_alarm_sound', this.value)">${sounds}</select>`;
    } else if (mode === 'song'){
      detail = `<div style="margin-top:10px">
        <input id="alFile" type="file" accept="audio/*" style="display:none" onchange="App.alarmUpload(this)">
        <div class="prow">
          <button class="ack" style="margin:0" onclick="$('alFile').click()">
            ${songName ? 'Replace file' : 'Choose an audio file'}</button>
          ${songName ? `<button class="ack" style="margin:0;color:#ff8a94" onclick="App.alarmClearSong()">Remove</button>` : ''}
        </div>
        <div class="tiny" style="margin-top:8px">${songName ? '🎧 ' + esc(songName) : 'mp3 / m4a / wav — stored on this device.'}</div>
      </div>`;
    } else {
      detail = `<div style="margin-top:10px">
        <div class="prow">
          <input id="alYtUrl" class="search" placeholder="paste a YouTube link…"
                 style="flex:1;min-width:170px;padding:9px 10px;font-family:var(--sans)"
                 onkeydown="if(event.key==='Enter')App.alarmSetYouTube()">
          <button class="ack" style="margin:0" onclick="App.alarmSetYouTube()">Set</button>
        </div>
        ${ytId ? `<div class="prow" style="margin-top:10px">
            ${yt.thumb ? `<img src="${esc(yt.thumb)}" alt="" style="width:74px;height:42px;border-radius:6px;object-fit:cover">` : ''}
            <div style="min-width:0">
              <div style="font-size:13px;overflow-wrap:anywhere">${esc(yt.title || ytId)}</div>
              <div class="tiny">${esc(yt.author || 'YouTube')}</div>
            </div>
            <button class="qx" onclick="App.alarmClearYouTube()">clear</button>
          </div>` : '<div class="tiny" style="margin-top:8px">No song set — the alarm falls back to a beep.</div>'}
      </div>`;
    }

    return `<div class="card" id="alarmCard">
      <div class="cardhead">
        <h2>🔔 Alarm</h2>
        <button class="fmbtn" style="color:${muted ? '#ff5b66' : '#34d399'}" onclick="App.alarmToggleMute()">
          ${muted ? '🔇 MUTED' : '🔊 ON'}</button>
      </div>
      <div class="lbl tiny" style="display:block;margin-bottom:8px">WHEN A BLOCK ENDS, PLAY</div>
      <select class="search" style="text-transform:none"
              onchange="App.alarmSet('blanco_os_alarm_mode', this.value)">${modes}</select>
      ${detail}
      <div class="prow" style="margin-top:16px">
        <button class="ack" style="margin:0" onclick="App.testAlarm()">▶ Test</button>
        <button class="ack" style="margin:0" onclick="App.stopAlarm()">⏹ Stop</button>
        <span class="tiny" style="margin-left:auto">VOL <span id="alVolVal">${vol}%</span></span>
        <input class="pvol" type="range" min="0" max="100" value="${vol}"
               oninput="App.alarmSetVol(this.value)">
      </div>
      ${muted ? '<div class="tiny" style="margin-top:10px;color:#ff8a94">Muted — notifications still fire, sound does not.</div>' : ''}
    </div>`;
  },

  /* ================= sound player ================= */

  player: {queue: [], idx: -1, playing: false, alarm: false, dur: 0, cur: 0, err: '', saved: null, loading: false},

  /* ---- what is playing everywhere else on this PC ----
     A web page cannot see another browser tab and cannot talk to a Store app —
     no API exposes either, by design. Windows can do both: its media transport
     session manager reports every app that registers transport controls, so
     this one feed covers a YouTube tab in Opera or Chrome, YourMusic, Spotify
     and Media Player. The backend reads it over WSL interop.

     This is strictly additive. The queue above is still the deck's own player;
     nothing here touches it. */
  external: {available: false, status: 'stopped', title: '', artist: '',
             app_label: '', thumbnail: '', position_secs: 0, duration_secs: 0,
             sessions: []},

  EXT_IDLE: {available: false, status: 'stopped', title: '', artist: '',
             app_label: '', thumbnail: '', position_secs: 0, duration_secs: 0,
             sessions: []},

  async syncNowPlaying(){
    try {
      const now = await api('/api/nowplaying');
      this.external = now || this.external;
    } catch (err) {
      // A machine with no Windows underneath, or the API briefly down. Treat it
      // as "nothing playing elsewhere" rather than showing error chrome.
      this.external = this.EXT_IDLE;
    }
    this.paintExternal();
  },

  /* Transport for the *external* players. Deliberately separate from
     playerToggle/playerNext/playerPrev, which own the deck's own queue —
     overloading those would make one pair of buttons mean two things.

     `appId` names which player to drive, so pausing the video in one browser
     leaves the music in another alone. Empty targets whichever session Windows
     considers current, which is what a single-player box always wants. */
  async extControl(action, appId, positionSecs){
    try {
      await api('/api/nowplaying/control', {method: 'POST', body: JSON.stringify({
        action, app_id: appId || '', position_secs: Number(positionSecs) || 0,
      })});
    } catch (err) { /* the strip repaints from the next poll either way */ }
    // Windows needs a beat to settle before it reports the new state.
    setTimeout(() => this.syncNowPlaying(), 250);
  },

  extIsLive(){
    const e = this.external || {};
    return !!(e.available && e.status && e.status !== 'stopped' && e.title);
  },

  /* ---------------- second brain as a 3D galaxy ----------------
     The backdrop is the actual Obsidian vault: every note is a star, every
     folder a cluster with its own hue and glow, and each note is tethered to
     its folder core the way an Obsidian graph draws its edges. The whole
     structure is projected in 3D and rotates.

     The vault loads asynchronously; until it lands (or if it fails) a
     synthetic disc stands in, so the background never renders empty. */
  initGalaxy(){
    const cv = $('galaxyCanvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    if (!ctx) return;
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rnd = (a, b) => a + Math.random() * (b - a);

    /* Stable hash → 0..1, so a note keeps its position across reloads
       instead of the vault reshuffling itself every time you open the deck. */
    const hash01 = (str, salt = 0) => {
      let h = 2166136261 ^ salt;
      for (let i = 0; i < str.length; i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return ((h >>> 0) % 100000) / 100000;
    };

    // Folder hues, walked in order of folder size.
    const FOLDER_HUES = [22, 330, 274, 198, 44, 300, 12, 168, 250, 350, 60, 210];

    let nodes = [];      // {r,a,y,size,hue,sat,light,twinkle}
    let clusters = [];   // {r,a,y,hue,label,count}
    let edges = [];      // {from:cluster, to:node}

    /* A faint field behind the vault so the space between clusters isn't
       empty. Always present — the vault nodes render on top of it. */
    const AMBIENT = [];
    for (let i = 0; i < 800; i++){
      const t = Math.pow(Math.random(), 0.55);
      AMBIENT.push({r: t * 2.0, a: rnd(0, Math.PI * 2),
                    y: (Math.random() - 0.5) * (0.06 * (1 - t) + 0.012),
                    size: rnd(0.25, 0.9), hue: rnd(16, 40), light: rnd(55, 82),
                    twinkle: Math.random() * Math.PI * 2});
    }

    // --- placeholder disc until the vault answers -----------------------
    const buildSynthetic = () => {
      nodes = []; clusters = []; edges = [];
      for (let i = 0; i < 900; i++){
        const t = Math.pow(Math.random(), 0.55);
        const angle = (i % 2) * Math.PI + t * 2.0 * 3.1 + rnd(-0.4, 0.4);
        nodes.push({r: t * 2.0, a: angle, y: (Math.random() - 0.5) * 0.06,
                    size: rnd(0.35, 1.5), hue: rnd(20, 44), sat: 50, light: rnd(70, 92),
                    twinkle: Math.random() * Math.PI * 2});
      }
    };
    buildSynthetic();

    /* --- the real thing: lay the vault out as folder clusters ---------- */
    const buildFromVault = (notes) => {
      const byFolder = new Map();
      for (const n of notes){
        const f = n.folder || '(root)';
        if (!byFolder.has(f)) byFolder.set(f, []);
        byFolder.get(f).push(n);
      }
      const folders = [...byFolder.entries()].sort((a, b) => b[1].length - a[1].length);

      // Newest note = brightest star, so the vault's active edge glows.
      const times = notes.map(n => Date.parse(n.modified_at) || 0).filter(Boolean);
      const newest = Math.max(...times, 1), oldest = Math.min(...times, 0);
      const span = Math.max(1, newest - oldest);

      nodes = []; clusters = []; edges = [];
      folders.forEach(([folder, list], fi) => {
        const hue = FOLDER_HUES[fi % FOLDER_HUES.length];
        // Big folders sit further out so they have room to spread, but the
        // whole set stays inside the frame rather than drifting off-screen.
        const ring = 0.42 + (fi % 3) * 0.28 + Math.min(0.34, list.length / 150);
        const ang = (fi / folders.length) * Math.PI * 2 + hash01(folder) * 0.5;
        const cluster = {
          r: ring, a: ang, y: (hash01(folder, 7) - 0.5) * 0.10,
          hue, label: folder, count: list.length,
        };
        clusters.push(cluster);

        list.forEach((n) => {
          const h1 = hash01(n.path, 1), h2 = hash01(n.path, 2), h3 = hash01(n.path, 3);
          // Scatter inside the cluster; bigger folders get a wider halo.
          const spreadR = 0.10 + Math.min(0.34, list.length / 150);
          const spreadA = 0.16 + Math.min(0.45, list.length / 120);
          const age = (Date.parse(n.modified_at) || oldest) - oldest;
          const fresh = age / span;                    // 0 old .. 1 new
          const node = {
            r: Math.max(0.12, ring + (h1 - 0.5) * 2 * spreadR),
            a: ang + (h2 - 0.5) * 2 * spreadA,
            y: cluster.y + (h3 - 0.5) * 0.055,
            size: 1.0 + fresh * 2.2,
            hue, sat: 74 + fresh * 20, light: 64 + fresh * 30,
            twinkle: h1 * Math.PI * 2,
            title: n.title,
          };
          nodes.push(node);
          edges.push({c: cluster, n: node});
        });
      });
    };

    api('/api/knowledge/recent?limit=200')
      .then(notes => { if (Array.isArray(notes) && notes.length) buildFromVault(notes); })
      .catch(() => { /* placeholder disc stays */ });

    // --- ambient layers -------------------------------------------------
    const DUST = [];
    for (let i = 0; i < 90; i++){
      DUST.push({r: Math.pow(rnd(0.10, 1), 0.6) * 2.05, a: rnd(0, Math.PI * 2),
                 y: rnd(-0.012, 0.012), rx: rnd(0.05, 0.17), ry: rnd(0.008, 0.028),
                 alpha: rnd(0.18, 0.45)});
    }
    const FG = [];
    for (let i = 0; i < 8; i++){
      FG.push({x: Math.random(), y: Math.random(), s: rnd(1.3, 3.0),
               hue: rnd(190, 230), tw: Math.random() * Math.PI * 2});
    }

    const TILT = 1.46, COS_T = Math.cos(TILT), SIN_T = Math.sin(TILT);
    let w = 0, h = 0;
    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = Math.max(1, Math.round(w * dpr));
      cv.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    let spin = 0;
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      const scale = Math.max(w, h) * 0.40;
      const cx = w * 0.5, cy = h * 0.5;
      const K = scale * 2.4;
      // Differential rotation: inner rings sweep faster than the rim.
      const rot = r => spin * (1.5 - r * 0.42);

      const project = (r, ang, yOff) => {
        const x = Math.cos(ang) * r, z = Math.sin(ang) * r;
        const yt = yOff * COS_T - z * SIN_T;
        const zt = yOff * SIN_T + z * COS_T;
        const depth = 1 / (2.4 + zt);
        return {px: cx + x * K * depth, py: cy + yt * K * depth, depth, zt};
      };

      ctx.globalCompositeOperation = 'lighter';

      // 1. Halo
      const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 1.5);
      halo.addColorStop(0,    'rgba(150,90,190,.13)');
      halo.addColorStop(0.42, 'rgba(110,60,160,.08)');
      halo.addColorStop(1,    'rgba(40,20,70,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, w, h);

      // 1b. Ambient field behind the vault.
      for (const s of AMBIENT){
        const pr = project(s.r, s.a + rot(s.r), s.y);
        if (pr.px < -20 || pr.px > w + 20 || pr.py < -20 || pr.py > h + 20) continue;
        const tw = still ? 1 : 0.7 + Math.sin(spin * 6 + s.twinkle) * 0.3;
        ctx.fillStyle = `hsla(${s.hue},55%,${s.light}%,${(0.34 * Math.min(1, pr.depth * 2.4) * tw).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(pr.px, pr.py, Math.max(0.22, s.size * pr.depth * 2.2), 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Graph edges — note tethered to its folder, Obsidian-style.
      ctx.lineWidth = 0.5;
      for (const e of edges){
        const a = project(e.c.r, e.c.a + rot(e.c.r), e.c.y);
        const b = project(e.n.r, e.n.a + rot(e.n.r), e.n.y);
        if (b.px < -40 || b.px > w + 40) continue;
        ctx.strokeStyle = `hsla(${e.n.hue},80%,64%,${(0.055 * Math.min(1, b.depth * 2.4)).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
      }

      // 3. Folder cluster glows
      for (const c of clusters){
        const pr = project(c.r, c.a + rot(c.r), c.y);
        const rad = (0.05 + Math.min(0.09, c.count / 900)) * K * pr.depth;
        if (rad < 1) continue;
        const g = ctx.createRadialGradient(pr.px, pr.py, 0, pr.px, pr.py, rad);
        const a = 0.32 * Math.min(1, pr.depth * 2.4);
        g.addColorStop(0,   `hsla(${c.hue},92%,68%,${a.toFixed(3)})`);
        g.addColorStop(0.5, `hsla(${c.hue},90%,60%,${(a * 0.32).toFixed(3)})`);
        g.addColorStop(1,   `hsla(${c.hue},88%,54%,0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(pr.px, pr.py, rad, 0, Math.PI * 2); ctx.fill();
      }

      // 4. Notes, far side first
      const items = [];
      for (const n of nodes){
        const pr = project(n.r, n.a + rot(n.r), n.y);
        if (pr.px < -30 || pr.px > w + 30 || pr.py < -30 || pr.py > h + 30) continue;
        items.push({n, ...pr});
      }
      items.sort((a, b) => b.zt - a.zt);
      for (const it of items){
        const n = it.n;
        const tw = still ? 1 : 0.75 + Math.sin(spin * 7 + n.twinkle) * 0.25;
        const alpha = Math.min(0.92, it.depth * 2.4) * tw;
        ctx.fillStyle = `hsla(${n.hue},${n.sat}%,${n.light}%,${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(it.px, it.py, Math.max(0.3, n.size * it.depth * 2.4), 0, Math.PI * 2);
        ctx.fill();
      }

      // 5. Core — the vault itself
      const corePr = project(0, 0, 0);
      const coreR = scale * 0.30;
      const core = ctx.createRadialGradient(corePr.px, corePr.py, 0, corePr.px, corePr.py, coreR);
      core.addColorStop(0,    'rgba(255,244,214,.85)');
      core.addColorStop(0.16, 'rgba(255,206,120,.52)');
      core.addColorStop(0.45, 'rgba(238,138,72,.20)');
      core.addColorStop(1,    'rgba(180,70,60,0)');
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(corePr.px, corePr.py, coreR, 0, Math.PI * 2); ctx.fill();

      // 6. Folder names, very faint — makes it legible as *your* vault.
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = '600 10px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      for (const c of clusters){
        if (c.count < 4) continue;
        const pr = project(c.r, c.a + rot(c.r), c.y);
        if (pr.px < 40 || pr.px > w - 40) continue;
        ctx.fillStyle = `hsla(${c.hue},60%,80%,${(0.20 * Math.min(1, pr.depth * 2.4)).toFixed(3)})`;
        ctx.fillText(`${c.label} · ${c.count}`, pr.px, pr.py - 10);
      }
      ctx.textAlign = 'start';

      // 7. Dust lanes
      for (const d of DUST){
        const pr = project(d.r, d.a + rot(d.r), d.y);
        const rx = d.rx * K * pr.depth, ry = Math.max(0.6, d.ry * K * pr.depth);
        if (rx < 1 || pr.px < -200 || pr.px > w + 200) continue;
        ctx.save();
        ctx.translate(pr.px, pr.py);
        ctx.scale(1, ry / rx);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        const a = d.alpha * Math.min(1, pr.depth * 2.4);
        g.addColorStop(0,   `rgba(24,6,12,${a.toFixed(3)})`);
        g.addColorStop(0.6, `rgba(18,5,10,${(a * 0.55).toFixed(3)})`);
        g.addColorStop(1,   'rgba(12,4,8,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // 8. Foreground stars
      ctx.globalCompositeOperation = 'lighter';
      for (const f of FG){
        const x = f.x * w, y = f.y * h;
        const tw = still ? 1 : 0.7 + Math.sin(spin * 9 + f.tw) * 0.3;
        const s = f.s * tw;
        const g = ctx.createRadialGradient(x, y, 0, x, y, s * 7);
        g.addColorStop(0, `hsla(${f.hue},60%,98%,${(0.85 * tw).toFixed(3)})`);
        g.addColorStop(0.3, `hsla(${f.hue},70%,80%,${(0.24 * tw).toFixed(3)})`);
        g.addColorStop(1, `hsla(${f.hue},70%,70%,0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, s * 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `hsla(${f.hue},50%,96%,${(0.42 * tw).toFixed(3)})`;
        ctx.lineWidth = Math.max(0.5, s * 0.26);
        ctx.beginPath();
        ctx.moveTo(x - s * 9, y); ctx.lineTo(x + s * 9, y);
        ctx.moveTo(x, y - s * 9); ctx.lineTo(x, y + s * 9);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';

      if (!still) spin += 0.00055;
      this._galaxyRAF = requestAnimationFrame(draw);
    };

    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(this._galaxyRAF);
      if (document.visibilityState !== 'hidden'){
        this._galaxyRAF = requestAnimationFrame(draw);
      }
    });
    draw();
  },

  initPlayer(){
    const p = this.player;
    try { p.queue = JSON.parse(LS.get('blanco_os_queue', '[]')) || []; } catch (err) { p.queue = []; }
    p.idx = Math.min(parseInt(LS.get('blanco_os_queue_idx', '-1'), 10), p.queue.length - 1);
    if (!Number.isFinite(p.idx)) p.idx = -1;

    // The iframe host hangs off <body>, never inside a rendered view — moving
    // or re-creating an iframe restarts playback.
    if (!$('ytHost')){
      const host = document.createElement('div');
      host.id = 'ytHost';
      document.body.appendChild(host);
    }
    this._ytWait = new Promise(resolve => { this._ytResolve = resolve; });
    window.onYouTubeIframeAPIReady = () => {
      try {
        this.yt = new YT.Player('ytHost', {
          height: '1', width: '1',
          playerVars: {autoplay: 0, controls: 0, playsinline: 1, origin: location.origin},
          events: {
            onReady: () => {
              this.ytReady = true;
              try { this.yt.setVolume(this.playerVol()); } catch (err) {}
              this._ytResolve(true);
              this.paintPlayer();
            },
            onStateChange: e => this.ytState(e),
            onError: () => { this.player.err = 'That video can’t be played here.'; this.paintPlayer(); },
          },
        });
      } catch (err) { this._ytResolve(false); }
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = () => { this.player.err = 'Offline — playback unavailable.'; this._ytResolve(false); this.paintPlayer(); };
    document.head.appendChild(s);

    setInterval(() => this.tickPlayer(), 500);
  },

  /* Resolves false rather than hanging, so the alarm can fall back to a beep. */
  ytEnsure(ms = 2500){
    if (this.ytReady) return Promise.resolve(true);
    return Promise.race([
      this._ytWait || Promise.resolve(false),
      new Promise(r => setTimeout(() => r(false), ms)),
    ]).then(ok => !!(ok && this.ytReady));
  },

  playerVol(){
    const v = parseInt(LS.get('blanco_os_player_volume', '70'), 10);
    return Number.isFinite(v) ? Math.min(100, Math.max(0, v)) : 70;
  },

  ytState(e){
    const p = this.player;
    const st = e.data;
    p.playing = st === YT.PlayerState.PLAYING;
    p.loading = st === YT.PlayerState.BUFFERING;
    if (st === YT.PlayerState.ENDED){
      if (p.alarm){ this.stopAlarm(); return; }   // alarm song finished on its own
      this.playerNext(true);
      return;
    }
    this.paintPlayer();
  },

  tickPlayer(){
    const p = this.player;
    if (!this.ytReady || !this.yt) return;
    try {
      p.cur = this.yt.getCurrentTime() || 0;
      p.dur = this.yt.getDuration() || 0;
    } catch (err) { return; }
    this.paintPlayer();
  },

  saveQueue(){
    LS.set('blanco_os_queue', JSON.stringify(this.player.queue.slice(0, 60)));
    LS.set('blanco_os_queue_idx', String(this.player.idx));
  },

  /* oEmbed gives title / channel / album art. If it fails (private, deleted,
     offline) fall back to the thumbnail CDN, which needs no API call. */
  async ytMeta(id, rawUrl){
    const target = id ? 'https://www.youtube.com/watch?v=' + id : rawUrl;
    const fallback = {
      id, title: id ? 'YouTube video' : 'YouTube playlist', author: 'YouTube',
      thumb: id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '',
    };
    try {
      const res = await fetch('https://www.youtube.com/oembed?url=' +
                              encodeURIComponent(target) + '&format=json');
      if (!res.ok) return fallback;
      const j = await res.json();
      return {id, title: j.title || fallback.title, author: j.author_name || 'YouTube',
              thumb: j.thumbnail_url || fallback.thumb};
    } catch (err) { return fallback; }
  },

  async playerAdd(raw){
    const p = this.player;
    const url = String(raw ?? (($('pUrl') || {}).value || '')).trim();
    if (!url) return;
    const parsed = ytParse(url);
    if (!parsed){
      p.err = 'Couldn’t load — check the link.';
      this.paintPlayer();
      return;
    }
    p.err = '';
    this.clearField($('pUrl'));
    const meta = await this.ytMeta(parsed.id, url);
    p.queue.push({id: parsed.id, list: parsed.list, title: meta.title, author: meta.author, thumb: meta.thumb});
    this.saveQueue();
    this.paintQueue();
    // Pasting is the user gesture that lets YouTube start with sound on.
    if (!p.playing || p.idx < 0) this.playerPlayIdx(p.queue.length - 1);
    else this.paintPlayer();
  },

  async playerPlayIdx(i){
    const p = this.player;
    const item = p.queue[i];
    if (!item) return;
    if (p.alarm) this.stopAlarm();
    const ok = await this.ytEnsure(6000);
    if (!ok){
      p.err = 'Player not ready — check the connection.';
      this.paintPlayer();
      return;
    }
    p.idx = i;
    p.err = '';
    this.saveQueue();
    try {
      this.yt.unMute();
      this.yt.setVolume(this.playerVol());
      if (item.list) this.yt.loadPlaylist({list: item.list, index: 0});
      else this.yt.loadVideoById(item.id);
      this.yt.playVideo();
    } catch (err) { p.err = 'Could not start that one.'; }
    this.paintQueue();
    this.paintPlayer();
  },

  playerToggle(){
    const p = this.player;
    if (!this.ytReady){
      if (p.queue.length) this.playerPlayIdx(p.idx >= 0 ? p.idx : 0);
      return;
    }
    try {
      if (p.playing) this.yt.pauseVideo();
      else if (p.idx < 0 && p.queue.length) this.playerPlayIdx(0);
      else this.yt.playVideo();
    } catch (err) {}
  },

  playerNext(auto){
    const p = this.player;
    if (!p.queue.length) return;
    const next = p.idx + 1;
    if (next >= p.queue.length){
      if (auto){ p.playing = false; this.paintPlayer(); return; }   // end of queue
      return this.playerPlayIdx(0);
    }
    this.playerPlayIdx(next);
  },
  playerPrev(){
    const p = this.player;
    if (!p.queue.length) return;
    // Restart the song first, like every other music player.
    if (p.cur > 4 && this.ytReady){ try { this.yt.seekTo(0, true); return; } catch (err) {} }
    this.playerPlayIdx(p.idx <= 0 ? p.queue.length - 1 : p.idx - 1);
  },
  playerSeek(ev){
    const p = this.player;
    if (!this.ytReady || !p.dur) return;
    const r = ev.currentTarget.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    try { this.yt.seekTo(p.dur * pct, true); } catch (err) {}
  },
  playerSetVol(v){
    LS.set('blanco_os_player_volume', String(v));
    if (this.ytReady){ try { this.yt.setVolume(parseInt(v, 10) || 0); } catch (err) {} }
  },
  playerRemove(i, ev){
    if (ev) ev.stopPropagation();
    const p = this.player;
    p.queue.splice(i, 1);
    if (i < p.idx) p.idx--;
    else if (i === p.idx){
      p.idx = -1;
      if (this.ytReady){ try { this.yt.stopVideo(); } catch (err) {} }
      p.playing = false;
    }
    this.saveQueue();
    this.paintQueue();
    this.paintPlayer();
  },
  playerClear(){
    const p = this.player;
    p.queue = [];
    p.idx = -1;
    p.playing = false;
    if (this.ytReady){ try { this.yt.stopVideo(); } catch (err) {} }
    this.saveQueue();
    this.paintQueue();
    this.paintPlayer();
  },

  /* Optional search — only when Blanco has pasted his own Data API key. */
  ytKey(){ return LS.get('blanco_os_yt_key', ''); },
  saveYtKey(){
    const v = (($('pKey') || {}).value || '').trim();
    if (v) LS.set('blanco_os_yt_key', v); else LS.del('blanco_os_yt_key');
    this.render();
  },
  async ytSearch(){
    const q = (($('pQ') || {}).value || '').trim();
    const out = $('pResults');
    if (!q || !out) return;
    out.innerHTML = '<div class="tiny">Searching…</div>';
    try {
      const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video' +
                  '&maxResults=8&q=' + encodeURIComponent(q) + '&key=' + encodeURIComponent(this.ytKey());
      const res = await fetch(url);
      if (!res.ok) throw new Error('search failed (' + res.status + ')');
      const j = await res.json();
      const items = j.items || [];
      if (!items.length){ out.innerHTML = '<div class="tiny">Nothing found.</div>'; return; }
      out.innerHTML = items.map(it => {
        const id = it.id.videoId;
        const s = it.snippet;
        return `<div class="qrow" onclick="App.playerAdd('${esc(id)}')">
          <img src="${esc((s.thumbnails.default || {}).url || '')}" alt="">
          <div style="min-width:0">
            <div style="font-size:12px;overflow-wrap:anywhere">${esc(s.title)}</div>
            <div class="tiny">${esc(s.channelTitle)}</div>
          </div>
          <span class="qx">+ add</span>
        </div>`;
      }).join('');
    } catch (err) {
      out.innerHTML = `<div class="tiny" style="color:#ff8a94">${esc(err.message)}</div>`;
    }
  },

  playerCardHTML(){
    const p = this.player;
    const now = p.idx >= 0 ? p.queue[p.idx] : null;
    const vol = this.playerVol();
    const hasKey = !!this.ytKey();

    const art = now && now.thumb
      ? `<img class="art" id="pArt" src="${esc(now.thumb)}" alt="">`
      : `<div class="art ph" id="pArt">🎵</div>`;

    const search = hasKey
      ? `<div class="prow" style="margin-top:14px">
           <input id="pQ" class="search" placeholder="search YouTube…"
                  style="flex:1;min-width:150px;padding:9px 10px;font-family:var(--sans)"
                  onkeydown="if(event.key==='Enter')App.ytSearch()">
           <button class="ack" style="margin:0" onclick="App.ytSearch()">Search</button>
         </div>
         <div id="pResults" style="margin-top:8px"></div>`
      : `<details style="margin-top:14px">
           <summary class="tiny" style="cursor:pointer">Add a YouTube API key to search by name</summary>
           <div class="prow" style="margin-top:10px">
             <input id="pKey" class="search" placeholder="YouTube Data API v3 key"
                    style="flex:1;min-width:150px;padding:9px 10px;font-family:var(--mono);font-size:11px">
             <button class="ack" style="margin:0" onclick="App.saveYtKey()">Save</button>
           </div>
           <div class="tiny" style="margin-top:6px">Stored only in this browser. Without a key, paste links.</div>
         </details>`;

    return `<div class="card" id="playerCard" style="${p.alarm ? 'border-color:rgba(255,45,61,.5)' : ''}">
      <div class="cardhead">
        <h2>🎵 Sound Player</h2>
        <span class="tiny" id="pState">${p.alarm ? 'ALARM' : (p.playing ? 'PLAYING' : 'IDLE')}</span>
      </div>
      <div class="player${p.alarm ? ' alarm' : ''}" id="playerBody">
        ${art}
        <div style="min-width:0">
          <div class="ptitle" id="pTitle">${esc(now ? now.title : 'Nothing queued')}</div>
          <div class="pby" id="pBy">${esc(now ? now.author : 'Paste a YouTube link to start')}</div>
          <div class="pseek" onclick="App.playerSeek(event)"><i id="pBar"></i></div>
          <div class="prow">
            <span class="tiny" id="pTime">0:00 / 0:00</span>
            <span style="flex:1"></span>
            <button class="pbtn" title="Previous" onclick="App.playerPrev()">⏮</button>
            <button class="pbtn main" id="pPlay" title="Play / pause" onclick="App.playerToggle()">${p.playing ? '⏸' : '▶'}</button>
            <button class="pbtn" title="Next" onclick="App.playerNext()">⏭</button>
            <span class="tiny">🔊</span>
            <input class="pvol" type="range" min="0" max="100" value="${vol}" oninput="App.playerSetVol(this.value)">
          </div>
        </div>
      </div>
      <div class="prow" style="margin-top:16px">
        <input id="pUrl" class="search" placeholder="paste a YouTube video or playlist link…"
               style="flex:1;min-width:180px;padding:9px 10px;font-family:var(--sans)"
               onkeydown="if(event.key==='Enter')App.playerAdd()">
        <button class="ack" style="margin:0" onclick="App.playerAdd()">Add</button>
      </div>
      <div class="tiny" id="pErr" style="margin-top:8px;color:#ff8a94"${p.err ? '' : ' hidden'}>${esc(p.err)}</div>
      ${search}
      <div class="cardhead" style="margin:18px 0 0">
        <span class="lbl tiny">QUEUE · <span id="pCount">${p.queue.length}</span></span>
        ${p.queue.length ? '<button class="qx" onclick="App.playerClear()">clear all</button>' : ''}
      </div>
      <div id="pQueue"></div>
      <!-- Filled by paintExternal(). Sits below the queue because it is the
           secondary player: the deck's own queue stays the primary one. -->
      <div id="extHost"></div>
    </div>`;
  },

  /* Whatever is playing in another app — a browser tab, YourMusic, Spotify.
     Rendered only when there is something to show; on a machine with no
     Windows underneath this stays empty and no error chrome appears. */
  externalStripHTML(){
    if (!this.extIsLive()) return '';
    const e = this.extTarget();
    // Dimmed while the deck's own player is going, so it is obvious which one
    // the big transport buttons above belong to.
    const dim = this.player.playing;
    const art = e.thumbnail
      ? `<img class="extart" src="${esc(e.thumbnail)}" alt="">`
      : `<div class="extart ph">🔊</div>`;
    const pct = e.duration_secs
      ? Math.min(100, (e.position_secs / e.duration_secs) * 100) : 0;
    const time = e.duration_secs
      ? fmtTime(e.position_secs) + ' / ' + fmtTime(e.duration_secs) : '';
    const app = e.app_id ? `'${esc(e.app_id)}'` : "''";
    // Windows reports what each app will actually accept. A YouTube tab takes
    // a seek; a live stream does not — so the control is greyed rather than
    // offered and silently ignored.
    const btn = (icon, action, title, enabled) =>
      `<button class="fmbtn" title="${title}" ${enabled ? '' : 'disabled style="opacity:.35"'}
        onclick="App.extControl('${action}', ${app})">${icon}</button>`;

    return `<div class="extstrip${dim ? ' dim' : ''}">
      ${art}
      <div style="min-width:0;flex:1">
        <div class="tiny" style="letter-spacing:1.5px;color:#726c6f">
          PLAYING ELSEWHERE${e.app_label ? ' · ' + esc(e.app_label.toUpperCase()) : ''}</div>
        <div class="pstitle">${esc(e.title)}</div>
        <div class="tiny" style="margin-top:1px">${esc(e.artist || e.app_label || '')}</div>
        ${e.duration_secs ? `<div class="extseek" style="margin-top:7px">
          <input type="range" min="0" max="${e.duration_secs}" value="${e.position_secs}"
                 ${e.can_seek ? '' : 'disabled'}
                 title="${e.can_seek ? 'Scrub' : 'This player does not allow seeking'}"
                 onchange="App.extControl('seek', ${app}, this.value)">
          <i style="width:${pct}%"></i>
        </div>` : ''}
        ${this.extPickerHTML()}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${time ? `<span class="tiny" style="min-width:78px">${time}</span>` : ''}
        ${btn('⏮', 'previous', 'Previous', e.can_previous !== false)}
        ${e.status === 'playing'
          // Explicit play/pause rather than a toggle: a toggle fired from a
          // strip that is a second out of date does the opposite of what the
          // button said.
          ? btn('⏸', 'pause', 'Pause', true)
          : btn('▶', 'play', 'Play', true)}
        ${btn('⏭', 'next', 'Next', e.can_next !== false)}
      </div>
    </div>`;
  },

  /* Only drawn when more than one app is actually playing something. With a
     single player it would be a label pretending to be a control. */
  extPickerHTML(){
    const sessions = (this.external.sessions || []);
    if (sessions.length < 2) return '';
    const current = this.extTarget().app_id;
    return `<div class="filters" style="margin:8px 0 0;flex-wrap:wrap">
      ${sessions.map(s => `<button class="${current === s.app_id ? 'on' : ''}"
        onclick="App.extSelect('${esc(s.app_id)}')" title="${esc(s.title)}"
        >${s.status === 'playing' ? '▸ ' : ''}${esc(s.app_label || s.app_id)}</button>`).join('')}
    </div>`;
  },

  /* Which player the strip is driving: the one Blanco picked, if it is still
     playing, otherwise whatever Windows considers current. Falling back rather
     than holding a dead selection means closing a tab never leaves the strip
     pointed at nothing. */
  extTarget(){
    const e = this.external;
    const picked = (e.sessions || []).find(s => s.app_id === this.extPicked);
    return picked ? {...e, ...picked} : e;
  },
  extPicked: null,

  extSelect(appId){
    this.extPicked = appId === this.extPicked ? null : appId;
    this.paintExternal(true);
  },

  /* Patched in place rather than rebuilt on every poll, so the buttons do not
     flicker under the cursor and a half-dragged scrubber is not yanked back. */
  paintExternal(force){
    const host = $('extHost');
    if (!host) return;
    const e = this.extTarget();
    const sig = [this.extIsLive(), e.app_id, e.title, e.status,
                 (this.external.sessions || []).length,
                 Math.floor((e.position_secs || 0) / 2), this.player.playing].join('|');
    if (!force && host.dataset.sig === sig) return;
    host.dataset.sig = sig;
    host.innerHTML = this.externalStripHTML();
  },

  /* The Command Deck widget, directly under the focus timer. Always on —
     idle it is the place to paste a link, playing it is the transport. Same
     player instance as the Focus Timer card. */
  playerStripHTML(){
    const p = this.player;
    const now = p.idx >= 0 ? p.queue[p.idx] : null;
    const accent = p.alarm ? '#ff5b66' : '#726c6f';
    const label = p.alarm ? '🔔 ALARM' : (p.playing ? '🎵 NOW PLAYING' : '🎵 SOUND PLAYER');
    const title = now ? now.title : (p.alarm ? 'Alarm song' : 'Nothing playing');
    const sub = now ? now.author : 'Paste a YouTube link to start';

    const art = now && now.thumb
      ? `<img id="psArt" src="${esc(now.thumb)}" alt="">`
      : `<div id="psArt" class="psph">🎵</div>`;

    return `<div class="pstrip${p.alarm ? ' alarm' : ''}" id="playerStrip">
      ${art}
      <div class="psmain">
        <div class="tiny" style="letter-spacing:1.5px;color:${accent}">${label}</div>
        <div id="psTitle" class="pstitle">${esc(title)}</div>
        <div id="psBy" class="tiny" style="margin-top:1px">${esc(sub)}</div>
        <div class="fmbar" style="margin-top:7px;cursor:pointer" onclick="App.playerSeek(event)">
          <i id="psBar" style="width:0;background:${p.alarm ? '#ff5b66' : '#ff2d3d'}"></i></div>
      </div>
      <div class="psctl">
        <div style="display:flex;gap:6px;align-items:center">
          <button class="fmbtn" title="Previous" onclick="App.playerPrev()">⏮</button>
          <button class="fmbtn" id="psPlay" title="Play / pause" onclick="App.playerToggle()">${p.playing ? '⏸' : '▶'}</button>
          <button class="fmbtn" title="Next" onclick="App.playerNext()">⏭</button>
          <span class="tiny" id="psTime" style="margin-left:4px;min-width:78px">0:00 / 0:00</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <input id="psUrl" class="search psurl" placeholder="paste a YouTube link…"
                 onkeydown="if(event.key==='Enter')App.playerAddFrom('psUrl')">
          <button class="fmbtn" onclick="App.playerAddFrom('psUrl')">Add</button>
          <button class="fmbtn" title="Open the full player" onclick="App.openPlayerModal()">⤢</button>
        </div>
      </div>
    </div>`;
  },

  /* The big player lives in a modal rather than on a page, so it's reachable
     from anywhere without the deck losing the view you were on. */
  openPlayerModal(){
    const box = $('playerModalBody'), modal = $('playerModal');
    if (!box || !modal) return;
    box.innerHTML = this.playerCardHTML();
    modal.hidden = false;
    // The card is brand-new DOM — fill in the live state it expects.
    this.paintQueue();
    this.paintPlayer();
  },

  closePlayerModal(ev){
    // Backdrop clicks bubble here; clicks inside the box are stopped already.
