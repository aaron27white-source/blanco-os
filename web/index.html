  /* Cheap, runs twice a second — text and widths only. Anything that rebuilds
     DOM (the queue list) goes in paintQueue so hover and scroll survive. */
  paintPlayer(){
    const p = this.player;
    const now = p.idx >= 0 ? p.queue[p.idx] : null;
    const pct = p.dur ? Math.min(100, (p.cur / p.dur) * 100) : 0;
    const set = (id, fn) => { const el = $(id); if (el) fn(el); };

    const clock = fmtTime(p.cur) + ' / ' + fmtTime(p.dur);
    set('pBar', el => { el.style.width = pct + '%'; });
    set('psBar', el => { el.style.width = pct + '%'; });
    set('pTime', el => { el.textContent = clock; });
    set('psTime', el => { el.textContent = clock; });
    set('psTitle', el => { el.textContent = now ? now.title : (p.alarm ? 'Alarm song' : 'Nothing playing'); });
    // Collapsed label carries the state, so the widget is useful unhovered.
    set('spWord', el => {
      el.textContent = p.alarm ? '🔔 ALARM' : (now ? (p.playing ? '♫ ' : '❚❚ ') + now.title : '♫ SOUND');
      el.style.color = p.alarm ? 'var(--red)' : 'var(--ember)';
    });
    set('psBy', el => { el.textContent = now ? now.author : 'Paste a YouTube link to start'; });
    set('psArt', el => {
      if (!now || !now.thumb) return;
      if (el.tagName === 'IMG'){ if (el.src !== now.thumb) el.src = now.thumb; }
      else el.outerHTML = `<img id="psArt" src="${esc(now.thumb)}" alt="">`;
    });
    set('pPlay', el => { el.textContent = p.playing ? '⏸' : '▶'; });
    set('psPlay', el => { el.textContent = p.playing ? '⏸' : '▶'; });
    set('pState', el => { el.textContent = p.alarm ? 'ALARM' : (p.playing ? 'PLAYING' : (p.loading ? 'LOADING' : 'IDLE')); });
    set('pTitle', el => { el.textContent = now ? now.title : 'Nothing queued'; });
    set('pBy', el => { el.textContent = now ? now.author : 'Paste a YouTube link to start'; });
    set('pCount', el => { el.textContent = p.queue.length; });
    set('pErr', el => { el.textContent = p.err; el.hidden = !p.err; });
    set('playerCard', el => { el.style.borderColor = p.alarm ? 'rgba(255,45,61,.5)' : ''; });
    set('playerBody', el => { el.classList.toggle('alarm', !!p.alarm); });
    set('pArt', el => {
      if (!now || !now.thumb) return;
      if (el.tagName === 'IMG'){ if (el.src !== now.thumb) el.src = now.thumb; }
      else el.outerHTML = `<img class="art" id="pArt" src="${esc(now.thumb)}" alt="">`;
    });

    // The widget is patched in place above; it is only rebuilt when its shape
    // changes (art placeholder ⇄ image, alarm styling). Whatever is half-typed
    // in the link box — and the caret — has to survive that.
    const host = $('playerStripHost');
    if (host){
      const want = [now ? now.id : '', !!(now && now.thumb), p.alarm].join('|');
      if (host.dataset.sig !== want){
        const old = $('psUrl');
        const draft = old ? old.value : '';
        const focused = old && document.activeElement === old;
        const caret = focused ? old.selectionStart : 0;
        host.dataset.sig = want;
        host.innerHTML = this.playerStripHTML();
        const box = $('psUrl');
        if (box && draft){
          box.value = draft;
          if (focused){ box.focus(); try { box.setSelectionRange(caret, caret); } catch (err) {} }
        }
      }
    }

    // Both cheap — each bails on an unchanged signature.
    this.paintExternal();
    this.publishMediaSession();
  },

  /* The other direction: tell Windows what the deck itself is playing.
     Registering here puts Blanco OS in the OS media overlay and binds the
     keyboard's media keys to it, exactly like YourMusic or Spotify — and it is
     what lets this deck show up in the same session list it reads above. */
  publishMediaSession(){
    if (!('mediaSession' in navigator)) return;
    const p = this.player;
    const now = p.idx >= 0 ? p.queue[p.idx] : null;
    const sig = [now ? now.id : '', p.playing].join('|');
    if (this._mediaSig === sig) return;
    this._mediaSig = sig;

    try {
      if (!now){
        navigator.mediaSession.metadata = null;
        navigator.mediaSession.playbackState = 'none';
        return;
      }
      navigator.mediaSession.metadata = new MediaMetadata({
        title: now.title || 'Blanco OS',
        artist: now.author || 'YouTube',
        album: 'Blanco OS',
        artwork: now.thumb ? [{src: now.thumb, sizes: '480x360', type: 'image/jpeg'}] : [],
      });
      navigator.mediaSession.playbackState = p.playing ? 'playing' : 'paused';
      if (!this._mediaHandlers){
        this._mediaHandlers = true;
        const bind = (action, fn) => {
          try { navigator.mediaSession.setActionHandler(action, fn); }
          catch (err) { /* not every browser supports every action */ }
        };
        bind('play',         () => this.playerToggle());
        bind('pause',        () => this.playerToggle());
        bind('nexttrack',    () => this.playerNext());
        bind('previoustrack', () => this.playerPrev());
      }
    } catch (err) { /* metadata is a nicety; never let it break the player */ }
  },

    const openCount = all.filter(a => OPEN.includes(a.status)).length;

    const chip = (key, label, n) => `<button class="${filter===key?'on':''}"

      // scroll the list back to the top mid-triage.
      const list = this.data.annotations || [];

          </div>`).join('')}</div></div>`
      : '';

    /* Annotations on the home screen shows only what is still on his plate.
       The full register is a tab; a wall of `active` rows here would bury the
       two or three that actually need something doing. */
    const anns = this.data.annotations || [];
    const openAnns = anns.filter(a => ['needs_finish', 'blocked'].includes(a.status));
    const annBody = anns.length
      ? (openAnns.length
          ? `<div class="rowlist">${openAnns.map(a => `<div class="row" style="cursor:pointer"
                 onclick="App.setBizTab('annotations')">
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600">${esc(a.company)}</div>
                ${a.project ? `<div class="tiny" style="margin-top:2px">${esc(a.project)}</div>` : ''}
                <div style="font-size:12px;margin-top:4px;color:${a.next_action ? '#ff8a94' : '#5c5659'}">
                  ${a.next_action ? '▸ ' + esc(a.next_action) : '▸ no next action set'}</div>
              </div>
              ${pill(a.status.replace('_', ' '), ANNOTATION_STATUS_COLOR[a.status])}
            </div>`).join('')}</div>`
          : '<div class="empty" style="margin-top:8px">Nothing outstanding — every account is clear.</div>')
      : `<div class="empty" style="margin-top:8px">No companies registered yet.</div>`;

    const annotations = `<div class="card">
      <div class="cardhead">
        <h2>Annotations${openAnns.length ? ' — ' + openAnns.length + ' open' : ''}</h2>
        <button class="chip" style="cursor:pointer" onclick="App.setBizTab('annotations')">
          all ${anns.length}</button>

    return `<div class="stack">
      <div class="tiles">${tiles}</div>
      <div class="card"><h2>Divisions — ${k.divisions.length}</h2><div class="rowlist">${cards}</div></div>
      ${annotations}

  },

  /* One division: its streams, its pipeline, and the fields Blanco owns. */
  view_bizDivision(id){

    if (!d) return '<div class="empty">No such division.</div>';
    const open = this.editingDivision === d.id;
    const STAGES = ['unset','idea','building','piloting','earning','paused','archived'];
    const HEALTHS = ['unknown','green','yellow','red'];
    const pct = d.monthly_target ? Math.min(100, Math.round((d.attainment || 0) * 100)) : 0;

    const header = `<div class="card">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <span style="font-size:26px;flex-shrink:0">${d.emoji}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:600">${esc(d.name)}</div>
          ${d.tagline ? `<div style="font-size:12px;color:#8a8386;margin-top:3px">${esc(d.tagline)}</div>` : ''}
          ${d.vault_path ? `<div class="tiny" style="margin-top:4px;color:#5c5659;overflow-wrap:anywhere">${esc(d.vault_path)}</div>` : ''}
          <div style="font-size:13px;margin-top:10px;color:${d.next_action ? '#ff8a94' : '#5c5659'}">
            ${d.next_action ? '▸ ' + esc(d.next_action) : '▸ no next action set'}</div>
          ${d.monthly_target ? `<div class="bar" style="max-width:320px"><i style="width:${pct}%"></i></div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0">
          ${d.stage === 'unset'
            ? '<span class="pill" style="color:#5c5659;background:rgba(255,255,255,.03)">stage not set</span>'

          <span class="mono" style="font-size:13px">${
            d.monthly_target
              ? money(d.monthly_actual) + '<span style="color:#726c6f"> / ' + money(d.monthly_target) + '</span>'
              : money(d.monthly_actual) + '<span style="color:#5c5659"> · no target</span>'}</span>
          <button class="chip" style="cursor:pointer" onclick="App.toggleDivisionEdit('${d.id}')">

        </div>
      </div>

      ${open ? `<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);
                  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px">
          <span class="lbl tiny">STAGE</span>
          <select id="d-stage-${d.id}" class="search" style="padding:9px 10px">

        </label>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span class="lbl tiny">HEALTH</span>
          <select id="d-health-${d.id}" class="search" style="padding:9px 10px">

        <label style="display:flex;flex-direction:column;gap:6px">

          <input id="d-target-${d.id}" class="search" type="number" min="0" step="50"
                 style="padding:9px 10px" value="${d.monthly_target || ''}" placeholder="0">
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;grid-column:1/-1">
          <span class="lbl tiny">NEXT ACTION</span>
          <input id="d-next-${d.id}" class="search" style="padding:9px 10px;font-family:var(--sans)"
                 value="${esc(d.next_action)}" placeholder="The one thing that would move this division">
        </label>
        <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap">
          <button class="ack" style="margin:0" onclick="App.saveDivision('${d.id}')">Save</button>
          <button class="ack" style="margin:0" onclick="App.toggleDivisionEdit('${d.id}')">Cancel</button>
        </div>
      </div>` : ''}
    </div>`;

    const streams = d.ventures.length
      ? `<div class="rowlist">${d.ventures.map(v => `<div class="row">
          <span style="font-size:18px;flex-shrink:0">${v.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(v.name)}</div>
            ${v.thesis ? `<div class="tiny" style="margin-top:2px">${esc(v.thesis)}</div>` : ''}
          </div>
          ${v.stage === 'unset' ? '' : pill(v.stage, C.stage[v.stage] || C.stage.idea)}
          <span class="mono" style="font-size:13px;flex-shrink:0">${money(v.monthly_actual)}</span>
        </div>`).join('')}</div>`
      : `<div class="empty">No streams under ${esc(d.name)} yet.<br><br>
          Ventures live on the Investments tab —<br>attach one here with<br>
          <span style="color:#ff8a94">PUT /api/biz/divisions/${d.id}/ventures/{id}</span></div>`;

    const deals = (this.data.deals || []).filter(x => x.division_id === d.id);
    const byStage = DEAL_STAGES.map(stage => {
      const rows = deals.filter(x => x.stage === stage);
      if (!rows.length) return '';
      return `<div style="margin-top:10px">
        <div class="lbl tiny" style="color:${C.deal[stage]}">${stage.toUpperCase()} — ${rows.length}</div>
        <div class="rowlist" style="margin-top:6px">${rows.map(x => `<div class="row">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(x.client)}</div>
            ${x.title ? `<div class="tiny" style="margin-top:2px">${esc(x.title)}</div>` : ''}
            ${x.next_action ? `<div style="font-size:12px;color:#ff8a94;margin-top:3px">▸ ${esc(x.next_action)}</div>` : ''}
            ${x.source ? `<div class="tiny" style="margin-top:2px;color:#5c5659">via ${esc(x.source)}</div>` : ''}
            ${(() => {
              // A proposal link parked in the deal's notes becomes a chip. https
              // only, so a pasted javascript: URL can never become a live link.
              const url = ((x.notes || '').match(/https:\/\/[^\s<>"']+/) || [])[0];
              return url ? `<a class="chip" href="${esc(url)}" target="_blank" rel="noopener"
                style="text-decoration:none;display:inline-block;margin-top:6px">open proposal ↗</a>` : '';
            })()}
          </div>
          <span class="mono" style="font-size:13px;flex-shrink:0">${money(x.value)}</span>
          <select class="search" style="padding:6px 8px;max-width:120px;flex-shrink:0"
                  onchange="App.moveDeal(${x.id}, this.value)">
            ${DEAL_STAGES.map(s => `<option value="${s}"${s===x.stage?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>`).join('')}</div></div>`;
    }).join('');

    const adding = this.addingDeal === d.id;
    const pipeline = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2 style="margin:0">Pipeline — ${money(d.pipeline_value)} open</h2>
        <button class="ack" style="margin:0" onclick="App.toggleAddDeal('${d.id}')">
          ${adding ? 'Cancel' : '+ deal'}</button>
      </div>

      ${adding ? `<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);
                    display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px">
          <span class="lbl tiny">CLIENT *</span>
          <input id="nd-client-${d.id}" class="search" style="padding:9px 10px;font-family:var(--sans)"
                 placeholder="Who">
        </label>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span class="lbl tiny">VALUE ($)</span>
          <input id="nd-value-${d.id}" class="search" type="number" min="0" step="50"
                 style="padding:9px 10px" placeholder="0">
        </label>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span class="lbl tiny">STAGE</span>
          <select id="nd-stage-${d.id}" class="search" style="padding:9px 10px">
            ${DEAL_STAGES.map(s => `<option value="${s}"${s==='lead'?' selected':''}>${s}</option>`).join('')}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span class="lbl tiny">SOURCE</span>
          <input id="nd-source-${d.id}" class="search" style="padding:9px 10px;font-family:var(--sans)"
                 placeholder="example.com, referral…">
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;grid-column:1/-1">
          <span class="lbl tiny">WHAT THE WORK IS</span>
          <input id="nd-title-${d.id}" class="search" style="padding:9px 10px;font-family:var(--sans)"
                 placeholder="Missed-call text-back build">
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;grid-column:1/-1">
          <span class="lbl tiny">NEXT ACTION</span>
          <input id="nd-next-${d.id}" class="search" style="padding:9px 10px;font-family:var(--sans)"
                 placeholder="Send the proposal">
        </label>
        <div style="grid-column:1/-1">
          <button class="ack" style="margin:0" onclick="App.addDeal('${d.id}')">Open deal</button>
        </div>
      </div>` : ''}

      ${byStage || (adding ? '' : '<div class="empty">No deals yet.</div>')}
    </div>`;

    // Freight is built around its playbook; the generic streams card has
    // nothing to say until a brokerage exists, so the journey replaces it.
    if (d.id === 'freight') return `<div class="stack">${header}${this.view_freight()}${pipeline}</div>`;
    // Freelance is run by its proposal writer: paste a job, get the bid.
    if (d.id === 'freelance') return `<div class="stack">${header}${this.view_freelance()}${pipeline}</div>`;
    return `<div class="stack">${header}
      <div class="card"><h2>Streams — ${d.ventures.length}</h2>${streams}</div>
      ${pipeline}</div>`;
  },

  /* ---------------- Your Business · Freelance ----------------
     The Proposals ✍️ agent on the page itself. Nothing new on the server:
     the card composes a message and sends it through the corner dock, which
     already points bridge/freelance at claude:proposals. So the reply streams
     into the same thread the dock shows, and the Command Deck lists it too. */
  freelancePlatform: 'Upwork',
  view_freelance(){
    const who = this.dockRoster().find(a => a.id === 'proposals')
             || {name:'Proposals', emoji:'✍️', role:''};
    const platforms = ['Upwork', 'Fiverr', 'Contra', 'Freelancer', 'PeoplePerHour', 'Other'];
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px">✍️</span>
        <div style="flex:1;min-width:0">
          <h2 style="margin:0">${esc(who.name)} — proposal writer</h2>
          <div class="tiny" style="margin-top:3px;color:#8a8386">Paste a job post. You get a bid-or-skip call, the proposal,
            screening answers, a suggested price and notes. Claims come only from Freelance-Proof-Bank.md.</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        ${platforms.map(p => `<button class="chip" style="cursor:pointer;${p === this.freelancePlatform
            ? 'color:#ff8a94;border-color:rgba(255,45,61,.5)' : ''}"
            onclick="App.freelancePlatform='${p}';App.render()">${p}</button>`).join('')}
      </div>
      <textarea id="fl-job" class="search" rows="7"
        style="width:100%;margin-top:10px;font-family:var(--sans);font-size:12px;padding:10px 12px;resize:vertical;box-sizing:border-box"
        placeholder="Paste the whole job post: title, description, budget, client stats (payment verified, spent, rating, proposals), screening questions."></textarea>
      <input id="fl-extra" class="search" style="width:100%;margin-top:8px;padding:9px 10px;font-family:var(--sans);box-sizing:border-box"
        placeholder="Anything to add? (optional: angle, rate, proof to lean on)">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="ack" style="margin:0" onclick="App.freelanceAsk('write')">Write proposal</button>
        <button class="ack" style="margin:0" onclick="App.freelanceAsk('verdict')">Bid or skip?</button>
        <button class="ack" style="margin:0" onclick="App.freelanceAsk('followup')">Follow-up message</button>
      </div>
      <div class="tiny" style="margin-top:8px;color:#5c5659">The reply opens in the ${esc(who.name)} panel, bottom right.</div>
    </div>`;
  },
  async freelanceAsk(kind){
    const job = ($('fl-job')?.value || '').trim();
    const extra = ($('fl-extra')?.value || '').trim();
    if (!job) return this.toast('Paste the job post first.');
    const ask = {
      write: 'Write my proposal for this job.',
      verdict: 'Bid or skip only. No proposal yet, just the verdict and why.',
      followup: "I already sent a proposal for this job and haven't heard back. Write the follow-up.",
    }[kind];
    const text = `${ask}\nPlatform: ${this.freelancePlatform}\n${extra ? 'My note: ' + extra + '\n' : ''}\nJOB POST:\n${job}`;
    this.pinAgentDock();
    this.paintAgentDock();
    const box = $('chatInput');
    if (!box) return this.toast('The Proposals panel did not open.');
    box.value = text;
    await this.sendChat();
  },

  /* ---------------- Your Business · Freight Broker ----------------
     The division page built around the playbook: where Blanco is on the
     roadmap, the next step, his daily numbers and a running log. Every write
     is mirrored by the server into the vault's Freight-Broker-Progress-Log.md,
     which is what Haul 🚚 reads to follow along. */
  freightOpen: null,          // phase ids expanded; null = just the current one
  freightGuide: false,
  view_freight(){
    const t = this.data.freight;
    if (!t) return '<div class="card"><div class="empty">Freight tracker unreachable.</div></div>';
    const vaultDir = 'Your Business/projects/freight-broker/';
    const obs = f => 'obsidian://open?vault=second-brain&file=' + encodeURIComponent(vaultDir + f);
    const pct = t.steps_total ? Math.round(t.steps_done / t.steps_total * 100) : 0;
    const current = (t.phases.find(p => p.done < p.total) || t.phases[t.phases.length - 1]).id;
    const open = this.freightOpen || new Set([current]);

    const next = t.next_step ? `<div style="margin-top:14px;padding:14px;border-radius:12px;
        background:rgba(var(--accent-rgb),.07);border:1px solid rgba(var(--accent-rgb),.3)">
        <div class="lbl tiny" style="color:var(--red)">NEXT STEP · ${esc(t.next_phase)}</div>
        <div style="font-size:15px;font-weight:600;margin-top:6px">${esc(t.next_step.label)}</div>
        ${t.next_step.hint ? `<div class="tiny" style="margin-top:4px;color:#a79fa1">${esc(t.next_step.hint)}</div>` : ''}
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="ack" style="margin:0" onclick="App.freightStep('${t.next_step.id}', true)">✓ Mark done</button>
          <button class="ack" style="margin:0" onclick="App.freightLogStep()">Log progress on it</button>
        </div></div>`
      : `<div class="empty" style="margin-top:12px">Every step on the roadmap is done.</div>`;

    const journey = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0">The Journey</h2>
        <span class="mono" style="font-size:12px;color:#a79fa1">${t.steps_done}/${t.steps_total} steps · ${pct}%</span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div style="display:flex;gap:4px;margin-top:10px;flex-wrap:wrap">
        ${t.phases.map(p => `<span class="chip" title="${esc(p.title)}" style="${p.done===p.total?'color:#34d399':p.id===current?'color:var(--red)':''}">
          ${p.done===p.total?'✓':p.id===current?'▸':'○'} ${esc(p.title.replace(/^Phase \d+ — /,''))}</span>`).join('')}
      </div>
      ${next}
    </div>`;

    // --- daily numbers: the dashboard feed -------------------------------
    const tt = t.totals, today = localISO();
    const todayRow = t.daily.find(d => d.day === today);
    const tiles = [
      {label:'CALLS', value:String(tt.calls), hint:'all time, carriers + shippers'},
      {label:'CARRIERS ADDED', value:String(tt.carriers_added), hint:'Core 10 is the goal'},
      {label:'LOADS BOOKED', value:String(tt.loads_booked), hint:'all time'},
      {label:'GROSS MARGIN', value:money(tt.margin), hint:tt.revenue ? `${Math.round(tt.margin/tt.revenue*100)}% on ${money(tt.revenue)}` : 'revenue minus carrier cost',
       color: tt.revenue ? (tt.margin/tt.revenue >= .12 ? C.health.green : tt.margin/tt.revenue >= .10 ? C.health.yellow : C.health.red) : null},
    ].map(x => `<div class="tile">
        <div class="top"><span class="lbl">${x.label}</span>${dot(x.color || C.health.unknown)}</div>
        <div class="val" style="font-size:24px;margin-top:8px">${esc(x.value)}</div>
        <div class="hint">${esc(x.hint)}</div></div>`).join('');
    const F = [['calls','Calls'],['carriers_added','Carriers +'],['shippers_contacted','Shippers'],
               ['loads_booked','Loads'],['revenue','Revenue $'],['carrier_cost','Carrier cost $']];
    const daily = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0">Daily Numbers</h2>
        <input id="fd-day" class="search" type="date" style="padding:6px 8px;max-width:160px" value="${today}">
      </div>
      <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px">${tiles}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px">
        ${F.map(([k,l]) => `<label style="display:flex;flex-direction:column;gap:4px">
          <span class="lbl tiny">${l.toUpperCase()}</span>
          <input id="fd-${k}" class="search" type="number" min="0" step="${k.includes('re')||k.includes('cost')?'50':'1'}"
                 style="padding:8px" placeholder="${todayRow ? todayRow[k] : 0}"></label>`).join('')}
      </div>
      <input id="fd-notes" class="search" style="margin-top:8px;padding:8px;font-family:var(--sans)"
             placeholder="${todayRow && todayRow.notes ? esc(todayRow.notes) : 'Notes for the day (optional)'}">
      <button class="ack" style="margin-top:8px" onclick="App.saveFreightDaily()">Save day</button>
      ${t.daily.length ? `<div style="overflow-x:auto;margin-top:12px"><table class="mono" style="width:100%;font-size:11px;border-collapse:collapse">
        <tr style="color:#726c6f;text-align:left"><th>DAY</th><th>CALLS</th><th>CARR+</th><th>SHIP</th><th>LOADS</th><th>REV</th><th>MARGIN</th><th></th></tr>
        ${t.daily.slice(0,14).map(d => `<tr style="border-top:1px solid rgba(255,255,255,.05)">
          <td style="padding:6px 4px">${d.day.slice(5)}</td><td>${d.calls}</td><td>${d.carriers_added}</td><td>${d.shippers_contacted}</td>
          <td>${d.loads_booked}</td><td>${money(d.revenue)}</td><td style="color:${d.margin>0?'#34d399':'#a79fa1'}">${money(d.margin)}</td>
          <td style="text-align:right"><button class="chip" style="cursor:pointer" onclick="App.freightEditDay('${d.day}')">edit</button></td></tr>`).join('')}
      </table></div>` : '<div class="empty" style="margin-top:10px">No days logged yet. Your dashboard can also post here:<br><span style="color:#ff8a94">PUT /api/biz/freight/daily/{YYYY-MM-DD}</span></div>'}
    </div>`;

    // --- the running log ------------------------------------------------
    const KINDS = ['call','carrier','shipper','load','money','paperwork','learning','win','note'];
    const KCOL = {call:'#38bdf8',carrier:'#a78bfa',shipper:'#f472b6',load:'#34d399',money:'#2dd4bf',
                  paperwork:'#ffb020',learning:'#a79fa1',win:'#ff2d3d',note:'#726c6f'};
    const logCard = `<div class="card">
      <h2 style="margin:0">Log</h2>
      <div class="tiny" style="margin-top:4px;color:#8a8386">Everything you do. Haul reads this log in the vault.</div>
      <div style="display:grid;grid-template-columns:130px 1fr;gap:8px;margin-top:12px">
        <select id="fl-kind" class="search" style="padding:8px">
          ${KINDS.map(k => `<option value="${k}">${k}</option>`).join('')}</select>
        <input id="fl-title" class="search" style="padding:8px;font-family:var(--sans)" placeholder="What happened (called 5 carriers on Houston→Laredo…)"
               onkeydown="if(event.key==='Enter')App.addFreightLog()">
      </div>
      <div style="display:grid;grid-template-columns:1fr 130px;gap:8px;margin-top:8px">
        <textarea id="fl-detail" class="search" rows="2" style="padding:8px;font-family:var(--sans);resize:vertical" placeholder="Detail (optional)"></textarea>
        <input id="fl-amount" class="search" type="number" step="1" style="padding:8px" placeholder="$ (optional)">
      </div>
      <button class="ack" style="margin-top:8px" onclick="App.addFreightLog()">+ Log it</button>
      ${t.log.length ? `<div class="rowlist" style="margin-top:12px">${t.log.slice(0,40).map(e => `<div class="row">
          <span class="mono" style="font-size:10px;color:#726c6f;flex-shrink:0;width:42px">${e.day.slice(5)}</span>
          <span class="mono" style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:${KCOL[e.kind]};flex-shrink:0;width:70px">${e.kind}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px">${esc(e.title)}</div>
            ${e.detail ? `<div class="tiny" style="margin-top:2px;color:#8a8386;white-space:pre-wrap">${esc(e.detail)}</div>` : ''}
          </div>
          ${e.amount != null ? `<span class="mono" style="font-size:12px;color:#34d399;flex-shrink:0">${money(e.amount)}</span>` : ''}
          <button class="chip" style="cursor:pointer;flex-shrink:0" title="Delete" onclick="App.deleteFreightLog(${e.id})">✕</button>
        </div>`).join('')}</div>` : '<div class="empty" style="margin-top:10px">Nothing logged yet. Log your first move.</div>'}
    </div>`;

    // --- the roadmap, phase by phase --------------------------------------
    const roadmap = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2 style="margin:0">Roadmap</h2>
        <a class="chip" href="${obs('Freight-Broker-Playbook')}" style="text-decoration:none">open playbook ↗</a>
      </div>
      ${t.phases.map(p => {
        const isOpen = open.has(p.id);
        const ppct = Math.round(p.done / p.total * 100);
        return `<div style="margin-top:12px;border:1px solid ${p.id===current?'rgba(var(--accent-rgb),.3)':'rgba(255,255,255,.06)'};border-radius:12px;overflow:hidden">
          <div style="display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer" onclick="App.toggleFreightPhase('${p.id}')">
            <span style="color:${p.done===p.total?'#34d399':p.id===current?'var(--red)':'#726c6f'}">${p.done===p.total?'✓':isOpen?'▾':'▸'}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${esc(p.title)}</div>
              <div class="tiny" style="color:#726c6f">${esc(p.when)} · ${p.done}/${p.total}</div>
            </div>
            <div class="bar" style="width:80px;margin:0"><i style="width:${ppct}%"></i></div>
          </div>
          ${isOpen ? `<div style="padding:0 12px 12px">
            ${p.steps.map(s => `<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(255,255,255,.04);cursor:pointer">
              <input type="checkbox" ${s.done?'checked':''} style="margin-top:3px;accent-color:var(--red)"
                     onchange="App.freightStep('${s.id}', this.checked)">
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;${s.done?'color:#726c6f;text-decoration:line-through':''}">${esc(s.label)}</div>
                ${s.hint ? `<div class="tiny" style="color:#8a8386;margin-top:2px">${esc(s.hint)}</div>` : ''}
                ${s.done && s.done_at ? `<div class="tiny" style="color:#34d399;margin-top:2px">done ${esc(s.done_at.slice(0,10))}</div>` : ''}
              </div></label>`).join('')}
            <a class="chip" href="${obs(p.note)}" style="text-decoration:none;display:inline-block;margin-top:6px">read this section ↗</a>
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>`;

    // --- the field guide: per-load checklists from the playbook -----------
    const guide = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="App.freightGuide=!App.freightGuide;App.render()">
        <h2 style="margin:0">Field Guide</h2><span class="chip">${this.freightGuide?'hide':'show'}</span>
      </div>
      ${this.freightGuide ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px">
        <div><div class="lbl tiny" style="color:var(--red)">VET EVERY CARRIER</div><ol style="font-size:12px;line-height:1.7;padding-left:18px;margin:6px 0">
          <li>Active FMCSA authority (SAFER)</li><li>Insurance confirmed <b>by phone with the insurer</b></li>
          <li>Safety rating not "Unsatisfactory"</li><li>W-9 on file before first payment</li><li>Signed broker–carrier agreement</li></ol>
          <div class="lbl tiny" style="color:#ffb020;margin-top:8px">WALK AWAY IF</div><ul style="font-size:12px;line-height:1.7;padding-left:18px;margin:6px 0">
          <li>"Just renewed" insurance that won't confirm by phone</li><li>MC under 6 months + large fleet claim</li>
          <li>Wants payment before delivery, no track record</li><li>Won't sign an agreement</li></ul></div>
        <div><div class="lbl tiny" style="color:var(--red)">EVERY LOAD, IN ORDER</div><ol style="font-size:12px;line-height:1.7;padding-left:18px;margin:6px 0">
          <li>Shipment details</li><li>Quote the shipper</li><li>Agreement in writing</li><li>Find the carrier</li><li>Vet the carrier</li>
          <li>Signed rate con</li><li>Signed BOL at pickup</li><li>Track: pickup, mid, delivery</li><li>POD at delivery</li>
          <li>Invoice the shipper</li><li>Pay the carrier (net-15)</li><li>File BOL, POD, rate con, invoice</li></ol></div>
        <div><div class="lbl tiny" style="color:var(--red)">MONEY RULES</div><ul style="font-size:12px;line-height:1.7;padding-left:18px;margin:6px 0">
          <li>Margin 12–20%. Never under 10%.</li><li>Post 10–15% under your ceiling</li><li>Know the walk-away number first</li>
          <li>Never re-cut a rate after dispatch</li><li>30 days of carrier pay in reserve</li><li>Factor before you ever pay a carrier late</li></ul>
          <a class="chip" href="${obs('Freight-10-Failure-Points')}" style="text-decoration:none;display:inline-block;margin-top:6px">failure points ↗</a></div>
      </div>` : ''}
    </div>`;

    return `${journey}${daily}${logCard}${roadmap}${guide}`;
  },
  toggleFreightPhase(id){
    const t = this.data.freight;
    const current = (t.phases.find(p => p.done < p.total) || t.phases[t.phases.length - 1]).id;
    const open = this.freightOpen || new Set([current]);
    open.has(id) ? open.delete(id) : open.add(id);
    this.freightOpen = open; this.render();
  },
  async freightStep(id, done){
    try {
      this.data.freight = await api(`/api/biz/freight/steps/${id}?done=${done}`, {method:'PUT'});
      this.render();
    } catch (err) { alert('Could not update the step: ' + err.message); }
  },
  freightLogStep(){
    const t = this.data.freight;
    const title = $('fl-title');
    if (title && t.next_step){ title.value = t.next_step.label + ' — '; title.focus(); }
  },
  async addFreightLog(){
    const title = $('fl-title').value.trim();
    if (!title) { $('fl-title').focus(); return; }
    const amt = $('fl-amount').value;
    const day = $('fd-day') ? $('fd-day').value : '';
    try {
      await api('/api/biz/freight/log', {method:'POST', body: JSON.stringify({
        kind: $('fl-kind').value, title, detail: $('fl-detail').value.trim(),
        amount: amt === '' ? null : Number(amt), day})});
      this.clearDrafts(['fl-title','fl-detail','fl-amount']);
      this.data.freight = await api('/api/biz/freight');
      this.render();
    } catch (err) { alert('Could not log it: ' + err.message); }
  },
  async deleteFreightLog(id){
    if (!confirm('Delete this log entry?')) return;
    try {
      await api('/api/biz/freight/log/' + id, {method:'DELETE'});
      this.data.freight = await api('/api/biz/freight');
      this.render();
    } catch (err) { alert('Could not delete: ' + err.message); }
  },
  freightEditDay(day){
    const d = (this.data.freight.daily || []).find(x => x.day === day);
    if (!d) return;
    $('fd-day').value = day;
    for (const k of ['calls','carriers_added','shippers_contacted','loads_booked','revenue','carrier_cost'])
      $('fd-' + k).value = d[k];
    $('fd-notes').value = d.notes || '';
    $('fd-calls').focus();
  },
  async saveFreightDaily(){
    const day = $('fd-day').value;
    if (!day) return;
    const existing = (this.data.freight.daily || []).find(x => x.day === day) || {};
    const body = {};
    // An empty box keeps that day's saved number instead of zeroing it.
    for (const k of ['calls','carriers_added','shippers_contacted','loads_booked','revenue','carrier_cost']){
      const v = $('fd-' + k).value;
      body[k] = v === '' ? (existing[k] || 0) : Number(v);
    }
    body.notes = $('fd-notes').value.trim() || existing.notes || '';
    try {
      await api('/api/biz/freight/daily/' + day, {method:'PUT', body: JSON.stringify(body)});
      this.clearDrafts(['fd-calls','fd-carriers_added','fd-shippers_contacted','fd-loads_booked','fd-revenue','fd-carrier_cost','fd-notes']);
      this.data.freight = await api('/api/biz/freight');
      this.render();
    } catch (err) { alert('Could not save the day: ' + err.message); }
  },

  toggleDivisionEdit(id){ this.editingDivision = this.editingDivision === id ? null : id; this.render(); },

  async saveDivision(id){
    const num = v => v === '' ? 0 : Number(v);
    const payload = {
      stage: $(`d-stage-${id}`).value,
      health: $(`d-health-${id}`).value,
      monthly_target: num($(`d-target-${id}`).value),
      next_action: $(`d-next-${id}`).value.trim(),
    };
    try {
      await api('/api/biz/divisions/' + id, {method:'PATCH', body: JSON.stringify(payload)});
      this.editingDivision = null;
      await this.load({quiet:true});
    } catch (err) { alert('Could not save: ' + err.message); }
  },

  toggleAddDeal(id){ this.addingDeal = this.addingDeal === id ? null : id; this.render(); },

  async addDeal(id){
    const client = $(`nd-client-${id}`).value.trim();
    if (!client) return alert('A deal needs a client.');
    const payload = {
      division_id: id,
      client,
      title:       $(`nd-title-${id}`).value.trim(),
      stage:       $(`nd-stage-${id}`).value,
      value:       Number($(`nd-value-${id}`).value || 0),
      source:      $(`nd-source-${id}`).value.trim(),
      next_action: $(`nd-next-${id}`).value.trim(),
    };
    try {
      await api('/api/biz/deals', {method:'POST', body: JSON.stringify(payload)});
      this.addingDeal = null;
      await this.load({quiet:true});
    } catch (err) { alert('Could not open the deal: ' + err.message); }
  },

  /* Every external link opens in Opera, not the Windows default browser.
     The deck runs in an app window, so a plain link would hand the URL to
     whatever Windows has set (Chrome). The server launches Opera through WSL
     interop; if that fails the link still opens the ordinary way rather than
     doing nothing. Wired globally in bindOperaLinks() — individual links need
     no onclick of their own. */
  openInOpera(url){
    api('/api/open-in-opera', {method:'POST', body: JSON.stringify({url})})
      .catch(err => { this.toast('Opera did not open (' + err.message + ') — using the default browser.');
                      window.open(url, '_blank', 'noopener'); });
    return false;
  },

  /* One listener for the whole deck: any https link meant for a new window
     goes to Opera. Added once at boot, so chips painted later are covered too
     and no one has to remember an onclick. */
  bindOperaLinks(){
    document.addEventListener('click', (event) => {
      const link = event.target.closest && event.target.closest('a[href^="https://"]');
      if (!link) return;
      if (link.dataset.defaultBrowser === 'yes') return;   // opt out if ever needed
      event.preventDefault();
      this.openInOpera(link.href);
    }, true);
  },

  async moveDeal(dealId, stage){
    try {
      await api('/api/biz/deals/' + dealId, {method:'PATCH', body: JSON.stringify({stage})});
      await this.load({quiet:true});
    } catch (err) { alert('Could not move the deal: ' + err.message); }
  },

  /* ---------------- Your Business ▸ Alerts ----------------
     What needs Blanco now, plus whether the thing that finds it is alive.
     A dead monitor looks exactly like a quiet inbox, so liveness is the first
     card rather than a footnote. */
  view_bizAlerts(){
    const h = this.data.emailHealth;
    const msgs = this.data.bridge || [];

    // Escalations first, then unread — everything else is history.
    const escalations = msgs.filter(b => b.kind === 'escalation');
    const openEscalations = escalations.filter(b => !b.read);
    const deals = msgs.filter(b => b.kind === 'deal' && !b.read);

    const MON = {
      ok:            {color:C.service.up,      label:'MONITORING',   hint:'polling the Your Business inbox'},
      stale:         {color:C.service.stale,   label:'STALE',        hint:'no poll in a while — check the cron'},
      erroring:      {color:C.health.red,      label:'ERRORING',     hint:'last poll reported a problem'},
      never_run:     {color:C.service.stale,   label:'NEVER RUN',    hint:'installed, but has not polled yet'},
      not_installed: {color:C.service.unknown, label:'NOT INSTALLED',hint:'biz-email-monitor is not set up'},
    };
    const mon = (h && MON[h.status]) || MON.not_installed;

    const tiles = [
      {label:'OPEN ESCALATIONS', value: String(openEscalations.length),
       hint: openEscalations.length ? 'needs you now' : 'nothing burning',
       color: openEscalations.length ? C.health.red : C.health.green},
      {label:'UNREAD LEADS', value: String(deals.length),
       hint: deals.length ? 'waiting on a reply' : 'all caught up',
       color: deals.length ? C.deal.proposal : null},
      {label:'INBOX MONITOR', value: mon.label, hint: mon.hint, color: mon.color, small:true},
      {label:'MAIL SEEN', value: h ? String(h.alerted_total) : '—',
       hint: h && h.poll_count ? `${h.poll_count} polls` : 'no polls yet'},
    ].map(t => `<div class="tile">
        <div class="top"><span class="lbl">${t.label}</span>${dot(t.color || C.health.unknown)}</div>
        <div class="val" style="font-size:${t.small?16:26}px;margin-top:8px">${esc(t.value)}</div>
        <div class="hint">${esc(t.hint)}</div>
      </div>`).join('');

    // The monitor's own problems, said plainly rather than buried in a tile.
    let banner = '';
    if (!h){
      banner = `<div class="card" style="border-color:rgba(255,176,32,.3)">
        <h2>Inbox monitor not reachable</h2>
        <div class="tiny" style="margin-top:6px;color:#a79fa1">
          Blanco OS could not read the monitor's state. It lives at
          <span class="mono">~/.openclaw/workspace/biz-email-monitor</span>.
        </div></div>`;
    } else if (h.status === 'stale'){
      banner = `<div class="card" style="border-color:rgba(255,45,61,.35)">
        <h2 style="color:#ff8a94">The monitor has gone quiet</h2>
        <div class="tiny" style="margin-top:6px;color:#a79fa1">
          Last poll ${esc(ago(h.last_poll_at))} — past the ${h.stale_after_minutes} minute limit.
          <strong>A silent monitor and an empty inbox look identical</strong>, so treat this as
          "not watching" rather than "nothing happened".
        </div></div>`;
    } else if (h.status === 'erroring' && h.last_error){
      banner = `<div class="card" style="border-color:rgba(255,45,61,.35)">
        <h2 style="color:#ff8a94">Last poll reported an error</h2>
        <div class="tiny mono" style="margin-top:6px;color:#a79fa1;overflow-wrap:anywhere">
          ${esc(h.last_error)}</div></div>`;
    } else if (h.status === 'never_run'){
      banner = `<div class="card">
        <h2>Monitor installed, not yet polling</h2>
        <div class="tiny" style="margin-top:6px;color:#a79fa1">
          Prime it once, then wire the cron:<br>
          <span class="mono" style="color:#ff8a94">python3 -m monitor.run --prime</span></div></div>`;
    }

    const feed = escalations.length
      ? `<div class="rowlist">${escalations.slice(0, 20).map(b => `
          <div class="row" style="cursor:pointer;${b.read?'':'background:rgba(255,45,61,.05)'}"
               onclick="App.readMsg(${b.id})">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${esc(b.title)}</div>
              ${b.body ? `<div class="tiny" style="margin-top:3px;color:#8a8386">${esc(b.body.slice(0,160))}</div>` : ''}
              <div class="tiny" style="margin-top:3px;color:#5c5659">${esc(b.origin)} · ${esc(ago(b.received_at))}</div>
            </div>
            ${b.read ? '' : pill('unread', C.health.red)}
          </div>`).join('')}</div>`
      : `<div class="empty">No escalations.<br><br>
          Your Business's own alerts — a lead reaching nobody, a notification channel
          failing — land here.</div>`;

    const learned = (h && h.learned_senders && h.learned_senders.length)
      ? `<div class="card"><h2>What it has learned</h2>
          <div class="tiny" style="margin:4px 0 10px;color:#8a8386">
            From what you open. Positive means it flags that sender sooner;
            negative means it stops bothering you.</div>
          <div class="rowlist">${h.learned_senders.map(s => `
            <div class="row">
              <span class="mono" style="flex:1;min-width:0;font-size:12px">${esc(s.domain)}</span>
              <span class="mono" style="font-size:12px;color:${s.weight >= 0 ? C.health.green : '#726c6f'}">
                ${s.weight >= 0 ? '+' : ''}${s.weight}</span>
            </div>`).join('')}</div></div>`
      : '';

    return `<div class="stack">
      <div class="tiles">${tiles}</div>
      ${banner}
      <div class="card"><h2>Escalations — ${escalations.length}</h2>${feed}</div>
      ${learned}</div>`;
  },

  view_bizNotices(){
    const msgs = this.data.bridge;
    if (!msgs) return '<div class="empty">Your Business unreachable.</div>';
    if (!msgs.length) return `<div class="card"><div class="empty">
      Nothing from Your Business yet.<br><br>
      Your Business agents push notices here with<br>
      <span style="color:#ff8a94">POST /api/bridge</span></div></div>`;

    return `<div class="stack">
      <div style="display:flex;justify-content:flex-end">
        <button class="ack" onclick="App.readAll()">Mark all read</button></div>
      ${msgs.map(b => `
        <div style="padding:16px;border-radius:14px;cursor:pointer;
          background:${b.read?'rgba(255,255,255,.015)':'rgba(255,45,61,.05)'};
          border:1px solid ${b.read?'rgba(255,255,255,.06)':'rgba(255,45,61,.2)'}"
          onclick="App.readMsg(${b.id})">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span class="mono" style="font-size:10px;letter-spacing:1px;text-transform:uppercase;
              color:${b.kind==='escalation'?'#ff2d3d':'#a79fa1'}">${esc(b.kind)}</span>
            <span class="tiny" style="color:#726c6f">${esc(ago(b.received_at))}</span>
          </div>
          <div style="font-size:14px;font-weight:600;margin-top:8px">${esc(b.title)}</div>
          <div style="font-size:13px;color:#9a9296;margin-top:3px">${esc(b.body)}</div>
          ${b.amount ? `<div class="mono" style="font-size:13px;color:#34d399;margin-top:8px">${money(b.amount)}</div>` : ''}
        </div>`).join('')}
    </div>`;
  },
  async readMsg(id){ await api('/api/bridge/' + id + '/read', {method:'POST'}); this.load({quiet:true}); },
  async readAll(){ await api('/api/bridge/read-all', {method:'POST'}); this.load({quiet:true}); },

  /* ---------------- shared actions ---------------- */
  /* The ALERTS peek is on every page, but only a Command Deck refresh
     repaints it — so the card comes out here and now rather than waiting on a
     load that, from any other page, never touches the peek. Put it back if
     the server refuses the acknowledge. */
  async ack(id){
    const before = this.openAlerts || [];
    this.paintAlertPeek(before.filter(a => String(a.id) !== String(id)));
    this.dismissBubble(id);
    try {
      await api('/api/command/alerts/' + id + '/ack', {method:'POST'});
      await this.load({quiet:true});
    } catch (err) {
      this.paintAlertPeek(before);
      alert('Could not acknowledge: ' + err.message);
    }
  },
  async editFocus(){
    const cur = this.data.brief?.focus;
    const headline = await Bubble.ask('What is the focus?', cur?.headline || '',
      {heading:'Focus', placeholder:'The one thing that matters today',
       validate: v => v.trim() ? null : 'Name the focus.'});
    if (headline === null) return;
    const detail = await Bubble.ask('Any detail?', cur?.detail || '',
      {heading:'Focus detail', kind:'textarea', ok:'Set focus',
       sub:'Optional — leave it empty if the headline says it all.'});
    if (detail === null) return;
    try {
      await api('/api/command/focus', {method:'PUT',
        body: JSON.stringify({headline, detail, horizon: cur?.horizon || 'today'})});
      await this.load();
    } catch (err) { alert('Could not set focus: ' + err.message); }
  },
};

App.init();
Notepad.init();

/* Service workers only run on https or localhost — over a LAN IP the deck
   still works, it just won't install or cache. */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
