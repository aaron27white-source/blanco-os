        ${tab === 'event' ? `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
            <input id="neTitle" class="search" style="grid-column:1/-1;padding:10px;font-family:var(--sans)"
                   placeholder="What's on the calendar?" onkeydown="if(event.key==='Enter')App.addEvent()">
            <input id="neDate" class="search" type="date" style="padding:10px" value="${today}">
            <input id="neTime" class="search" type="time" style="padding:10px" value="09:00">
            <button class="ack" style="margin:0" onclick="App.addEvent()">Add to calendar</button>
            <div class="tiny" style="grid-column:1/-1;color:#5c5659">
              Also rebuilds the 📅 Appointments table in todo-list.md immediately.</div>
          </div>` : ''}

        ${tab === 'note' ? `
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <input id="nnText" class="search" style="flex:1;min-width:200px;padding:10px;font-family:var(--sans)"
                   placeholder="Anything worth remembering" onkeydown="if(event.key==='Enter')App.addNote()">
            <button class="ack" style="margin:0" onclick="App.addNote()">Save note</button>
          </div>
          ${b.notes.length ? `<div class="rowlist" style="margin-top:14px">${b.notes.slice(0,5).map(n => `
            <div class="listrow"><div style="font-size:13px">${esc(n.text)}</div>
              <span class="tiny">${esc(n.date)}</span></div>`).join('')}</div>` : ''}` : ''}
      </div>
      ${this.calendarHTML()}

      <div class="cols2" style="grid-template-columns:2.4fr 1fr">
        <div class="board">${board}</div>
        <div class="card"><h2>Upcoming</h2>${events}
          <div class="tiny" style="margin-top:14px;color:#726c6f">Drag a card between columns to change its status — it writes straight back to the vault.</div>
        </div>
      </div>
    </div>`;
  },
  captureTab: 'task',
  setCapture(k){ this.captureTab = k; this.render(); },

  /* Progress on a card, only once a task actually has steps — an empty bar
     under every card would just be noise. */
  stepBarHTML(t){
    const steps = t.subtasks || [];
    if (!steps.length) return '';
    const done = steps.filter(s => s.done).length;
    return `<div class="steps">
      <div class="bar"><i style="width:${Math.round(100 * done / steps.length)}%"></i></div>
      <span class="n">${done}/${steps.length}</span>
    </div>`;
  },

  /* ---------------- month calendar ----------------
     The real month, not just a list: tasks sit on their due date, events on
     theirs, and dragging either onto another day rewrites that date in the
     vault. Undated tasks wait in the pool underneath. */
  calMonth: null,            // 'YYYY-MM' — null means "the month we're in"
  calDragItem: null,         // {kind:'task'|'event', id}

  calCursor(){
    const m = this.calMonth || localISO().slice(0, 7);
    const [y, mo] = m.split('-').map(Number);
    return {y, m: mo, key: m};
  },
  shiftCalMonth(delta){
    const c = this.calCursor();
    // Day 1 keeps the roll-over honest — no 31st-of-February surprises.
    const d = new Date(c.y, c.m - 1 + delta, 1);
    this.calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    this.render();
  },
  calToday(){ this.calMonth = null; this.render(); },

  /* ---------------- calendar ----------------
     Its own nav entry and a Command Deck tab, because the whole point is to
     see business and personal on one grid before committing to something.
     Both surfaces render this same body, and both read the same vault board
     the Tasks tab writes — one source of truth, no second calendar to keep in
     sync. */
  /* The Calendar nav entry owns this.data.board; the Command Deck tab owns
     boardCache, because the deck's refresh cycle rewrites this.data. Either
     source is fine — this is the only place that has to know which. */
  scheduleBoard(){ return (this.data && this.data.board) || this.boardCache || null; },

  view_calendar(){
    if (!this.scheduleBoard()) return '<div class="empty">No board.</div>';
    // The bar only paints in the docked deck — inside the solo window there is
    // nothing left to detach.
    const bar = this.solo ? '' : `<div class="solobar" style="display:flex">
      <button class="chip" style="cursor:pointer" onclick="App.popOut('calendar')"
              title="Open the calendar as its own window">⧉ open in its own window</button>
      <button class="chip" style="cursor:pointer" onclick="Notepad.popOut()"
              title="Open the notepad as its own window">⧉ notes</button>
      <span class="tiny" style="color:#5c5659">same data, detached — put it on a second screen</span>
    </div>`;
    return `<div class="stack">${bar}${this.scheduleBodyHTML()}</div>` + this.view_tasks();
  },

  /* One module, detached. Named windows so a second click focuses the window
     that is already open instead of spawning another. */
  popOut(view){
    const w = window.open(`/?solo=${encodeURIComponent(view)}`, 'blanco-os-' + view,
                          'popup=yes,width=1180,height=860');
    if (w) w.focus();
    else this.toast('The browser blocked the pop-up — allow pop-ups for this site.');
  },

  /* Days that cannot happen as scheduled.

     This is the feature, not the month grid — a grid shows you everything and
     still lets you double-book, because nobody counts chips by eye. Three
     things are worth flagging, in descending order of how much they hurt:

       clash     two timed events less than 60 minutes apart
       stacked   three or more timed events in one day
       heavy     an event plus three or more tasks due the same day

     Deliberately not "conflict" for everything: a day with two appointments
     four hours apart is fine, and crying wolf about it would train him to
     ignore the banner. */
  scheduleConflicts(){
    const b = this.scheduleBoard() || {};
    const events = (b.events || []).filter(e => e.date);
    const tasks = (b.tasks || []).filter(t => t.due_date && t.status !== 'done');

    const byDay = {};
    events.forEach(e => { (byDay[e.date] ||= {events:[], tasks:[]}).events.push(e); });
    tasks.forEach(t => { (byDay[t.due_date] ||= {events:[], tasks:[]}).tasks.push(t); });

    const mins = t => {
      const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
      return m ? (+m[1]) * 60 + (+m[2]) : null;
    };

    const out = [];
    Object.keys(byDay).sort().forEach(date => {
      const day = byDay[date];
      const timed = day.events
        .map(e => ({...e, at: mins(e.time)}))
        .filter(e => e.at !== null)
        .sort((a, b2) => a.at - b2.at);

      for (let i = 1; i < timed.length; i++){
        const gap = timed[i].at - timed[i-1].at;
        if (gap < 60){
          out.push({date, severity:'clash',
            detail:`${timed[i-1].time} ${timed[i-1].title} → ${timed[i].time} ${timed[i].title} · ${gap} min apart`});
        }
      }
      if (timed.length >= 3){
        out.push({date, severity:'stacked', detail:`${timed.length} timed events in one day`});
      }
      if (day.events.length && day.tasks.length >= 3){
        out.push({date, severity:'heavy',
          detail:`${day.events.length} event${day.events.length>1?'s':''} plus ${day.tasks.length} tasks due`});
      }
    });
    return out;
  },

  /* The schedule-specific half: what today looks like, and which days will
     not work as planned. The board, capture and month grid come from
     view_tasks() below — one renderer, so the two surfaces cannot drift. */
  scheduleBodyHTML(){
    const b = this.scheduleBoard() || {};
    const today = localISO();
    const events = (b.events || []).filter(e => e.date);
    const live = this.scheduleConflicts().filter(c => c.date >= today);

    const upcoming = events.filter(e => e.date >= today).sort((a,b2) =>
      (a.date + (a.time||'')).localeCompare(b2.date + (b2.time||'')));
    const next = upcoming[0];
    const todayCount = events.filter(e => e.date === today).length
                     + (b.tasks || []).filter(t => t.due_date === today && t.status !== 'done').length;

    const SEV = {clash:'#ff2d3d', stacked:'#ffb020', heavy:'#ffb020'};

    const tiles = [
      {label:'TODAY', value:String(todayCount),
       hint: todayCount ? 'events + tasks due' : 'clear',
       color: todayCount > 4 ? C.health.red : todayCount ? C.health.yellow : C.health.green},
      {label:'NEXT UP', value: next ? (next.time || 'all day') : '—',
       hint: next ? `${next.date} · ${next.title}`.slice(0,42) : 'nothing scheduled', small:true},
      {label:'CONFLICTS', value:String(live.length),
       hint: live.length ? 'days that will not work as planned' : 'nothing double-booked',
       color: live.length ? C.health.red : C.health.green},
      {label:'SCHEDULED', value:String(upcoming.length), hint:'events ahead'},
    ].map(t => `<div class="tile">
        <div class="top"><span class="lbl">${t.label}</span>${dot(t.color || C.health.unknown)}</div>
        <div class="val" style="font-size:${t.small?15:26}px;margin-top:8px">${esc(t.value)}</div>
        <div class="hint">${esc(t.hint)}</div>
      </div>`).join('');

    const clashCard = live.length ? `<div class="card" style="border-color:rgba(255,45,61,.3)">
      <h2 style="color:#ff8a94">Scheduling conflicts — ${live.length}</h2>
      <div class="rowlist" style="margin-top:8px">${live.slice(0,10).map(c => `
        <div class="row">
          <span class="mono" style="font-size:12px;flex-shrink:0;color:${SEV[c.severity]}">${esc(c.date)}</span>
          <div style="flex:1;min-width:0;font-size:13px">${esc(c.detail)}</div>
          ${pill(c.severity, SEV[c.severity])}
        </div>`).join('')}</div>
      <div class="tiny" style="margin-top:10px;color:#726c6f">
        Drag a chip to another day on the grid below to move it.</div>
    </div>` : '';

    return `<div class="tiles">${tiles}</div>${clashCard}`;
  },

  calendarHTML(){
    const b = this.scheduleBoard();
    if (!b) return '';
    const c = this.calCursor();
    const today = localISO();
    const first = new Date(c.y, c.m - 1, 1);
    const label = first.toLocaleDateString(undefined, {month:'long', year:'numeric'});
    // Grid always starts on the Sunday on or before the 1st, and runs whole
    // weeks — six rows covers every possible month layout.
    const start = new Date(c.y, c.m - 1, 1 - first.getDay());

    const dated = (b.tasks || []).filter(t => t.due_date);
    const events = b.events || [];

    const cells = [];
    for (let i = 0; i < 42; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const cls = ['calday'];
      if (d.getMonth() !== c.m - 1) cls.push('out');
      if (iso === today) cls.push('today');

      const chips = [
        ...events.filter(e => e.date === iso).map(e => `
          <div class="calchip ev" draggable="true" title="${esc(e.title)} · right-click for options"
               ondragstart="App.calDragStart(event,'event','${esc(e.id)}')"
               oncontextmenu="App.eventMenu(event,'${esc(e.id)}')">
            ${e.time ? `<span class="cw">${esc(e.time)}</span>` : ''}${esc(e.title)}
          </div>`),
        ...dated.filter(t => t.due_date === iso).map(t => {
          const late = t.status !== 'done' && iso < today;
          const steps = (t.subtasks || []).length;
          const done = (t.subtasks || []).filter(s => s.done).length;
          return `<div class="calchip${late ? ' late' : ''}${t.status === 'done' ? ' done' : ''}"
               draggable="true" style="cursor:pointer"
               title="${esc(t.title)} · ${esc(t.status)} · click to open"
               onclick="App.openTask('${esc(t.id)}')"
               oncontextmenu="App.taskMenu(event,'${esc(t.id)}')"
               ondragstart="App.calDragStart(event,'task','${esc(t.id)}')">
            <span class="cw" style="color:${C.prio[t.priority]}">${esc(t.priority)}</span>${esc(t.title)}${
            steps ? `<span class="cw" style="margin-left:6px">${done}/${steps}</span>` : ''}
          </div>`;
        }),
      ].join('');

      cells.push(`<div class="${cls.join(' ')}"
           ondragover="App.calOver(event,this)" ondragleave="this.classList.remove('over')"
           ondrop="App.calDrop(event,'${iso}',this)">
        <div class="dnum"><span>${d.getDate()}</span></div>${chips}
      </div>`);
    }

    const undated = (b.tasks || []).filter(t => !t.due_date && t.status !== 'done');
    const pool = undated.map(t => `
      <div class="calchip" draggable="true" style="cursor:pointer"
           title="${esc(t.title)} · click to open · right-click for options"
           onclick="App.openTask('${esc(t.id)}')"
           oncontextmenu="App.taskMenu(event,'${esc(t.id)}')"
           ondragstart="App.calDragStart(event,'task','${esc(t.id)}')">
        <span class="cw" style="color:${C.prio[t.priority]}">${esc(t.priority)}</span>${esc(t.title)}
      </div>`).join('') || '<div class="tiny" style="color:#726c6f">Everything has a date on it.</div>';

    return `<div class="card">
      <div class="calhead">
        <span class="m">${esc(label)}</span>
        <span class="tiny" style="color:#726c6f">drag onto a day to move it · drop back below to unschedule</span>
        <div class="calnav">
          <button onclick="App.shiftCalMonth(-1)">◀</button>
          <button onclick="App.calToday()">Today</button>
          <button onclick="App.shiftCalMonth(1)">▶</button>
        </div>
      </div>
      <div class="caldow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="calgrid">${cells.join('')}</div>
      <div class="calpool" ondragover="App.calOver(event,this)"
           ondragleave="this.classList.remove('over')" ondrop="App.calUnschedule(event,this)">
        <span class="tiny" style="width:100%;color:#8a8386">No date yet — ${undated.length}</span>
        ${pool}
      </div>
    </div>`;
  },

  calDragStart(e, kind, id){
    this.calDragItem = {kind, id};
    // Board columns read App.dragId; keep it clear so a calendar drag that
    // lands on a column can't silently change a status too.
    this.dragId = null;
    if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
  },
  calOver(e, el){ if (this.calDragItem){ e.preventDefault(); el.classList.add('over'); } },

  async calDrop(e, iso, el){
    e.preventDefault();
    el.classList.remove('over');
    const item = this.calDragItem;
    this.calDragItem = null;
    if (!item) return;
    try {
      if (item.kind === 'task'){
        await api('/api/tasks/' + encodeURIComponent(item.id),
                  {method:'PATCH', body: JSON.stringify({due_date: iso})});
      } else {
        await api('/api/events/' + encodeURIComponent(item.id),
                  {method:'PATCH', body: JSON.stringify({date: iso})});
      }
      await this.load({quiet:true});
    } catch (err) { alert('Could not move it: ' + err.message); }
  },

  /* Dropping a task back in the pool clears its due date; events always have
     one, so they're simply refused here. */
  async calUnschedule(e, el){
    e.preventDefault();
    el.classList.remove('over');
    const item = this.calDragItem;
    this.calDragItem = null;
    if (!item || item.kind !== 'task') return;
    try {
      await api('/api/tasks/' + encodeURIComponent(item.id),
                {method:'PATCH', body: JSON.stringify({due_date: null})});
      await this.load({quiet:true});
    } catch (err) { alert('Could not unschedule: ' + err.message); }
  },

  async addTask(){
    const title = (($('ntTitle')||{}).value || '').trim();
    if (!title) return alert('Give it a title.');
    try {
      await api('/api/tasks', {method:'POST', body: JSON.stringify({
        title,
        priority: ($('ntPrio')||{}).value || 'medium',
        due_date: (($('ntDue')||{}).value || '') || null,
      })});
      this.clearDrafts(['ntTitle','ntDue']);
      await this.load();
    } catch (err) { alert('Could not add: ' + err.message); }
  },

  async addEvent(){
    const title = (($('neTitle')||{}).value || '').trim();
    const date = ($('neDate')||{}).value;
    if (!title) return alert('Give it a title.');
    if (!date) return alert('Pick a date.');
    try {
      await api('/api/events', {method:'POST', body: JSON.stringify({
        title, date, time: ($('neTime')||{}).value || '',
      })});
      this.clearDrafts(['neTitle','neDate','neTime']);
      await this.load();
    } catch (err) { alert('Could not add: ' + err.message); }
  },

  async addNote(){
    const text = (($('nnText')||{}).value || '').trim();
    if (!text) return;
    try {
      await api('/api/notes', {method:'POST', body: JSON.stringify({text})});
      this.clearDrafts(['nnText']);
      await this.load();
    } catch (err) { alert('Could not save: ' + err.message); }
  },

  over(e, el){ e.preventDefault(); el.classList.add('over'); },
  async drop(e, status, el){
    e.preventDefault();
    el.classList.remove('over');
    if (!this.dragId) return;
    const id = this.dragId; this.dragId = null;
    try {
      await api('/api/tasks/' + encodeURIComponent(id), {method:'PATCH', body: JSON.stringify({status})});
      await this.load({quiet:true});
    } catch (err) { alert('Could not move task: ' + err.message); }
  },

  /* ---------------- task detail ("the bubble") ----------------
     A card on the board is a headline. Real work — "set up the Fiverr
     profile" — is five to ten steps, and those steps belong *inside* the task
     rather than as ten more cards nobody can tell apart. Clicking a card
     opens it here: notes, dates, and a checklist that ticks off.

     The modal reads from this.data.board, so any refresh that repaints the
     deck repaints the open task too, and every write returns the whole task
     so the bubble and the board can never disagree. */
  openTaskId: null,

  currentTask(){
    if (!this.openTaskId) return null;
    return ((this.data.board || {}).tasks || []).find(t => t.id === this.openTaskId) || null;
  },

  openTask(id){
    this.openTaskId = id;
    this.closeCtx();
    this.paintTaskModal();
    // The step box is where he almost always is; land the cursor there.
    requestAnimationFrame(() => $('tmNew')?.focus());
  },

  closeTask(ev){
    // Backdrop clicks bubble up here; clicks inside the box are stopped.
    if (ev && ev.target !== ev.currentTarget) return;
    this.openTaskId = null;
    this.clearDrafts(['tmTitle', 'tmNotes', 'tmNew', 'tmDue']);
    // Every step field is its own draft; leaving them behind would type a
    // half-finished rename back into the next task opened.
    for (const k of Object.keys(this.drafts)) if (k.startsWith('tmStep-')) delete this.drafts[k];
    const modal = $('taskModal');
    if (modal) modal.hidden = true;
  },

  paintTaskModal(){
    const modal = $('taskModal'), body = $('taskModalBody');
    if (!modal || !body) return;
    const task = this.currentTask();
    if (!task){
      // The task was deleted, or the board hasn't loaded it — either way there
      // is nothing to show, and a modal with nothing in it is a trap.
      modal.hidden = true;
      return;
    }
    // Same contract as render(): a repaint must not eat what's half-typed.
    const snap = this.captureFocus();
    body.innerHTML = this.taskModalHTML(task);
    modal.hidden = false;
    this.restoreFocus(snap);
  },

  taskModalHTML(t){
    const steps = t.subtasks || [];
    const done = steps.filter(s => s.done).length;
    const pct = steps.length ? Math.round(100 * done / steps.length) : 0;
    const statuses = [['todo','To Do'],['in_progress','In Progress'],['blocked','Blocked'],['done','Done']];
    const prios = ['high','medium','low'];

    return `
      <div class="modalhead">
        <span class="mono" style="font-size:11px;letter-spacing:2px;color:var(--ember)">◆ TASK</span>
        <button class="fmbtn" onclick="App.closeTask()">✕ close</button>
      </div>

      <input id="tmTitle" class="search" value="${esc(t.title)}"
             style="font-family:var(--sans);font-size:16px;padding:11px 13px"
             title="Edit the title — Enter or click away to save"
             onkeydown="if(event.key==='Enter')App.saveTaskDetails()"
             onblur="App.saveTaskDetails({quiet:true})">

      <div class="filters" style="margin-top:12px">
        ${statuses.map(([k, l]) => `<button class="${t.status===k?'on':''}"
          onclick="App.setTaskField('status','${k}')">${l}</button>`).join('')}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <span class="tiny" style="letter-spacing:1.5px;color:#726c6f">PRIORITY</span>
        <div class="filters">
          ${prios.map(p => `<button class="${t.priority===p?'on':''}"
            onclick="App.setTaskField('priority','${p}')">${p}</button>`).join('')}
        </div>
        <span class="tiny" style="letter-spacing:1.5px;color:#726c6f;margin-left:auto">DUE</span>
        <input id="tmDue" class="search" type="date" style="padding:8px 10px;max-width:170px"
               value="${esc(t.due_date || '')}" onchange="App.setTaskField('due_date', this.value || null)">
      </div>

      <div style="margin-top:16px">
        <div class="tiny" style="letter-spacing:1.5px;color:#726c6f;margin-bottom:6px">NOTES &amp; DESCRIPTION</div>
        <textarea id="tmNotes" class="search" rows="3"
                  style="font-family:var(--sans);resize:vertical;padding:10px 12px;width:100%"
                  placeholder="What this actually involves, links, who to call…"
                  oninput="App.growInput(this)"
                  onblur="App.saveTaskDetails({quiet:true})">${esc(t.notes || '')}</textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:2px">
          <button class="ack" style="cursor:pointer" onclick="App.saveTaskDetails()">Save title &amp; notes</button>
          <span class="tiny" style="color:#5c5659">saves on its own when you click away</span>
        </div>
      </div>

      <div style="margin-top:18px">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="tiny" style="letter-spacing:1.5px;color:#726c6f">STEPS</span>
          <span class="tiny" style="margin-left:auto;color:${done && done === steps.length ? '#34d399' : '#8a8386'}">
            ${steps.length ? `${done} of ${steps.length} done` : 'none yet'}</span>
        </div>
        ${steps.length ? `<div class="tmprog"><i style="width:${pct}%"></i></div>` : ''}
        <div class="rowlist" style="gap:7px;margin-top:10px">
          ${steps.map(s => `
            <div class="tmrow${s.done ? ' on' : ''}"
                 oncontextmenu="App.subtaskMenu(event,'${esc(t.id)}','${esc(s.id)}')">
              <button class="tmbox${s.done ? ' on' : ''}" title="${s.done ? 'Reopen' : 'Done'}"
                      onclick="App.toggleSubtask('${esc(t.id)}','${esc(s.id)}',${!s.done})">✓</button>
              <input class="tx" id="tmStep-${esc(s.id)}" value="${esc(s.title)}"
                     title="Type to rename · Enter or click away to save"
                     onkeydown="App.stepKey(event,'${esc(t.id)}','${esc(s.id)}')"
                     onblur="App.saveStepTitle('${esc(t.id)}','${esc(s.id)}',this)">
              <button class="x" title="Remove this step"
                      onclick="App.removeSubtask('${esc(t.id)}','${esc(s.id)}')">✕</button>
            </div>`).join('')
            || '<div class="tiny" style="color:#726c6f">Break it down — add the first step below.</div>'}
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <input id="tmNew" class="search" style="flex:1;font-family:var(--sans);padding:10px 12px"
                 placeholder="Add a step — Enter to add, keeps going"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();App.addSubtask()}">
          <button class="sendbtn" style="min-width:70px" onclick="App.addSubtask()">Add</button>
        </div>
        <button class="chip" style="cursor:pointer;margin-top:9px"
                onclick="App.quickAddSubtask('${esc(t.id)}')">＋ add several at once</button>
      </div>

      <div style="display:flex;gap:10px;align-items:center;margin-top:20px;
                  border-top:1px solid rgba(255,255,255,.06);padding-top:14px">
        <span class="tiny" style="color:#5c5659">writes straight into the vault JSON</span>
        <button class="chip" style="cursor:pointer;margin-left:auto;color:#ff8a94"
                onclick="App.deleteTask('${esc(t.id)}')">Delete task</button>
      </div>`;
  },

  /* Every task write comes back as the whole task. Splicing it into the board
     we already hold repaints instantly; the quiet reload behind it is only
     there to refresh the counters and the calendar. */
  _absorbTask(task){
    const board = this.data.board;
    if (board){
      const i = (board.tasks || []).findIndex(t => t.id === task.id);
      if (i >= 0) board.tasks[i] = task;
    }
    this.paintTaskModal();
    this.load({quiet:true});
  },

  async patchTask(id, body){
    try {
      const task = await api('/api/tasks/' + encodeURIComponent(id), {
        method:'PATCH', body: JSON.stringify(body)});
      this._absorbTask(task);
      return task;
    } catch (err) { this.toast('Could not save: ' + err.message); return null; }
  },

  setTaskField(field, value){
    const t = this.currentTask();
    if (!t) return;
    this.patchTask(t.id, {[field]: value});
  },

  /* Called by the button and by the blur on either box. quiet:true is the
     blur path — it must not nag when nothing was typed, and must not fight the
     user by writing a title back that they only tabbed through. */
  saveTaskDetails(opts){
    const t = this.currentTask();
    if (!t) return;
    // Read both before clearing: clearDrafts empties the live boxes as well as
    // the draft store, so reading afterwards saves a blank note.
    const title = (($('tmTitle') || {}).value || '').trim();
    const notes = (($('tmNotes') || {}).value || '').trim();
    const quiet = opts && opts.quiet;
    if (!title){
      if (quiet){
        // Blurring an emptied title puts the real one back rather than
        // refusing to save and leaving a blank box on screen.
        const box = $('tmTitle');
        if (box) box.value = t.title;
        delete this.drafts.tmTitle;
        return;
      }
      return this.toast('A task needs a title.');
    }
    if (title === t.title && notes === (t.notes || '')){
      // Nothing changed — clear the drafts so a later repaint reads the server's
      // copy, and skip the write.
      delete this.drafts.tmTitle;
      delete this.drafts.tmNotes;
      return;
    }
    this.clearDrafts(['tmTitle', 'tmNotes']);
    this.patchTask(t.id, {title, notes});
  },

  /* Enter commits a step rename, Escape puts the old title back. Both leave
     the field, which is what actually triggers the save. */
  stepKey(ev, taskId, subtaskId){
    if (ev.key === 'Enter'){ ev.preventDefault(); ev.target.blur(); }
    else if (ev.key === 'Escape'){
      ev.preventDefault();
      ev.stopPropagation();
      const t = ((this.data.board || {}).tasks || []).find(x => x.id === taskId);
      const step = t && (t.subtasks || []).find(x => x.id === subtaskId);
      ev.target.value = step ? step.title : ev.target.value;
      delete this.drafts[ev.target.id];
      ev.target.blur();
    }
  },

  async saveStepTitle(taskId, subtaskId, box){
    const t = ((this.data.board || {}).tasks || []).find(x => x.id === taskId);
    const step = t && (t.subtasks || []).find(x => x.id === subtaskId);
    if (!step) return;
    const title = (box.value || '').trim();
    // The draft store must not outlive the edit, or a later repaint would type
    // a stale title back over whatever the server now holds.
    delete this.drafts[box.id];
    if (!title || title === step.title){ box.value = step.title; return; }
    try {
      const task = await api(
        `/api/tasks/${encodeURIComponent(taskId)}/subtasks/${encodeURIComponent(subtaskId)}`,
        {method:'PATCH', body: JSON.stringify({title})});
      this._absorbTask(task);
    } catch (err) {
      box.value = step.title;
      this.toast('Could not rename it: ' + err.message);
    }
  },

  async addSubtask(taskId){
    const t = taskId ? {id: taskId} : this.currentTask();
    if (!t) return;
    const box = $('tmNew');
    const title = (box ? box.value : '').trim();
    if (!title) return;
    this.clearField(box);
    try {
      const task = await api(`/api/tasks/${encodeURIComponent(t.id)}/subtasks`,
                             {method:'POST', body: JSON.stringify({title})});
      this._absorbTask(task);
      // Adding steps is a burst, not a single act — keep the box hot.
      requestAnimationFrame(() => $('tmNew')?.focus());
    } catch (err) { this.toast('Could not add the step: ' + err.message); }
  },

  async toggleSubtask(taskId, subtaskId, done){
    try {
      const task = await api(
        `/api/tasks/${encodeURIComponent(taskId)}/subtasks/${encodeURIComponent(subtaskId)}`,
        {method:'PATCH', body: JSON.stringify({done})});
      this._absorbTask(task);
    } catch (err) { this.toast('Could not update the step: ' + err.message); }
  },

  async renameSubtask(taskId, subtaskId, current){
    const title = await Bubble.ask('Rename this step', current || '',
                                   {heading:'Step', validate: v => v.trim() ? null : 'Give it a name.'});
    if (title === null) return;
    try {
      const task = await api(
        `/api/tasks/${encodeURIComponent(taskId)}/subtasks/${encodeURIComponent(subtaskId)}`,
        {method:'PATCH', body: JSON.stringify({title: title.trim()})});
      this._absorbTask(task);
    } catch (err) { this.toast('Could not rename it: ' + err.message); }
  },

  async removeSubtask(taskId, subtaskId){
    try {
      const task = await api(
        `/api/tasks/${encodeURIComponent(taskId)}/subtasks/${encodeURIComponent(subtaskId)}`,
        {method:'DELETE'});
      this._absorbTask(task);
    } catch (err) { this.toast('Could not remove it: ' + err.message); }
  },

  async deleteTask(id){
    const t = ((this.data.board || {}).tasks || []).find(x => x.id === id);
    const steps = (t && t.subtasks || []).length;
    const ok = await Bubble.confirm(`Delete "${t ? t.title : 'this task'}"?`,
      {heading:'Delete task',
       sub: steps ? `Its ${steps} step${steps === 1 ? '' : 's'} go with it.` : 'This cannot be undone.'});
    if (!ok) return;
    try {
      await api('/api/tasks/' + encodeURIComponent(id), {method:'DELETE'});
      if (this.openTaskId === id) this.closeTask();
      await this.load({quiet:true});
    } catch (err) { this.toast('Could not delete it: ' + err.message); }
  },

  /* ---------------- right-click menu ----------------
     Built from a list of {label, emoji, fn} rather than markup, so tasks,
     events and steps all share one renderer. The handlers can't live in
     onclick attributes — they're closures — so they sit in _ctxItems and the
     buttons call back by index. */
  _ctxItems: [],

  openCtx(ev, heading, items){
    ev.preventDefault();
    ev.stopPropagation();
    const menu = $('ctxMenu');
    if (!menu) return;
    this._ctxItems = items.filter(Boolean);
    menu.innerHTML =
      (heading ? `<div class="hd">${esc(heading)}</div>` : '') +
      this._ctxItems.map((it, i) => it.sep
        ? '<div class="sep"></div>'
        : `<button class="${it.danger ? 'danger' : ''}" onclick="App.ctxRun(${i})">
             <span class="em">${it.emoji || ''}</span><span>${esc(it.label)}</span></button>`).join('');
    menu.hidden = false;
    // Measure after painting, then clamp so the menu never opens off-screen.
    const box = menu.getBoundingClientRect();
    const x = Math.min(ev.clientX, window.innerWidth - box.width - 8);
    const y = Math.min(ev.clientY, window.innerHeight - box.height - 8);
    menu.style.left = Math.max(8, x) + 'px';
    menu.style.top = Math.max(8, y) + 'px';
  },

  closeCtx(){
    const menu = $('ctxMenu');
    if (menu) menu.hidden = true;
  },

  ctxRun(i){
    const item = this._ctxItems[i];
    this.closeCtx();
    if (item && item.fn) item.fn();
  },

  taskMenu(ev, id){
    const t = ((this.data.board || {}).tasks || []).find(x => x.id === id);
    if (!t) return;
    const moves = [['todo','To Do'],['in_progress','In Progress'],['blocked','Blocked'],['done','Done']]
      .filter(([k]) => k !== t.status)
      .map(([k, l]) => ({label: 'Move to ' + l, emoji: k === 'done' ? '✅' : '→',
                         fn: () => this.patchTask(id, {status: k})}));
    this.openCtx(ev, t.title, [
      {label:'Open details', emoji:'🫧', fn: () => this.openTask(id)},
      {label:'Rename…', emoji:'✏️', fn: () => this.renameTask(id, t.title)},
      {label:'Add sub-task…', emoji:'➕', fn: () => this.quickAddSubtask(id)},
      {label: t.notes ? 'Edit notes…' : 'Add notes…', emoji:'📝', fn: () => this.editTaskNotes(id, t.notes)},
      {sep:true},
      ...moves,
      {sep:true},
      {label:'Set due date…', emoji:'📅', fn: () => this.setTaskDue(id, t.due_date)},
      t.due_date ? {label:'Clear due date', emoji:'⌫', fn: () => this.patchTask(id, {due_date: null})} : null,
      {sep:true},
      {label:'Delete task', emoji:'🗑', danger:true, fn: () => this.deleteTask(id)},
    ]);
  },

  subtaskMenu(ev, taskId, subtaskId){
    const t = ((this.data.board || {}).tasks || []).find(x => x.id === taskId);
    const s = t && (t.subtasks || []).find(x => x.id === subtaskId);
    if (!s) return;
    this.openCtx(ev, s.title, [
      {label: s.done ? 'Mark not done' : 'Mark done', emoji: s.done ? '↺' : '✓',
       fn: () => this.toggleSubtask(taskId, subtaskId, !s.done)},
      {label:'Rename…', emoji:'✏️', fn: () => this.renameSubtask(taskId, subtaskId, s.title)},
      {sep:true},
      {label:'Delete step', emoji:'🗑', danger:true, fn: () => this.removeSubtask(taskId, subtaskId)},
    ]);
  },

  eventMenu(ev, id){
    const e = ((this.data.board || {}).events || []).find(x => x.id === id)
           || (this.data.timeline || []).find(x => x.id === id);
    if (!e) return;
    this.openCtx(ev, e.title, [
      {label:'Rename…', emoji:'✏️', fn: () => this.renameEvent(id, e.title)},
      {label:'Change date…', emoji:'📅', fn: () => this.rescheduleEvent(id, e.date)},
      {label:'Change time…', emoji:'⏰', fn: () => this.retimeEvent(id, e.time)},
      {sep:true},
      {label:'Delete event', emoji:'🗑', danger:true, fn: () => this.deleteEvent(id, e.title)},
    ]);
  },

  /* --- the prompts behind the menu items --- */
  async renameTask(id, current){
    const title = await Bubble.ask('Rename this task', current || '',
                                   {heading:'Task', validate: v => v.trim() ? null : 'Give it a title.'});
    if (title === null) return;
    this.patchTask(id, {title: title.trim()});
  },
  async editTaskNotes(id, current){
    const notes = await Bubble.ask(current ? 'Edit the notes' : 'Add notes', current || '',
                                   {heading:'Notes', kind:'textarea',
                                    placeholder:'Anything worth remembering about this one…',
                                    ok:'Save notes'});
    if (notes === null) return;
    this.patchTask(id, {notes: notes.trim()});
  },
  async setTaskDue(id, current){
    // A real date input rather than a typed string — the picker can't produce
    // a malformed date, so the only thing left to check is "blank clears it".
    const due = await Bubble.ask('When is it due?',
                                 current || localISO(),
                                 {heading:'Due date', kind:'date', sub:'Leave it empty to clear the date.'});
    if (due === null) return;
    const value = (due || '').trim();
    if (value && !/^\d{4}-\d{2}-\d{2}$/.test(value)) return Bubble.alert('That is not a valid date.');
    this.patchTask(id, {due_date: value || null});
  },
  /* Adding steps without opening the details window first. Breaking a task
     down is never one step — the bubble collects the whole list, then posts
     them in order so the numbering on the board matches what was typed. */
  async quickAddSubtask(id){
    const t = ((this.data.board || {}).tasks || []).find(x => x.id === id);
    const titles = await Bubble.list('Break this task into steps', {
      heading: t ? t.title : 'New sub-tasks',
      sub: 'Enter after each one. They save together.',
      placeholder: 'What needs doing?',
      ok: 'Add steps',
      emptyMsg: 'Type a step first.',
    });
    if (!titles || !titles.length) return;
    let task = null, failed = 0;
    for (const title of titles){
      try {
        task = await api(`/api/tasks/${encodeURIComponent(id)}/subtasks`,
                         {method:'POST', body: JSON.stringify({title})});
      } catch (err) { failed++; }
    }
    if (task) this._absorbTask(task);
    // One line either way: "3 steps added" or the count that didn't make it.
    this.toast(failed
      ? `${titles.length - failed} of ${titles.length} steps added — ${failed} failed.`
      : `${titles.length} step${titles.length === 1 ? '' : 's'} added.`);
  },

  async patchEvent(id, body){
    try {
      await api('/api/events/' + encodeURIComponent(id), {method:'PATCH', body: JSON.stringify(body)});
      await this.load({quiet:true});
    } catch (err) { this.toast('Could not save: ' + err.message); }
  },
  async renameEvent(id, current){
    const title = await Bubble.ask('Rename this event', current || '',
                                   {heading:'Event', validate: v => v.trim() ? null : 'Give it a title.'});
    if (title === null) return;
    this.patchEvent(id, {title: title.trim()});
  },
  async rescheduleEvent(id, current){
    const date = await Bubble.ask('Move it to', current || '',
                                  {heading:'Change date', kind:'date',
                                   validate: v => /^\d{4}-\d{2}-\d{2}$/.test((v || '').trim())
                                     ? null : 'Pick a date.'});
    if (date === null) return;
    this.patchEvent(id, {date: date.trim()});
  },
  async retimeEvent(id, current){
    const time = await Bubble.ask('What time?', current || '',
                                  {heading:'Change time', kind:'text', placeholder:'HH:MM (24h)',
                                   sub:'Leave it empty for an all-day event.',
                                   validate: v => {
                                     const t = (v || '').trim();
                                     return !t || /^\d{2}:\d{2}$/.test(t) ? null : 'Use HH:MM, 24-hour.';
                                   }});
    if (time === null) return;
    this.patchEvent(id, {time: time.trim()});
  },
  async deleteEvent(id, title){
    const ok = await Bubble.confirm(`Delete "${title || 'this event'}"?`,
                                    {heading:'Delete event', sub:'It comes off the calendar for good.'});
    if (!ok) return;
    try {
      await api('/api/events/' + encodeURIComponent(id), {method:'DELETE'});
      await this.load({quiet:true});
    } catch (err) { this.toast('Could not delete it: ' + err.message); }
  },

              ${open ? 'close' : 'edit'}</button>

        </div>

        ${open ? `<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);

  /* AI stack spend. Lives on the Money tab rather than its own nav entry —
     it is an expense line, and it belongs next to what it is eating into. */
  aiStackCard(){
    const a = this.data.ai;
    if (!a) return '';

    const rows = a.services.map(s => {
      const priced = s.cost > 0 || s.billing === 'free';
      return `<div class="listrow">

        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <span class="mono" style="font-size:13px;color:${priced ? '#e8e3e4' : '#5c5659'}">
            ${priced ? money(s.monthly_cost) + '<span style="color:#726c6f">/mo</span>' : 'not priced'}</span>
          <button class="chip" style="cursor:pointer" onclick="App.setAiCost(${s.id}, '${esc(s.name).replace(/'/g, "\\'")}')">set</button>
        </div>
      </div>`;
    }).join('');

    // A stack total that silently omits unpriced providers is worse than none,
    // so say so rather than presenting a confident wrong number.
    const gap = a.unpriced.length ? `
      <div class="tiny" style="color:${C.sev.warning};margin-top:10px">
        ${a.unpriced.length} service${a.unpriced.length>1?'s':''} with no cost entered
        (${esc(a.unpriced.join(', '))}) — the total below is a floor, not the real number.
      </div>` : '';

    const share = a.share_of_income > 0
      ? `<div class="tiny" style="margin-top:6px">${Math.round(a.share_of_income*100)}% of the monthly income target</div>`
      : '';

    return `<div class="card">
      <div class="cardhead"><h2>AI Stack</h2>
        <span class="mono" style="font-size:15px">${money(a.monthly_total)}<span style="color:#726c6f">/mo · ${money(a.annual_total)}/yr</span></span></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;padding:2px 0 10px">
        <div><span class="lbl tiny">FIXED</span>
          <div class="mono" style="font-size:14px">${money(a.fixed_monthly)}</div></div>
        <div><span class="lbl tiny">METERED</span>
          <div class="mono" style="font-size:14px">${money(a.usage_monthly)}</div></div>
        <div><span class="lbl tiny">SERVICES</span>
          <div class="mono" style="font-size:14px">${a.services.filter(s=>s.is_active).length}</div></div>
      </div>
      ${share}${gap}
      <div class="rowlist" style="margin-top:12px">${rows}</div>
    </div>`;
  },

  async setAiCost(id, name){
    const raw = await Bubble.ask(`Monthly cost for ${name}`, '',
      {heading:'AI stack', kind:'number', placeholder:'0', ok:'Save cost',
       sub:'Enter 0 if you are not paying for it right now.',
       validate: v => {
         const n = parseFloat(v);
         return Number.isFinite(n) && n >= 0 ? null : 'Enter a number, 0 or more.';
       }});
    if (raw === null) return;
    const cost = parseFloat(raw);
    try {
      await api(`/api/money/ai-stack/${id}`, {method:'PATCH', body: JSON.stringify({cost})});
      await this.load();
    } catch (err) { alert('Could not save: ' + err.message); }
  },

  editing: null,
  toggleEdit(id){ this.editing = this.editing === id ? null : id; this.render(); },

  async saveVenture(id){
    const val = k => ($(`v-${k}-${id}`) || {}).value;
    const target = parseFloat(val('target'));
    const payload = {
      stage: val('stage'),
      monthly_target: Number.isFinite(target) ? target : 0,
      next_action: (val('next') || '').trim(),
      thesis: (val('thesis') || '').trim(),
    };
    try {
      await api('/api/ventures/' + id, {method:'PATCH', body: JSON.stringify(payload)});
      this.clearDrafts([`v-target-${id}`, `v-next-${id}`, `v-thesis-${id}`]);
      this.editing = null;
      await this.load();
    } catch (err) { alert('Could not save: ' + err.message); }
  },

  async logMoney(id, kind){
    const amount = parseFloat(($(`v-amt-${id}`) || {}).value);
    const label = (($(`v-label-${id}`) || {}).value || '').trim();
    if (!Number.isFinite(amount) || amount <= 0) return alert('Enter an amount first.');
    if (!label) return alert('Say what it was — the ledger is useless without labels.');
    try {
      await api(`/api/ventures/${id}/events`, {
        method:'POST', body: JSON.stringify({kind, amount, label}),
      });
      this.clearDrafts([`v-amt-${id}`, `v-label-${id}`]);
      await this.load();
    } catch (err) { alert('Could not log it: ' + err.message); }
  },

  financeTab: 'debts',
  setFinanceTab(tab){ this.financeTab = tab; this.render(); },

    return `<div class="stack">${tabStrip}${tab === 'credit' ? this.financeCreditHTML() : this.financeDebtsHTML()}</div>`;

  financeDebtsHTML(){
    const f = this.data.finance, plan = this.data.financePlan;

      {label:'OWED', value: money(f.total_debt), hint: `${(f.debts||[]).filter(d=>d.balance>0).length} open`,

        <div class="hint">${esc(t.hint)}</div>

    // The ONE move, quoted from the API rather than re-derived here — the deck

    const rec = (plan && plan.recommendation) || f.next_move || {};
    const nextMove = rec.headline ? `
      <div class="alertcard" style="border:1px solid ${alpha(C.module.finance,'44')}">
        <span class="mono" style="font-size:10px;letter-spacing:1px;color:${C.module.finance}">NEXT MOVE · ${esc((rec.strategy||'').toUpperCase())}</span>

        <div style="font-size:12px;color:#8a8386;margin-top:6px">${esc(rec.why || '')}</div>

    const overdue = (f.overdue_debts || []).length ? `
      <div class="alertcard" style="border:1px solid ${alpha(C.sev.warning,'33')}">

        <div style="font-size:13px;margin-top:6px">

      </div>` : '';

    const debts = (f.debts || []).length ? f.debts.map(d => {

          <div style="font-size:14px;font-weight:600;${paid?'text-decoration:line-through;color:#726c6f':''}">${esc(d.creditor)}</div>
          <div class="tiny" style="margin-top:2px;color:#8a8386">
            ${d.interest_rate != null ? d.interest_rate + '% APR' : 'no rate recorded'}${d.due_date ? ' · due ' + esc(d.due_date) : ''}${d.notes ? ' · ' + esc(d.notes) : ''}</div>
          ${pct > 0 && !paid ? `<div class="bar" style="max-width:280px"><i style="width:${Math.min(100,pct)}%"></i></div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
          <span class="mono" style="font-size:13px">${paid ? '<span style="color:'+C.health.green+'">paid off</span>'

          ${paid ? '' : `<div style="display:flex;gap:6px">
            <button class="chip" style="cursor:pointer" onclick="App.payDebt(${d.id})">pay</button>
            <button class="chip" style="cursor:pointer" onclick="App.settleDebt(${d.id})">paid off</button>
          </div>`}
        </div>
      </div>`;
    }).join('') : '<div class="empty">No debts. Keep it that way.</div>';

    const strategyTable = plan && plan.monthly_payment ? `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
        ${['avalanche','snowball'].map(k => {
          const s = plan[k], picked = rec.strategy === k;
          return `<div class="tile" style="${picked?`border-color:${alpha(C.module.finance,'66')}`:''}">
            <div class="top"><span class="lbl">${k.toUpperCase()}${picked?' · PICKED':''}</span>${dot(picked?C.module.finance:C.health.unknown)}</div>
            <div class="val" style="font-size:18px;margin-top:8px">${s.debt_free_date || 'never at this rate'}</div>
            <div class="hint">${s.months_to_debt_free ? s.months_to_debt_free + ' months · ' + money(s.total_interest) + ' interest' : 'payment does not cover the interest'}</div>
            <div class="tiny" style="margin-top:8px;color:#8a8386">${s.order.map(o => esc(o.creditor)).join(' → ')}</div>
          </div>`;
        }).join('')}
      </div>` : '<div class="empty">Set a monthly payment above to project payoff dates.</div>';

    const accounts = (f.investment_accounts || []).length ? f.investment_accounts.map(a => `
      <div class="row">
        ${dot(C.health.green)}
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600">${esc(a.name)}</div>
          <div class="tiny" style="margin-top:2px;color:#8a8386">${esc(a.type)} · updated ${ago(a.updated_at)}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <span class="mono" style="font-size:13px">${money(a.balance)}</span>
          ${a.contributions_to_date ? `<div class="tiny" style="color:${a.gain>=0?C.health.green:C.health.red}">${a.gain>=0?'+':''}${money(a.gain)}</div>` : ''}
        </div>
      </div>`).join('') : '<div class="empty">No accounts tracked. Balances are entered by hand — nothing is fetched.</div>';

    const goals = (f.investment_goals || []).length ? f.investment_goals.map(g => `
      <div class="row" style="align-items:flex-start">
        ${dot(g.on_track === true ? C.health.green : g.on_track === false ? C.sev.warning : C.health.unknown)}
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(g.name)}</div>
          <div class="tiny" style="margin-top:2px;color:#8a8386">
            ${money(g.current_value)} of ${money(g.target_amount)}${g.months_at_current_rate != null ? ' · ' + g.months_at_current_rate + ' months at ' + money(g.monthly_contribution) + '/mo' : ' · no contribution set'}</div>
          <div class="bar" style="max-width:280px"><i style="width:${Math.min(100, Math.round((g.progress||0)*100))}%"></i></div>
        </div>
        <span class="mono" style="font-size:12px;flex-shrink:0">${Math.round((g.progress||0)*100)}%</span>
      </div>`).join('') : '<div class="empty">No goals set.</div>';

    const notes = (this.data.notes || []).length ? this.data.notes.map(n => `
      <div class="row" style="align-items:flex-start">
        ${dot(n.pinned ? C.module.finance : C.health.unknown)}
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${n.pinned ? '📌 ' : ''}${esc(n.title)}</div>
          <div class="tiny" style="margin-top:2px;color:#8a8386">
            ${esc(n.category)}${n.institution ? ' · ' + esc(n.institution) : ''}${n.last4 ? ' · ••••' + esc(n.last4) : ''}${n.opened_on ? ' · opened ' + esc(n.opened_on) : ''}</div>
          ${n.body ? `<div style="font-size:12px;color:#726c6f;margin-top:4px;white-space:pre-wrap">${esc(n.body)}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="chip" style="cursor:pointer" onclick="App.pinNote(${n.id}, ${n.pinned ? 'false' : 'true'})">${n.pinned ? 'unpin' : 'pin'}</button>
          <button class="chip" style="cursor:pointer" onclick="App.deleteNote(${n.id})">delete</button>
        </div>
      </div>`).join('') : '<div class="empty">Nothing written down yet. Log an account below so you remember it.</div>';

    return `<div class="stack">
      <div class="tiles">${statCards}</div>
      ${overdue}${nextMove}

      <section class="card">
        <div class="cardhead"><h2>Debts</h2>
          <span class="tiny">${money(f.total_debt)} outstanding</span></div>
        ${debts}
      </section>

      <section class="card">
        <div class="cardhead"><h2>Payoff plan</h2>
          <span class="tiny">advisory — nothing here moves money</span></div>
        <div style="display:flex;gap:10px;align-items:flex-end;padding:4px 0 14px">
          <label style="display:flex;flex-direction:column;gap:6px;flex:1;max-width:220px">
            <span class="lbl tiny">MONTHLY PAYMENT</span>
            <input id="fn-monthly" class="search" type="number" min="1" step="10"
                   value="${this.payoffMonthly || ''}" placeholder="350" style="padding:9px 10px">
          </label>
          <button class="chip" style="cursor:pointer;padding:10px 14px" onclick="App.projectPayoff()">project</button>
        </div>
        ${strategyTable}
      </section>

      <section class="card">
        <div class="cardhead"><h2>Accounts &amp; goals</h2>
          <span class="tiny">manual balances — no market data in v1</span></div>
        ${accounts}
        <div style="height:10px"></div>
        ${goals}
      </section>

      <section class="card">
        <div class="cardhead"><h2>Notes</h2>
          <span class="tiny">accounts opened, terms worth remembering</span></div>
        ${notes}
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:14px 0 4px">
          <label style="display:flex;flex-direction:column;gap:6px">
            <span class="lbl tiny">TITLE</span>
            <input id="fn-title" class="search" placeholder="Discover It secured" style="padding:9px 10px">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span class="lbl tiny">CATEGORY</span>
            <select id="fn-cat" class="search" style="padding:9px 10px">
              ${['account','card','loan','subscription','contact','tax','general'].map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span class="lbl tiny">WHERE</span>
            <input id="fn-inst" class="search" placeholder="Discover" style="padding:9px 10px">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span class="lbl tiny">LAST 4</span>
            <input id="fn-last4" class="search" maxlength="4" inputmode="numeric" placeholder="4821" style="padding:9px 10px">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span class="lbl tiny">OPENED</span>
            <input id="fn-opened" class="search" type="date" style="padding:9px 10px">
          </label>
        </div>
        <label style="display:flex;flex-direction:column;gap:6px;padding-bottom:10px">
          <span class="lbl tiny">DETAILS</span>
          <textarea id="fn-body" class="search" rows="2" placeholder="$200 deposit, gas only, autopay on the 3rd" style="padding:9px 10px;resize:vertical"></textarea>
        </label>
        <div class="tiny" style="color:#8a8386;padding-bottom:10px">
          Never put a password, PIN, or full account number in here — this is a plain file on the machine.
        </div>
        <button class="chip" style="cursor:pointer;padding:10px 14px" onclick="App.addNote()">write it down</button>
      </section>
    </div>`;
  },

  async projectPayoff(){
    const raw = parseFloat($('fn-monthly').value);
    this.payoffMonthly = Number.isFinite(raw) && raw > 0 ? raw : null;
    await this.load();
  },

  async payDebt(id){
    // Name looked up rather than passed through the markup: a creditor called
    // "Ray's" would break out of an inline string literal once esc() had turned
    // the apostrophe into an entity the HTML parser hands back as a quote.
    const debt = (this.data.finance.debts || []).find(d => d.id === id);
    const raw = await Bubble.ask(`How much did you put at ${debt ? debt.creditor : 'this debt'}?`, '50',
      {heading:'Log a payment', kind:'number', ok:'Log it',
       validate: v => {
         const n = parseFloat(v);
         return Number.isFinite(n) && n > 0 ? null : 'Enter an amount greater than zero.';
       }});
    if (raw === null) return;
    const amount = parseFloat(raw);
    try {
      await api(`/api/finance/debts/${id}/payments`, {method:'POST', body: JSON.stringify({amount})});
      await this.load();
    } catch (err) { alert('Could not record it: ' + err.message); }
  },

  async settleDebt(id){
    const debt = (this.data.finance.debts || []).find(d => d.id === id);
    const ok = await Bubble.confirm(`Mark ${debt ? debt.creditor : 'this debt'} paid off in full?`,
      {heading:'Settle debt', ok:'Paid off', cancel:'Not yet', danger:false});
    if (!ok) return;
    try {
      await api(`/api/finance/debts/${id}/paid`, {method:'POST'});
      await this.load();
    } catch (err) { alert('Could not settle it: ' + err.message); }
  },

  async addNote(){
    const title = $('fn-title').value.trim();
    if (!title) return alert('Give it a title so you can find it later.');
    const last4 = $('fn-last4').value.trim();
    if (last4 && !/^\d{1,4}$/.test(last4)) return alert('Last 4 must be up to four digits — never the full number.');
    try {
      await api('/api/finance/notes', {method:'POST', body: JSON.stringify({
        title, category: $('fn-cat').value, institution: $('fn-inst').value.trim(),
        last4, opened_on: $('fn-opened').value || null, body: $('fn-body').value.trim(),
      })});
      this.clearDrafts(['fn-title','fn-inst','fn-last4','fn-opened','fn-body']);
      await this.load();
    } catch (err) { alert('Could not save it: ' + err.message); }
  },

  async pinNote(id, pinned){
    try {
      await api(`/api/finance/notes/${id}`, {method:'PATCH', body: JSON.stringify({pinned})});
      await this.load();
    } catch (err) { alert('Could not update it: ' + err.message); }
  },

  async deleteNote(id){
    const note = (this.data.notes || []).find(n => n.id === id);
    const ok = await Bubble.confirm(`Delete "${note ? note.title : 'this note'}"?`,
                                    {heading:'Delete note'});
    if (!ok) return;
    try {
      await api(`/api/finance/notes/${id}`, {method:'DELETE'});
      await this.load();
    } catch (err) { alert('Could not delete it: ' + err.message); }
  },

  financeCreditHTML(){
    const c = this.data.credit;
    if (!c) return '<div class="empty">No credit data.</div>';

    const BUREAUS = ['Equifax','Experian','TransUnion'];
    // FICO bands. Anything under 580 is "poor" and is what the build plan
    // exists to climb out of; 670 is the first band a real lender will look at.
    const band = s => s >= 740 ? C.health.green : s >= 670 ? '#a3e635'
                    : s >= 580 ? C.health.yellow : C.health.red;

    const scoreCards = BUREAUS.map(b => {
      const s = (c.latest_scores || []).filter(x => x.bureau === b)
                  .sort((a, z) => z.recorded_on.localeCompare(a.recorded_on))[0];
      return `<div class="tile">
        <div class="top"><span class="lbl">${b.toUpperCase()}</span>${dot(s ? band(s.score) : C.health.unknown)}</div>
        <div class="val" style="font-size:30px;margin-top:8px;${s?`color:${band(s.score)}`:'color:#5c5659;font-size:20px'}">
          ${s ? s.score : 'no score'}</div>
        <div class="hint">${s ? esc(s.score_type) + ' · ' + esc(s.recorded_on) : 'add a reading below'}</div>
      </div>`;
    }).join('');

    const util = Math.round((c.utilization || 0) * 100);
    const statCards = [
      {label:'UTILIZATION', value: c.total_limit ? util + '%' : 'n/a',
       hint: c.total_limit ? money(c.total_balance) + ' of ' + money(c.total_limit) : 'no revolving limit yet',
       // AZEO wants one card at 1-9%. Over 30% is the classic score killer.
       color: !c.total_limit ? null : util <= 9 ? C.health.green : util <= 29 ? C.health.yellow : C.health.red},
      {label:'STACK COST', value: money(c.monthly_cost) + '/mo',
       hint: 'recurring — lean plan targets $45-50',
       color: c.monthly_cost <= 50 ? C.health.green : c.monthly_cost <= 90 ? C.health.yellow : C.health.red},
      {label:'DEPOSITS HELD', value: money(c.deposits_held), hint:'refundable, returns on graduation'},
      {label:'PLAN PROGRESS', value: Math.round((c.plan_progress || 0) * 100) + '%',
       hint: `${(this.data.creditPlan || []).filter(s => s.done).length} of ${(this.data.creditPlan || []).length} steps done`,
       color: C.health.green},
    ].map(t => `<div class="tile">
        <div class="top"><span class="lbl">${t.label}</span>${dot(t.color || C.health.unknown)}</div>
        <div class="val" style="font-size:24px;margin-top:8px">${esc(t.value)}</div>
        <div class="hint">${esc(t.hint)}</div>
      </div>`).join('');

    // Bucket B is the playbook's manufactured-file risk. Only worth surfacing
    // once he is actually over the cap.
    const bucketWarn = (c.bucket_b_count || 0) > 2 ? `
      <div class="alertcard" style="border:1px solid ${alpha(C.sev.warning,'33')}">
        <span class="mono" style="font-size:10px;letter-spacing:1px;color:${C.sev.warning}">BUCKET B</span>
        <div style="font-size:13px;margin-top:6px">${c.bucket_b_count} fintech synthetic accounts open.
        The plan caps these at 2 — past that an underwriter reads the file as manufactured.</div>
      </div>` : '';

    const overdue = (c.overdue_disputes || []).length ? `
      <div class="alertcard" style="border:1px solid ${alpha(C.sev.critical,'33')}">
        <span class="mono" style="font-size:10px;letter-spacing:1px;color:${C.sev.critical}">PAST THE 30-DAY WINDOW</span>
        <div style="font-size:13px;margin-top:6px">
          ${c.overdue_disputes.length} dispute${c.overdue_disputes.length>1?'s':''} with no bureau response.
          A missed deadline is itself grounds for deletion — escalate rather than refile.</div>
      </div>` : '';

    const phase = (c.next_steps || [])[0]?.phase || '—';

      await api('/api/credit/scores', {method:'POST', body: JSON.stringify({
        bureau: $('cr-bureau').value, score_type: $('cr-type').value,
        score, recorded_on: $('cr-date').value || null,

       sub:'This starts the 30-day response window.',
       validate: v => /^\d{4}-\d{2}-\d{2}$/.test((v || '').trim()) ? null : 'Pick a date.'});
