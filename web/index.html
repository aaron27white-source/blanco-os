  {key:'calendar',  label:'Calendar',      code:'CAL', eyebrow:'MODULE', title:'Calendar',     subtitle:'Business and personal on one grid — so nothing double-books.'},
  {key:'bridge',    label:'Your Business',         code:'BIZ', eyebrow:'MODULE', title:'Your Business',        subtitle:'The work OS — five divisions.'},
  // Divisions nest under Your Business in the nav. They are not views of their own:
  // `bz` routes the click to the Your Business page with that division selected.
  {key:'bz:consultations', label:'Consultations & Automations', code:'CA', parent:'bridge', bz:'consultations'},
  {key:'bz:electronics',   label:'Electronics',                 code:'EL', parent:'bridge', bz:'electronics'},
  {key:'bz:ecommerce',     label:'E-Commerce',                  code:'EC', parent:'bridge', bz:'ecommerce'},
  {key:'bz:freight',       label:'Freight Broker',              code:'FB', parent:'bridge', bz:'freight'},
  {key:'bz:freelance',     label:'Freelance',                   code:'FL', parent:'bridge', bz:'freelance'},
  // Not a division — the register of standing accounts. It sits with them in
  // the nav anyway, because it is one of the Your Business tabs and this list is what
  // builds that menu.
  {key:'bz:annotations',   label:'Annotations',                 code:'AN', parent:'bridge', bz:'annotations'},
  // Last in the list, with Knowledge and Agent Fleet nested under it.
  {key:'systems',   label:'System',        code:'SY', eyebrow:'MODULE', title:'System',        subtitle:'Services, cron, disks.'},
  {key:'knowledge', label:'Knowledge',     code:'KN', eyebrow:'MODULE', title:'Knowledge',     subtitle:'The second brain, indexed.',   parent:'systems'},
  {key:'agents',    label:'Agent Fleet',   code:'AG', eyebrow:'MODULE', title:'Agent Fleet',   subtitle:'Roster, roles, live status.',  parent:'systems'},
];

/* Sub-tabs merged under the one "Personal" nav entry — Tasks, Investments &
   Ventures, Finance & Credit, Cert Track, Journal, and Email each used to be
   their own top-level module; now they're panels behind one tab strip. */
const PERSONAL_TABS = [
  {key:'jobs',    label:'Job Search',              need:'jobs'},
  {key:'finance', label:'Finance & Credit',        need:'finance'},
  {key:'certs',   label:'Cert Track',              need:'certs'},
  {key:'journal', label:'Journal',                 need:'journal'},
  {key:'email',   label:'Email',                   need:'inbox'},
];

/* Who the corner dock talks to on each page — the one place that says so.
   Keyed by view, or view/tab where a view has tabs. Agent ids must match a
   roster (GET /api/chat/agents?engine=): an unknown id silently falls back to
   the commander itself, which is how Investments ended up answered by Sweet
   Jones for weeks. Scheduler, Key, Courier and Email live in Hermes now. */
const DOCK_AGENTS = {
  'business':            {engine:'openclaw', agent:'stack'},
  'personal/jobs':       {engine:'claude',   agent:'job-search'},
  'personal/finance':    {engine:'openclaw', agent:'finance'},
  'personal/certs':      {engine:'openclaw', agent:'main'},
  'personal/journal':    {engine:'openclaw', agent:'main'},
  'personal/email':      {engine:'hermes',   agent:'email'},
  'calendar':            {engine:'hermes',   agent:'scheduler'},
  'command/calendar':    {engine:'hermes',   agent:'scheduler'},
  'bridge/overview':     {engine:'hermes',   agent:'key'},
  'bridge/consultations':{engine:'hermes',   agent:'key'},
  'bridge/electronics':  {engine:'openclaw', agent:'circuit'},
  'bridge/ecommerce':    {engine:'hermes',   agent:'key'},
  'bridge/freight':      {engine:'hermes',   agent:'freight'},
  'bridge/freelance':    {engine:'claude',   agent:'proposals'},
  'bridge/alerts':       {engine:'hermes',   agent:'courier'},
  'bridge/notices':      {engine:'hermes',   agent:'key'},
  'systems':             {engine:'openclaw', agent:'main'},
  'knowledge':           {engine:'openclaw', agent:'main'},
  'agents':              {engine:'openclaw', agent:'main'},
};

/* Your Business runs as five divisions. The nav key stays 'bridge' — the bell, the
   unread badge and C.module all address it by that name — but the tab is the
   whole work OS now, and the notice feed it started as is one panel inside it.
   Division keys match the ids seeded by migration 016. */
const BIZ_TABS = [
  {key:'overview',      label:'Overview'},
  {key:'consultations', label:'Consultations & Automations'},
  {key:'electronics',   label:'Electronics'},
  {key:'ecommerce',     label:'E-Commerce'},
  {key:'freight',       label:'Freight Broker'},
  {key:'freelance',     label:'Freelance'},
  {key:'annotations',   label:'Annotations'},
];
const BIZ_DIVISIONS = ['consultations', 'electronics', 'ecommerce', 'freight', 'freelance'];
const DEAL_STAGES = ['lead', 'qualified', 'proposal', 'won', 'lost'];
const JOB_STATUSES = ['saved', 'applied', 'interviewing', 'offer', 'rejected', 'withdrawn'];
/* The register of standing accounts — not a pipeline, so these are states of
   work rather than stages of a sale. Order is the order they get worked. */
const ANNOTATION_STATUSES = ['needs_finish', 'blocked', 'active', 'done', 'dormant'];
const ANNOTATION_KINDS = ['platform', 'client', 'vendor', 'marketplace', 'service', 'other'];
const ANNOTATION_STATUS_COLOR = {
  needs_finish:'#ffb020', blocked:'#ff2d3d', active:'#38bdf8',
  done:'#34d399', dormant:'#726c6f',
};

const C = {
  health:{green:'#34d399', yellow:'#ffb020', red:'#ff2d3d', unknown:'#726c6f'},
  sev:{critical:'#ff2d3d', warning:'#ffb020', info:'#38bdf8'},
  status:{online:'#34d399', standby:'#a78bfa', scheduled:'#ffb020', unknown:'#a79fa1', offline:'#4a4548'},
  service:{up:'#34d399', stale:'#ffb020', down:'#ff2d3d', unknown:'#726c6f'},
  stage:{idea:'#726c6f', building:'#38bdf8', piloting:'#a78bfa', earning:'#34d399', paused:'#ffb020', archived:'#726c6f'},
  cert:{not_started:'#726c6f', in_progress:'#ffb020', passed:'#34d399', failed:'#ff2d3d', dropped:'#726c6f'},
  prio:{high:'#ff5b66', medium:'#ffb020', low:'#a29a9d'},
  deal:{lead:'#726c6f', qualified:'#38bdf8', proposal:'#a78bfa', won:'#34d399', lost:'#ff2d3d'},
  module:{tasks:'#a78bfa', calendar:'#a78bfa', money:'#34d399', business:'#34d399', finance:'#2dd4bf', certs:'#f472b6', journal:'#38bdf8',
          command:'#ff5b66', systems:'#ffb020', bridge:'#38bdf8', knowledge:'#ffb020', agents:'#ff5b66'},
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const alpha = (hex, a='1a') => hex + a;

function money(n){
  const v = Number(n) || 0;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', {maximumFractionDigits: 0});
}
function ago(iso){
  if (!iso) return '—';
  const then = new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  if (isNaN(then)) return '—';
  const s = Math.floor((Date.now() - then.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function hhmm(iso){
  const d = new Date(iso && !iso.endsWith('Z') && !iso.includes('+') ? iso + 'Z' : iso);
  return isNaN(d) ? '—' : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
/* The local calendar day as YYYY-MM-DD. toISOString() is UTC, which in
   Houston rolls over to tomorrow at 7 PM (6 PM in winter), so "today",
   "overdue" and date-input defaults were a day ahead every evening. */
function localISO(d = new Date()){
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function dueLabel(d){
  if (!d) return '—';
  const today = localISO();
  if (d < today) return 'OVERDUE';
  if (d === today) return 'TODAY';
  return new Date(d + 'T12:00:00').toLocaleDateString([], {month:'short', day:'numeric'});
}
/* Minimal markdown for agent replies. Escapes FIRST, then re-introduces only
   bold, inline code and bullets — so nothing an agent returns can inject HTML. */
function mdLite(raw){
  return esc(raw ?? '')
    .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.9em">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|\n)[-•]\s+/g, '$1 • ');
}
function fmtClock(secs){
  const s = Math.max(0, Math.round(secs));
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}
function dot(color, live){ return `<span class="dot${live?' live':''}" style="background:${color}"></span>`; }
function pill(text, color){
  return `<span class="pill" style="color:${color};background:${alpha(color)}">${esc(text)}</span>`;
}

async function api(path, opts){
  const res = await fetch(API + path, {headers:{'content-type':'application/json'}, ...opts});
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText + ' — ' + path);
  return res.status === 204 ? null : res.json();
}

/* ---------- alarm sound engine ----------
   Every preloaded alarm is synthesised with Web Audio, so the deck ships with
   zero audio assets and stays fully playable offline. A synth schedules its
   notes onto `out` (a gain node the caller owns and can disconnect to kill the
   alarm mid-pattern) and returns the time it finishes, so repeats can be
   scheduled back to back. */
function _osc(ctx, out, {type='sine', f=880, f2=null, at=0, dur=0.3, peak=0.5, attack=0.008}){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, at);
  if (f2 !== null) o.frequency.linearRampToValueAtTime(f2, at + dur);
  // Exponential ramps can never touch zero, hence the 0.0001 floor.
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), at + Math.min(attack, dur / 2));
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(out);
  o.start(at);
  o.stop(at + dur + 0.03);
  return at + dur;
}

function _noise(ctx, out, {at=0, dur=1.2, peak=0.3, cutoff=900}){
  const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = cutoff;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(peak, at + dur * 0.45);
  g.gain.linearRampToValueAtTime(0.0001, at + dur);
  src.connect(lp).connect(g).connect(out);
  src.start(at);
  src.stop(at + dur + 0.03);
  return at + dur;
}

const ALARM_SOUNDS = [
  {id:'classic', name:'Classic Alarm', feel:'Harsh buzz', synth(ctx, out, t){
    let end = t;
    for (let i = 0; i < 3; i++)
      end = _osc(ctx, out, {type:'square', f:2000, at:t + i, dur:0.5, peak:0.35});
    return end;
  }},
  {id:'beep', name:'Digital Beep', feel:'Short triple beep', synth(ctx, out, t){
    let end = t;
    for (let i = 0; i < 3; i++)
      end = _osc(ctx, out, {type:'sine', f:1000, at:t + i * 0.24, dur:0.12, peak:0.5});
    return end;
  }},
  {id:'chime', name:'Chime', feel:'Gentle ding-dong', synth(ctx, out, t){
    _osc(ctx, out, {type:'sine', f:880, at:t, dur:0.4, peak:0.5});
    return _osc(ctx, out, {type:'sine', f:660, at:t + 0.42, dur:0.6, peak:0.5});
  }},
  {id:'marimba', name:'Marimba', feel:'Soft woodblock arpeggio', synth(ctx, out, t){
    let end = t;
    [523, 659, 784, 1047].forEach((f, i) => {
      end = _osc(ctx, out, {type:'triangle', f, at:t + i * 0.16, dur:0.34, peak:0.45});
    });
    return end;
  }},
  {id:'birds', name:'Birds', feel:'Morning chirps', synth(ctx, out, t){
    let end = t;
    for (let c = 0; c < 2; c++){
      const b = t + c * 0.75;
      _osc(ctx, out, {type:'sawtooth', f:2800, f2:3400, at:b, dur:0.07, peak:0.1, attack:0.004});
      end = _osc(ctx, out, {type:'sawtooth', f:3400, f2:2600, at:b + 0.1, dur:0.09, peak:0.1, attack:0.004});
    }
    return end;
  }},
  {id:'rooster', name:'Rooster', feel:'Wake-up call', synth(ctx, out, t){
    let end = t;
    [0, 0.34, 0.68].forEach((o, i) => {
      end = _osc(ctx, out, {type:'square', f:700 - i * 60, f2:500 - i * 60,
                            at:t + o, dur:0.3, peak:0.22});
    });
    return end;
  }},
  {id:'ocean', name:'Ocean Waves', feel:'White noise swells', synth(ctx, out, t){
    _noise(ctx, out, {at:t, dur:1.8, peak:0.28, cutoff:700});
    return _noise(ctx, out, {at:t + 1.9, dur:1.8, peak:0.24, cutoff:550});
  }},
  {id:'piano', name:'Soft Piano', feel:'Calm wake', synth(ctx, out, t){
    let end = t;
    [392, 494, 587].forEach((f, i) => {
      end = _osc(ctx, out, {type:'sine', f, at:t + i * 0.38, dur:0.9, peak:0.42, attack:0.012});
    });
    return end;
  }},
  {id:'siren', name:'Siren', feel:'Emergency', synth(ctx, out, t){
    let end = t;
    for (let i = 0; i < 4; i++){
      const up = i % 2 === 0;
      end = _osc(ctx, out, {type:'sawtooth', f:up ? 700 : 900, f2:up ? 900 : 700,
                            at:t + i * 0.5, dur:0.5, peak:0.28, attack:0.05});
    }
    return end;
  }},
  {id:'twinkle', name:'Twinkle', feel:'Star chime', synth(ctx, out, t){
    let end = t;
    [1047, 1175, 1319, 1568, 2093].forEach((f, i) => {
      end = _osc(ctx, out, {type:'sine', f, at:t + i * 0.19, dur:0.42, peak:0.3});
    });
    return end;
  }},
];

/* ---------- blob storage ----------
   A custom alarm song is megabytes of audio — localStorage would blow up, so
   the blob lives in IndexedDB and only its filename is kept in localStorage. */
const MEDIA_DB = 'blanco_os_media';
const MEDIA_STORE = 'blobs';

function idb(){
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(MEDIA_DB, 1); }
    catch (err) { return reject(err); }
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(MEDIA_STORE)) req.result.createObjectStore(MEDIA_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbTx(mode, run){
  return idb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, mode);
    const req = run(tx.objectStore(MEDIA_STORE));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}

const idbPut = (key, val) => idbTx('readwrite', s => s.put(val, key));
const idbGet = key => idbTx('readonly', s => s.get(key));
const idbDel = key => idbTx('readwrite', s => s.delete(key));

/* ---------- youtube helpers ---------- */
/* Accepts watch?v=, youtu.be/, /embed/, /shorts/ and bare 11-char ids, plus a
   ?list= playlist on any of them. */
function ytParse(raw){
  const s = String(raw || '').trim();
  if (!s) return null;
  let id = null, list = null;
  if (/^[\w-]{11}$/.test(s)) return {id: s, list: null};
  let u;
  try { u = new URL(s.startsWith('http') ? s : 'https://' + s); }
  catch (err) { return null; }
  if (!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(u.hostname)) return null;
  list = u.searchParams.get('list');
  if (u.hostname.endsWith('youtu.be')) id = u.pathname.slice(1).split('/')[0];
  else if (u.searchParams.get('v')) id = u.searchParams.get('v');
  else {
    const m = u.pathname.match(/\/(embed|shorts|v|live)\/([\w-]{11})/);
    if (m) id = m[2];
  }
  if (!id && !list) return null;
  return {id: id && /^[\w-]{11}$/.test(id) ? id : null, list};
}

function fmtTime(secs){
  const s = Math.max(0, Math.floor(secs || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const mm = h ? String(m).padStart(2, '0') : String(m);
  return (h ? h + ':' : '') + mm + ':' + String(r).padStart(2, '0');
}

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (err) { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (err) { /* private mode */ } },
  del(k){ try { localStorage.removeItem(k); } catch (err) { /* private mode */ } },
};

/* ---------- bubbles ----------
   Replaces window.prompt / confirm / alert everywhere on the deck. Each call
   returns a promise: Bubble.ask -> string|null, Bubble.confirm -> bool,
   Bubble.alert -> undefined once dismissed. Only one bubble is up at a time;
   opening a second resolves the first as cancelled, so a stray double-click
   can't leave a stack of them buried behind each other.

   Position: the bubble opens next to the last pointer press (tracked below in
   capture phase, so it fires before a menu closes and before the handler that
   opens the bubble runs). No pointer press on record — keyboard path — and it
   centres instead. */
const Bubble = {
  _at: null,          // {x, y} of the last real pointer press
  _close: null,       // resolver for whatever bubble is currently open

  track(ev){
    if (ev.clientX || ev.clientY) this._at = {x: ev.clientX, y: ev.clientY};
  },

  /* opts: {heading, message, sub, value, kind:'text'|'textarea'|'number'|'date'|'list',
            placeholder, ok, cancel, danger, wide, validate(value) -> error|null}

     kind:'list' collects many values instead of one and resolves to an array:
     Enter files the line into the stack above the box and leaves the box hot,
     every filed line stays editable in place, and Save takes whatever is in
     the box along with them. */
  open(opts){
    if (this._close) this._close(null);
    return new Promise(resolve => {
      const o = opts || {};
      const hasInput = !!o.kind;
      const isList = o.kind === 'list';
      const wrap = document.createElement('div');
      wrap.className = 'bubblewrap';
      const tag = o.kind === 'textarea' ? 'textarea' : 'input';
      const type = o.kind === 'number' ? 'number' : o.kind === 'date' ? 'date' : 'text';
      wrap.innerHTML =
        `<div class="bubble${o.danger ? ' danger' : ''}${o.wide || isList ? ' wide' : ''}"
              role="dialog" aria-modal="true">
           <div class="tail"></div>
           ${o.heading ? `<div class="bhd">${esc(o.heading)}</div>` : ''}
           <div class="bq">${esc(o.message || '')}${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</div>
           ${isList ? '<div class="bqueue"></div>' : ''}
           ${hasInput ? (tag === 'textarea'
              ? `<textarea class="bin" placeholder="${esc(o.placeholder || '')}"></textarea>`
              : `<input class="bin" type="${type}" placeholder="${esc(o.placeholder || '')}">`) : ''}
           <div class="berr"></div>
           <div class="brow">
             ${isList ? '<span class="bcount"></span>' : ''}
             ${o.cancel === null ? '' : `<button class="cancel">${esc(o.cancel || 'Cancel')}</button>`}
             <button class="go${o.danger ? ' danger' : ''}">${esc(o.ok || (hasInput ? 'Save' : 'OK'))}</button>
           </div>
           ${hasInput ? `<div class="bhint">${
              isList ? 'Enter files a line and keeps going · Esc to cancel'
                : tag === 'textarea' ? 'Ctrl+Enter to save · Esc to cancel'
                : 'Enter to save · Esc to cancel'}</div>` : ''}
         </div>`;
      document.body.appendChild(wrap);

      const box = wrap.querySelector('.bubble');
      const input = wrap.querySelector('.bin');
      const err = wrap.querySelector('.berr');
      if (input && o.value != null) input.value = o.value;

      const done = value => {
        if (this._close !== done) return;
        this._close = null;
        document.removeEventListener('keydown', onKey, true);
        wrap.remove();
        resolve(value);
      };
      this._close = done;

      const complain = msg => {
        err.textContent = msg;
        err.classList.add('on');
        input.focus();
      };
      const clearErr = () => err.classList.remove('on');

      /* ---- list mode ---- */
      const queue = [];                                  // filed lines, in order
      const qbox = wrap.querySelector('.bqueue');
      const counter = wrap.querySelector('.bcount');
      const paintQueue = () => {
        qbox.innerHTML = queue.map((v, i) => `
          <div class="bqrow">
            <span class="n">${i + 1}</span>
            <input value="${esc(v)}" data-i="${i}">
            <button class="x" data-i="${i}" title="Remove">✕</button>
          </div>`).join('');
        // Filed lines stay editable in place — a typo three steps back is
        // fixed where it is rather than by deleting and retyping it.
        qbox.querySelectorAll('input').forEach(el => {
          el.oninput = () => { queue[+el.dataset.i] = el.value; };
          el.onkeydown = e => {
            if (e.key === 'Enter'){ e.preventDefault(); input.focus(); }
          };
        });
        qbox.querySelectorAll('.x').forEach(el => {
          el.onclick = () => { queue.splice(+el.dataset.i, 1); paintQueue(); input.focus(); };
        });
        counter.textContent = queue.length
          ? `${queue.length} step${queue.length === 1 ? '' : 's'} queued` : '';
        this._place(box, wrap.querySelector('.tail'));
      };
      // Files the current line and leaves the box empty and focused.
      const file = () => {
        const v = input.value.trim();
        if (!v) return false;
        queue.push(v);
        input.value = '';
        clearErr();
        paintQueue();
        return true;
      };

      const submit = () => {
        if (!hasInput) return done(true);
        if (isList){
          file();                                        // whatever is still typed counts
          if (!queue.length) return complain(o.emptyMsg || 'Add at least one line.');
          return done(queue.slice());
        }
        const raw = input.value;
        const problem = o.validate ? o.validate(raw) : null;
        if (problem) return complain(problem);
        done(raw);
      };

      const onKey = e => {
        if (e.key === 'Escape'){ e.stopPropagation(); e.preventDefault(); done(null); }
        else if (e.key === 'Enter'){
          const inText = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
          if (inText && !e.ctrlKey && !e.metaKey) return;
          e.preventDefault();
          // In a list, plain Enter files the line; Ctrl/Cmd+Enter saves the lot.
          if (isList && !e.ctrlKey && !e.metaKey && document.activeElement === input){
            if (!file()) submit();
            return;
          }
          submit();
        }
      };
      document.addEventListener('keydown', onKey, true);
      wrap.querySelector('.go').onclick = submit;
      const cancelBtn = wrap.querySelector('.cancel');
      if (cancelBtn) cancelBtn.onclick = () => done(null);
      // Clicking the dim behind the card is a cancel; clicking the card is not.
      wrap.onclick = e => { if (e.target === wrap) done(null); };
      wrap.oncontextmenu = e => e.stopPropagation();

      this._place(box, wrap.querySelector('.tail'));
      // A one-line value is selected so typing replaces it; a textarea is a body
      // of text you came back to edit, so the caret goes to the end instead.
      if (input){
        input.focus();
        if (tag === 'textarea') input.setSelectionRange(input.value.length, input.value.length);
        else if (input.select) { try { input.select(); } catch (err) { /* date inputs */ } }
      }
      else wrap.querySelector('.go').focus();
    });
  },

  /* Anchors the card just below-right of the pointer, then pulls it back
     inside the viewport and moves the tail to wherever the anchor ended up
     relative to the card — so the tail keeps pointing at the click even after
     the card has been shoved off a screen edge. */
  _place(box, tail){
    const r = box.getBoundingClientRect();
    const pad = 12, gap = 12;
    const at = this._at;
    if (!at){
      box.style.left = Math.max(pad, (window.innerWidth - r.width) / 2) + 'px';
      box.style.top = Math.max(pad, (window.innerHeight - r.height) / 2) + 'px';
      tail.style.display = 'none';
      return;
    }
    let x = at.x + gap;
    let y = at.y + gap;
    let below = true;
    if (x + r.width + pad > window.innerWidth) x = at.x - r.width - gap;
    if (y + r.height + pad > window.innerHeight){ y = at.y - r.height - gap; below = false; }
    x = Math.max(pad, Math.min(x, window.innerWidth - r.width - pad));
    y = Math.max(pad, Math.min(y, window.innerHeight - r.height - pad));
    box.style.left = x + 'px';
    box.style.top = y + 'px';

    const tx = Math.max(14, Math.min(at.x - x, r.width - 24));
    if (below){
      tail.style.top = '-6px';
      tail.style.transform = 'rotate(45deg)';
    } else {
      tail.style.top = (r.height - 6) + 'px';
      tail.style.transform = 'rotate(225deg)';
    }
    tail.style.left = tx + 'px';
  },

  /* prompt(), but for many values — resolves to an array of trimmed strings. */
  list(message, opts){
    return this.open(Object.assign({kind:'list', message}, opts || {}));
  },
  /* prompt() */
  ask(message, value, opts){
    return this.open(Object.assign({kind:'text', message, value: value == null ? '' : value}, opts || {}));
  },
  /* confirm() */
  confirm(message, opts){
    return this.open(Object.assign({message, ok:'Delete', cancel:'Keep', danger:true}, opts || {}))
      .then(v => v === true);
  },
  /* alert() — one button, nothing to cancel. */
  alert(message, opts){
    return this.open(Object.assign({message, ok:'Got it', cancel:null, danger:false}, opts || {}))
      .then(() => undefined);
  },
};
// Capture phase: the pointer position must be on record before any handler
// that opens a bubble runs.
document.addEventListener('pointerdown', e => Bubble.track(e), true);

/* Every remaining alert() on the deck routes through the bubble instead of the
   browser's dialog. Kept as a shim rather than a rename because alert() is
   fire-and-forget at ~40 call sites, and `return alert(...)` still returns
   undefined either way. prompt() and confirm() are NOT shimmed — they are
   synchronous by contract and a bubble is not — their call sites await
   Bubble.ask / Bubble.confirm directly. */
window.alert = msg => { Bubble.alert(String(msg)); };

/* ---------- app ---------- */
/* ---------- notepad widget ----------
   A shell around /notepad.html: open/close, drag, resize, remember where it
   was. The notes, the autosave and the keyboard handling all live in that
   page, so the floating panel and the detached window behave identically and
   there is exactly one copy of the editor to maintain.

   The iframe src is only set on first open — an eagerly loaded frame would
   cost a fetch and a font load on every deck boot for a panel that is usually
   shut. Once loaded it stays loaded: closing hides the window rather than
   tearing the frame down, so reopening is instant and never mid-save. */
const Notepad = {
  loaded: false,
  drag: null,

  win(){ return $('padWin'); },

  geo(){
    try { return JSON.parse(LS.get('blanco_os_notepad_geo', '')) || null; }
    catch (err) { return null; }
  },

  saveGeo(){
    const w = this.win();
    if (w.classList.contains('full')) return;   // the class owns the geometry
    LS.set('blanco_os_notepad_geo', JSON.stringify({
      x: parseInt(w.style.left, 10), y: parseInt(w.style.top, 10),
      w: parseInt(w.style.width, 10), h: parseInt(w.style.height, 10),
    }));
  },

  /* Keep the window on screen. Called on open and on every viewport resize,
     so a panel parked at the right edge of a big monitor is still reachable
     after the deck is opened on the laptop. */
  place(geo){
    const w = this.win();
    const width  = Math.min(Math.max(geo?.w || 460, 300), Math.max(300, innerWidth  - 24));
    const height = Math.min(Math.max(geo?.h || 520, 240), Math.max(240, innerHeight - 24));
    const x = Math.min(Math.max(geo?.x ?? 16, 8), Math.max(8, innerWidth  - width  - 8));
    const y = Math.min(Math.max(geo?.y ?? Math.max(60, innerHeight - height - 80), 8),
                       Math.max(8, innerHeight - height - 8));
    w.style.width = width + 'px';
    w.style.height = height + 'px';
    w.style.left = x + 'px';
    w.style.top = y + 'px';
  },

  open(){
    const w = this.win();
    this.place(this.geo());
    w.hidden = false;
    $('padLaunch').classList.add('on');
    if (!this.loaded){ $('padFrame').src = '/notepad.html'; this.loaded = true; }
    else $('padFrame').contentWindow?.focus();
  },

  close(){
    this.win().hidden = true;
    $('padLaunch').classList.remove('on');
  },

  toggle(){ this.win().hidden ? this.open() : this.close(); },

  toggleFull(){
    const w = this.win();
    const full = w.classList.toggle('full');
    $('padFullBtn').textContent = full ? '⤡' : '⛶';
    $('padFullBtn').title = full ? 'Back to the small window' : 'Fill the screen';
    LS.set('blanco_os_notepad_full', full ? '1' : '0');
  },

  /* Delegated to the page inside, which knows which note is open. If the
     frame hasn't finished loading, open the notepad cold rather than doing
     nothing — the note it lands on is the same one the panel would show. */
  popOut(){
    const pad = $('padFrame').contentWindow?.Pad;
    if (pad) return pad.popOut();
    window.open('/notepad.html', 'blanco-os-notepad', 'popup=yes,width=520,height=620');
    this.close();
  },

  startDrag(e, mode){
    if (e.button !== undefined && e.button !== 0) return;
    const w = this.win();
    if (w.classList.contains('full') && mode === 'move') return;
    w.classList.add('dragging');
    this.drag = {
      mode, px: e.clientX, py: e.clientY,
      x: parseInt(w.style.left, 10), y: parseInt(w.style.top, 10),
      w: parseInt(w.style.width, 10), h: parseInt(w.style.height, 10),
    };
    // Capture on the grip, so a fast drag that outruns the pointer keeps
    // delivering moves instead of dropping the window wherever it lost it.
    e.target.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  },

  moveDrag(e){
    if (!this.drag) return;
    const w = this.win();
    const dx = e.clientX - this.drag.px, dy = e.clientY - this.drag.py;
    if (this.drag.mode === 'move'){
      w.style.left = Math.min(Math.max(this.drag.x + dx, 8), innerWidth  - w.offsetWidth  - 8) + 'px';
      w.style.top  = Math.min(Math.max(this.drag.y + dy, 8), innerHeight - w.offsetHeight - 8) + 'px';
    } else {
      w.style.width  = Math.min(Math.max(this.drag.w + dx, 300), innerWidth  - this.drag.x - 8) + 'px';
      w.style.height = Math.min(Math.max(this.drag.h + dy, 240), innerHeight - this.drag.y - 8) + 'px';
    }
  },

  endDrag(){
    if (!this.drag) return;
    this.drag = null;
    this.win().classList.remove('dragging');
    this.saveGeo();
  },

  init(){
    const grip = $('padGrip'), size = $('padSize'), w = this.win();
    grip.addEventListener('pointerdown', e => {
      // The buttons in the grip are not a drag handle.
      if (e.target.closest('button')) return;
      this.startDrag(e, 'move');
    });
    size.addEventListener('pointerdown', e => this.startDrag(e, 'size'));
    addEventListener('pointermove', e => this.moveDrag(e));
    addEventListener('pointerup', () => this.endDrag());
    addEventListener('pointercancel', () => this.endDrag());
    addEventListener('resize', () => { if (!w.hidden) this.place(this.geo()); });

    if (LS.get('blanco_os_notepad_full', '0') === '1') this.toggleFull();

    // The embedded page asks to be closed (its ✕, Esc, or a successful pop-out
    // into a real window). Same-origin only — nothing else may drive the deck.
    addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'blanco-notepad' && e.data.action === 'close') this.close();
    });

    // Ctrl+Shift+N from anywhere on the deck. Not plain Ctrl+N — that is the
    // browser's new window, and not Ctrl+Alt+N, which the notepad page itself
    // uses for a new note.
    addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n'){
        e.preventDefault();
        this.toggle();
      }
    });
  },
};

const App = {
  /* ?solo=<view> pins the window to one module and strips the chrome. */
  solo: new URLSearchParams(location.search).get('solo') || '',
  view: new URLSearchParams(location.search).get('solo')
        || location.hash.slice(1) || 'command',
  agentFilter: 'all',
  data: {},
  // Last good payload per view, so revisiting one renders instantly.
  cache: {},
  dragId: null,
  // Whatever the ALERTS peek is currently showing — see ack().
  openAlerts: [],

  /* ---- typed text vs. repaints ----
     Every view is rebuilt with innerHTML, and a background refresh fires on a
     60s timer, when a reply lands, and after most writes. Anything half-typed
     used to vanish with the old DOM. `drafts` remembers what was typed into
     each id'd field so the rebuilt field can be re-filled; the render pass
     also restores focus, the caret and the thread's scroll position, so a
     repaint mid-sentence is invisible. Drafts are per-view and cleared on
     navigation — see clearDrafts(). */
  drafts: {},

  rememberDraft(el){
    if (!el || !el.id) return;
    if (el.type === 'file' || el.type === 'range') return;
    this.drafts[el.id] = el.value;
  },

  /* Programmatic clears (send, enqueue) must drop the draft too, or the next
     repaint would helpfully type the sent message back into the box. */
  clearField(el){
    if (!el) return;
    el.value = '';
    if (el.id) delete this.drafts[el.id];
  },

  /* No ids = forget everything (navigation). With ids = the fields a write
     just consumed: the live box is emptied along with its draft, or the next
     capture would read the text straight back out of the DOM and the repaint
     would type the saved entry into the fresh form. */
  clearDrafts(ids){
    if (!ids) { this.drafts = {}; return; }
    for (const id of ids){ delete this.drafts[id]; const el = $(id); if (el) el.value = ''; }
  },

  /* Snapshot what the DOM knows and the next innerHTML would throw away. */
  captureFocus(){
    const el = document.activeElement;
    const typing = el && el.id && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    if (typing) this.rememberDraft(el);
    const thread = $('thread');
    return {
      id: typing ? el.id : null,
      start: typing ? el.selectionStart : null,
      end: typing ? el.selectionEnd : null,
      // Read before the swap; scrollThread() decides where it lands after.
      threadTop: thread ? thread.scrollTop : null,
      threadPinned: thread ? (thread.scrollHeight - thread.scrollTop - thread.clientHeight < 40) : true,
    };
  },

  /* Put it back into the freshly built DOM. Values first, then focus and the
     caret, so the cursor lands where it was rather than at the end. */
  restoreFocus(snap){
    for (const [id, value] of Object.entries(this.drafts)){
      if (!value) continue;
      const el = $(id);
      if (!el || el.value === value) continue;
      // A select whose options were rebuilt may no longer offer the old
      // choice — setting it anyway would blank the control.
      if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === value)) continue;
      el.value = value;
      if (el.tagName === 'TEXTAREA') this.growInput(el);
    }
    if (!snap) return;
    const thread = $('thread');
    if (thread && snap.threadTop !== null && !snap.threadPinned) thread.scrollTop = snap.threadTop;
    if (!snap.id) return;
    const el = $(snap.id);
    if (!el || el === document.activeElement) return;
    el.focus({preventScroll: true});
    try { el.setSelectionRange(snap.start, snap.end); } catch (err) { /* not a text field */ }
  },

  /* True while Blanco is actually in a text box on the current view. A quiet
     background refresh holds its repaint until he stops — data can wait a
     minute; a sentence being typed cannot be interrupted. */
  isTyping(){
    const el = document.activeElement;
    return !!(el && (el.tagName === 'TEXTAREA' ||
      (el.tagName === 'INPUT' && !['range','file','checkbox','radio','button','submit'].includes(el.type))));
  },

  async init(){
    // Before anything paints, so the saved skin doesn't flash the wrong one.
    this.applyTheme();
    if (this.solo){
      document.body.classList.add('solo');
      document.title = this.solo.charAt(0).toUpperCase() + this.solo.slice(1) + ' — Blanco OS';
    }
    this.renderNav();
    // External links go to Opera, never the Windows default browser.
    this.bindOperaLinks();
    // One delegated listener covers every field in every view, including the
    // ones a repaint hasn't created yet.
    document.addEventListener('input', e => this.rememberDraft(e.target), true);
    // A deferred repaint owes the user the fresh data as soon as they're done.
    document.addEventListener('focusout', () => {
      if (!this.pendingRender) return;
      setTimeout(() => { if (!this.isTyping() && this.pendingRender) this.render(); }, 0);
    }, true);
    this.tickClock();
    setInterval(() => this.tickClock(), 1000);
    window.addEventListener('hashchange', () => {
      if (this.solo) return;
      const v = location.hash.slice(1) || 'command';
      if (v !== this.view) { this.view = v; this.clearDrafts(); this.render(); this.load(); }
    });
    // Ctrl+Shift+M: big terminal / small terminal, without reaching for the
    // button. Only on the Command Deck, where the terminal actually lives.
    document.addEventListener('keydown', e => {
      if (!((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'm')) return;
      if (this.view !== 'command' || (this.commandTab || 'overview') !== 'overview') return;
      e.preventDefault();
      this.toggleConsoleMax();
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      // Maximised, Esc drops the terminal back into the deck — but only when
      // it isn't being used to stop a running turn (see inputKey).
      if (this.consoleMax && document.activeElement !== $('chatInput')) return this.toggleConsoleMax();
      // Innermost thing first: the menu, then the task bubble, then the player.
      if (!$('ctxMenu')?.hidden) return this.closeCtx();
      if (!$('taskModal')?.hidden) return this.closeTask();
      this.closePlayerModal();
    });
    // The right-click menu closes the way every other one does — on the next
    // click anywhere, on a scroll, or on a right-click somewhere else.
    // Capture phase, so it beats any handler underneath — but never on the
    // menu itself: hiding it here would eat the click on the item.
    document.addEventListener('pointerdown', e => {
      if (!$('ctxMenu')?.contains(e.target)) this.closeCtx();
    }, true);
    window.addEventListener('scroll', () => this.closeCtx(), true);
    window.addEventListener('blur', () => this.closeCtx());
    document.addEventListener('contextmenu', e => {
      // A right-click on empty deck dismisses the menu and gives the browser
      // its own back; handlers that opened ours already stopped propagation.
      if (!$('ctxMenu')?.contains(e.target)) this.closeCtx();
    });
    this.connectStream();
    this.initGalaxy();
    this.initPlayer();
    this.initInstall();
    // Browsers keep the AudioContext suspended until a gesture; the first
    // click anywhere buys the alarm the right to make noise later.
    const unlock = () => this._ensureAudio();
    document.addEventListener('pointerdown', unlock, {passive: true});
    document.addEventListener('keydown', unlock, {passive: true});
    this.syncTimer();
    setInterval(() => { if (document.visibilityState === 'visible') this.syncTimer(); }, 30000);
    // Playback state moves fast, so this polls quicker than the rest of the
    // deck — but only while the tab is actually on screen, and the backend
    // caches for 2s so a burst of polls costs one PowerShell call.
    this.syncNowPlaying();
    setInterval(() => {
      if (document.visibilityState === 'visible' && $('extHost')) this.syncNowPlaying();
    }, 5000);
    if ('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(() => {});
    }
    await this.load();
    setInterval(() => { if (document.visibilityState === 'visible') this.load({quiet:true}); }, 60000);
  },

  go(view){
    // In a solo window there is nowhere else to go.
    if (this.solo) return;
    this.view = view;
    // Drafts belong to the page they were typed on.
    this.clearDrafts();
    location.hash = view;
    $('navWrap').classList.remove('open');
    this.render();
    this.load();
  },

  /* Hover opens the nav on desktop; touch has no hover, so the trigger
     itself toggles the same `open` class the CSS already reacts to. */
  toggleNav(){ $('navWrap').classList.toggle('open'); },

  /* ---- theme ----
     'red' is the default skin and the one the stylesheet's :root already
     holds, so it alone carries no [data-theme] attribute. Every other skin is
     a token block in the stylesheet keyed by the same id used here; `bg` is
     repeated so the browser/PWA chrome can be tinted to match without reading
     a computed style back out. Persisted per browser.

     Adding a skin: add the CSS block, add a row here. Nothing else. */
  THEMES: {
    red:   { label: '🔴 Red',    bg: '#070707' },
    black: { label: '⚫ Black',  bg: '#030304' },
    ice:   { label: '🧊 Ice',    bg: '#03080c' },
    toxic: { label: '🧪 Toxic',  bg: '#030805' },
    vapor: { label: '🌸 Vapor',  bg: '#08030d' },
    gold:  { label: '🟡 Gold',   bg: '#0a0703' },
    deep:  { label: '🌌 Deep',   bg: '#04050c' },
  },

  theme(){
    const t = LS.get('blanco_os_theme', 'red');
    /* An unknown id (a skin that was removed, or a corrupted value) must not
       leave the deck on a [data-theme] with no rules behind it. */
    return this.THEMES[t] ? t : 'red';
  },

  applyTheme(){
    const t = this.theme();
    if (t === 'red') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.dataset.theme = t;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = this.THEMES[t].bg;
  },

  setTheme(t){
    LS.set('blanco_os_theme', this.THEMES[t] ? t : 'red');
    this.applyTheme();
    this.render();
  },

  /* Touch has no hover — tapping the caret expands "System" in place
     (an inline accordion, not a floating panel, so there's no position math
     to get wrong). Desktop gets the same thing for free via :hover. */
  toggleGroup(caret){
    const grp = caret.closest('.navgroup');
    if (grp) grp.classList.toggle('open');
  },

  /* Focus Timer is a Command Deck tab now, not its own nav entry — this is
     the one place that used to be a plain App.go('timer'). */
  openTimer(){
    this.go('command');
    this.setCommandTab('timer');
  },

  /* NAV stays the source of truth for *which* modules exist and what they are
     called; this only reorders it. Keys saved from an older build are
     reconciled rather than trusted: unknown keys are dropped and any module
     missing from the saved order is appended in NAV order, so shipping a new
     module never loses it and removing one never leaves a hole. */
  navOrder(){
    let saved = [];
    try { saved = JSON.parse(LS.get('blanco_os_nav_order', '[]')) || []; }
    catch (err) { saved = []; }
    if (!Array.isArray(saved) || !saved.length) return NAV;
    const byKey = new Map(NAV.map(n => [n.key, n]));
    const out = [];
    for (const key of saved){
      const item = byKey.get(key);
      if (item && !out.includes(item)) out.push(item);   // drops unknown keys
    }
    for (const n of NAV) if (!out.includes(n)) out.push(n);   // appends new ones
    return out;
  },

  saveNavOrder(keys){ LS.set('blanco_os_nav_order', JSON.stringify(keys)); },

  resetNavOrder(){
    LS.del('blanco_os_nav_order');
    this.renderNav();
  },

  renderNav(){
    const top = this.navOrder().filter(n => !n.parent);
    $('nav').innerHTML = top.map(n => {
      const children = NAV.filter(c => c.parent === n.key);
      const row = `<button class="${n.key===this.view?'on':''}" data-k="${n.key}" draggable="true"
              ondragstart="App.navDragStart(event,'${n.key}')"
              ondragover="App.navDragOver(event,this)"
              ondragleave="this.classList.remove('navover')"
              ondrop="App.navDrop(event,'${n.key}')"
              ondragend="App.navDragEnd()"
              onclick="App.navClick('${n.key}')">
        <span class="code">${n.code}</span>
        <span class="lbl">${esc(n.label)}</span>
        ${n.key==='bridge' ? '<span class="badge" id="navBridge" hidden>0</span>' : ''}
        ${children.length ? `<span class="grpcar" onclick="event.stopPropagation();App.toggleGroup(this)">▾</span>` : ''}
      </button>`;
      if (!children.length) return row;
      const activeChild = children.some(c => c.key === this.view);
      return `<div class="navgroup${activeChild?' on':''}">
        ${row}
        <div class="navchildren">
          ${children.map(c => `
            <button class="${(c.bz ? this.view==='bridge' && this.bizTab===c.bz : c.key===this.view)?'on':''}" onclick="App.navClick('${c.key}')">
              <span class="code">${c.code}</span><span class="lbl">${esc(c.label)}</span>
            </button>`).join('')}
        </div>
      </div>`;
    }).join('');

    const reset = $('navReset');
    if (reset) reset.hidden = !LS.get('blanco_os_nav_order', '');
    // Order is irrelevant here — this is a lookup for the page heading.
    const meta = NAV.find(n => n.key === this.view) || NAV[0];
    $('eyebrow').textContent = meta.eyebrow;
    $('title').textContent = meta.title;
    $('subtitle').textContent = meta.subtitle;
    const cur = $('navCur');
    if (cur) cur.textContent = meta.label;
    // Command Deck needs every vertical pixel for the terminal, and the nav
    // trigger already names the page — so the whole header goes there.
    // The nav trigger names the current page on every view, so the in-page
    // heading is redundant everywhere — hiding it lets each page start at
    // the same height the Command Deck's terminal does.
    const head = document.querySelector('.head');
    if (head) head.hidden = true;
  },

  /* ---- nav reordering ----
     Desktop only: HTML drag-and-drop does not fire on touch, and half-built
     touch DnD is worse than none. On a phone the nav keeps its saved order but
     cannot be rearranged. */
  navDrag: null,
  navMoved: false,

  navDragStart(ev, key){
    this.navDrag = key;
    this.navMoved = false;
    try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', key); }
    catch (err) {}
  },

  navDragOver(ev, el){
    if (!this.navDrag) return;
    ev.preventDefault();
    if (el.dataset.k !== this.navDrag){ this.navMoved = true; el.classList.add('navover'); }
  },

  navDragEnd(){
    this.navDrag = null;
    document.querySelectorAll('#nav .navover').forEach(el => el.classList.remove('navover'));
  },

  navDrop(ev, targetKey){
    ev.preventDefault();
    ev.stopPropagation();
    const moving = this.navDrag;
    this.navDragEnd();
    if (!moving || moving === targetKey) return;
    const keys = this.navOrder().map(n => n.key);
    keys.splice(keys.indexOf(moving), 1);
    keys.splice(keys.indexOf(targetKey), 0, moving);
    this.saveNavOrder(keys);
    // Only the nav is redrawn. Calling render()/load() here would remount the
    // current view and refire its fetch just because a button moved.
    this.renderNav();
  },

  /* A drag that ends on its own button still fires click. Swallow that one so
     rearranging never navigates by accident. */
  navClick(key){
    if (this.navMoved){ this.navMoved = false; return; }
    // Your Business itself opens its overview; a division under it opens that division.
    const n = NAV.find(x => x.key === key);
    if (key === 'bridge' || (n && n.bz)){
      this.bizTab = n && n.bz ? n.bz : 'overview';
      this.bzDrop = null;
      key = 'bridge';
    }
    this.go(key);
  },

  tickClock(){
    const now = new Date();
    const t = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const d = now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
    $('clockTime').textContent = t;
    $('clockDate').textContent = d;
    $('mobileClock').textContent = t;
    this.tickTimer();
  },

  /* The countdown ticks locally between server syncs so it stays smooth, and
     re-syncs whenever it hits zero so the server owns "completed". */
  session: null,
  timer: null,
  tickTimer(){
    const s = this.session;
    if (!s || s.status !== 'running') return;
    s.remaining_secs = Math.max(0, s.remaining_secs - 1);
    const isBreak = s.kind === 'break';
    const accent = isBreak ? '#34d399' : '#ff2d3d';

    const big = $('bigClock');
    if (big) big.textContent = fmtClock(s.remaining_secs);
    const bar = $('bigBar');
    if (bar) bar.style.width = Math.round((1 - s.remaining_secs / s.planned_secs) * 100) + '%';

    // Mini widget on the Command Deck home.
    const fm = $('fmClock');
    if (fm) fm.textContent = fmtClock(s.remaining_secs);
    const fmBar = $('fmBar');
    if (fmBar) fmBar.style.width = Math.round((1 - s.remaining_secs / s.planned_secs) * 100) + '%';
    const fmb = $('focusMini');
    if (fmb) fmb.style.borderColor = accent + '55';

    if (s.remaining_secs === 0){
      this.session = null;
      this.sessionEnded(isBreak);
    }
  },

  sessionEnded(wasBreak){
    // Sound first — the alarm is the whole point of the block ending.
    this.playAlarm(wasBreak);
    // Let the server close the session out, then reflect it.
    this.syncTimer().then(() => this.refreshTimerTab()).then(() => {
      if (this.view === 'command' && this.commandTab === 'timer') this.render();
    });
    try {
      if ('Notification' in window && Notification.permission === 'granted'){
        new Notification(wasBreak ? 'Break over' : 'Work block done',
                         {body: wasBreak ? 'Back to it.' : 'Take a break.'});
      }
    } catch (err) { /* notifications are a nicety, never a failure */ }
  },

  async syncTimer(){
    try {
      const t = await api('/api/timer');
      this.timer = t;
      this.session = t.active;
      this.paintFocusMini();
      this.tickTimer();
    } catch (err) { /* deck still works without the timer */ }
  },

  setStatus({health, online, total, unread}){
    if (health){
      $('sysDot').style.background = C.health[health] || C.health.unknown;
      $('sysLabel').textContent = 'SYSTEMS ' + health.toUpperCase();
    }
    if (online !== undefined){
      $('agDot').style.background = online ? C.health.green : C.health.red;
      $('agLabel').textContent = `${online} / ${total} AGENTS ONLINE`;
    }
    if (unread !== undefined){
      for (const el of [$('bellBadge'), $('navBridge')]){
        if (!el) continue;
        el.hidden = !unread;
        el.textContent = unread;
      }
    }
  },

  connectStream(){
    try {
      const es = new EventSource(API + '/api/stream?interval=5');
      es.addEventListener('pulse', e => {
        const p = JSON.parse(e.data);
        this.setStatus({health:p.systems_health, online:p.agents_online, total:p.agents_total, unread:p.bridge_unread});
        $('sseDot').style.background = C.health.green;
        $('sseLabel').textContent = 'LIVE';
        // The pulse only carries a count, not the alerts themselves — a new
        // one (or a rising count generally) is worth a real fetch so a
        // critical alert can pop a bubble no matter which view is open.
        if (p.open_alerts !== this.lastOpenAlerts){
          this.lastOpenAlerts = p.open_alerts;
          this.pollAlerts();
        }
      });
      es.onerror = () => {
        $('sseDot').style.background = C.health.red;
        $('sseLabel').textContent = 'RECONNECTING…';
      };
    } catch (err) {
      $('sseLabel').textContent = 'STREAM OFF';
    }
  },

  /* ---------------- critical alert bubbles ----------------
     A separate surface from the bottom-right `toast()` — those are quiet
     "refresh failed" notes; these are for alerts.severity === 'critical' and
     need to grab the eye wherever Blanco is looking, so they stack in the
     top-right corner and stay up until dismissed or acknowledged. */
  seenAlertIds: new Set(),
  alertsPrimed: false,

  async pollAlerts(){
    try { this.checkAlerts((await api('/api/command/brief')).alerts || []); }
    catch (err) { /* the next pulse will try again */ }
  },

  checkAlerts(alerts){
    const openIds = new Set(alerts.map(a => a.id));
    // First sight of the deck: mark what's already open as seen rather than
    // firing a bubble storm for alerts that predate this page load.
    if (!this.alertsPrimed){
      this.alertsPrimed = true;
      for (const id of openIds) this.seenAlertIds.add(id);
      return;
    }
    for (const a of alerts){
      if (a.severity === 'critical' && !this.seenAlertIds.has(a.id)) this.showAlertBubble(a);
      this.seenAlertIds.add(a.id);
    }
    // Alerts that were acknowledged/cleared elsewhere shouldn't re-fire if a
    // new alert later reuses that id — drop anything no longer open.
    for (const id of [...this.seenAlertIds]) if (!openIds.has(id)) this.seenAlertIds.delete(id);
  },

  showAlertBubble(a){
    const host = $('alertBubbles');
    if (!host || host.querySelector(`[data-bb="${a.id}"]`)) return;
    const col = C.sev[a.severity] || C.sev.critical;
    const el = document.createElement('div');
    el.className = 'alertbubble';
    el.dataset.bb = a.id;
    el.style.border = `1px solid ${alpha(col,'55')}`;
    el.innerHTML = `
      <div class="bbhead">
        <span class="mono" style="font-size:10px;letter-spacing:1px;color:${col};text-transform:uppercase">
          ${dot(col,true)} ${esc(a.severity)} · ${esc(a.source||'alert')}</span>
        <button class="bbclose" onclick="App.dismissBubble(${a.id})">✕</button>
      </div>
      <div class="bbtitle">${esc(a.title)}</div>
      ${a.detail ? `<div class="bbdet">${esc(a.detail)}</div>` : ''}
      <div class="bbrow">
        <button class="ack" style="margin:0" onclick="App.ack(${a.id});App.dismissBubble(${a.id})">Acknowledge</button>
        <button class="fmbtn" onclick="App.go('command');App.dismissBubble(${a.id})">Open Command Deck</button>
      </div>`;
    host.prepend(el);
    // Critical stays up longer than a toast, but still self-clears so a
    // forgotten tab doesn't accumulate bubbles forever.
    setTimeout(() => this.dismissBubble(a.id), 30000);
  },

  dismissBubble(id){
    const el = $('alertBubbles')?.querySelector(`[data-bb="${id}"]`);
    if (el) el.remove();
  },

  /* Metric tiles, collapsed into the bottom-right corner word. Same tiles the
     deck used to stack under the console — hover expands them. */
  paintMetrics(metrics){
    const peek = $('metricPeek'), body = $('mpBody');
    if (!peek || !body) return;
    peek.hidden = false;
    // Newest-first left-to-right would read backwards as it unfurls from the
    // right, so the row is reversed — the first metric ends up furthest left.
    body.innerHTML = (metrics || []).slice().reverse().map(m => {
      const col = C.health[m.health] || C.health.unknown;
      let val = m.value, unit = m.unit || '';
      if (m.unit === 'USD'){ val = money(m.value); unit = m.target ? '/ ' + money(m.target) : ''; }
      else if (m.target && m.unit !== '%'){ unit = unit || ('/ ' + m.target); }
      const pct = m.target ? Math.min(100, Math.round((m.value / m.target) * 100)) : null;
      return `<div class="mptile">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <span class="lbl">${esc(m.label.toUpperCase())}</span>${dot(col)}
        </div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span class="val">${esc(val)}</span>
          <span class="unit" style="font-size:11px">${esc(unit)}</span>
        </div>
        ${pct !== null ? `<div class="bar" style="margin-top:7px"><i style="width:${pct}%"></i></div>` : ''}
        <div class="hint">${esc(m.hint || '')}</div>
      </div>`;
    }).join('');
  },

  /* The word "ALERTS" beside the sound widget; the list itself is CSS-hover.
     Critical count drives the colour, so a red word means act now. */
  paintAlertPeek(alerts){
    const peek = $('alertPeek'), word = $('apWord'), body = $('apBody');
    if (!peek || !word || !body) return;
    const open = alerts || [];
    // Held so an acknowledge from any page can repaint the peek without
    // waiting on a Command Deck refresh that may never come.
    this.openAlerts = open;
    peek.hidden = false;
    const crit = open.filter(a => a.severity === 'critical').length;
    word.className = 'apword' + (crit ? '' : open.length ? ' open' : ' quiet');
    word.textContent = open.length ? `ALERTS ${open.length}${crit ? ' · ' + crit + ' CRITICAL' : ''}` : 'ALERTS 0';

    body.innerHTML = open.length ? open.map(a => {
      const col = C.sev[a.severity] || C.sev.info;
      return `<div class="alertcard" data-alert="${a.id}" style="border:1px solid ${alpha(col,'33')};margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span class="mono" style="font-size:10px;letter-spacing:1px;color:${col};text-transform:uppercase">${esc(a.severity)}</span>
          <span class="mono" style="font-size:10px;color:#726c6f">${esc(a.source)}</span>
        </div>
        <div style="font-size:13px;font-weight:500;margin-top:8px">${esc(a.title)}</div>
        <div style="font-size:12px;color:#8a8386;margin-top:3px">${esc(a.detail)}</div>
        <button class="ack" onclick="App.ack(${a.id})">Acknowledge</button>
      </div>`;
    }).join('') : '<div class="empty">Nothing open. Clean board.</div>';
  },

  /* The single most-urgent item, pinned under the system status line so
     what you're supposed to be doing is visible from every page. */
  paintCurrentTask(nowNext){
    const el = $('hudTask');
    if (!el) return;
    const t = (nowNext || [])[0];
    if (!t){ el.hidden = true; return; }
    const col = C.sev[t.urgency] || C.sev.info;
    el.hidden = false;
    el.innerHTML = `<span class="tk">CURRENT</span>
      <span class="tt">${esc(t.title)}</span>
      <span class="td" style="color:${col}">${esc(dueLabel(t.due))}</span>`;
  },

  async load(opts={}){
    const v = this.view;
    // Painting last known data first makes a view switch instant — the fetch
    // below refreshes it in place. Only a view never visited this session
    // shows the skeleton. A quiet background refresh paints nothing up front.
    const cached = this.cache[v];
    // Arriving on a page re-reads its dock thread, so a reply sent from the
    // console or another surface shows up — unless a reply is streaming in,
    // which a re-read would cut loose from the bubble it's writing into.
    if (!opts.quiet && !this.chatStream) Object.values(this.dockThreads).forEach(t => { t.loaded = false; });
    if (cached && !opts.quiet){ this.data = cached; this.render(); }
    else if (!opts.quiet) this.renderLoading();
    try {
      if (v === 'command'){
        // Sessions and roster are scoped to the selected commander — the three
        // are separate chains of command, not one merged list.
        const scope = '?engine=' + encodeURIComponent(this.chatEngine);
        const [brief, chatAgents, chatEngines, chatSessions] = await Promise.all([
          api('/api/command/brief'), api('/api/chat/agents' + scope),
          api('/api/chat/engines'), api('/api/chat/sessions' + scope),
        ]);
        if (!chatSessions.some(s => s.id === this.chatSession)) this.chatSession = chatSessions[0].id;
        // One thread's history, rather than the last 80 messages from every
        // thread on the box filtered down in the browser.
        const messages = await api('/api/chat?limit=120&session_id=' + this.chatSession);
        this.data = {brief, messages, chatAgents, chatEngines, chatSessions};
        // A turn survives the page. Re-attach to one that is still running, or
        // a reload mid-answer leaves the bubble spinning with nothing behind
        // it — the turn finishes on the box and the console never finds out.
        if (!this.chatStream && messages.some(m => m.status === 'pending')) this.resumePending();
        this.setStatus({health:brief.systems_health, online:brief.agents_online,
                        total:brief.agents_total, unread:brief.bridge_unread});
        this.lastOpenAlerts = (brief.alerts || []).length;
        this.checkAlerts(brief.alerts || []);
        this.paintAlertPeek(brief.alerts || []);
        this.paintCurrentTask(brief.now_next || []);
        this.paintMetrics(brief.metrics || []);
      }
      else if (v === 'personal')  await this.loadPersonalTab(this.personalTab || 'jobs');
      else if (v === 'business'){
        const [money, ai] = await Promise.all([api('/api/money'), api('/api/money/ai-stack')]);
        this.data = {money, ai};
      }
      // Calendar reads the same vault board as Tasks — one source of truth,
      // so an event added on either surface shows on both.
      else if (v === 'calendar'){
        const [board, timeline] = await Promise.all([
          api('/api/tasks'), api('/api/tasks/timeline?days=60'),
        ]);
        this.data = {board, timeline};
      }
      else if (v === 'agents')    this.data = {agents: await api('/api/agents')};
      else if (v === 'systems')   this.data = {systems: await api('/api/systems')};
      else if (v === 'knowledge') this.data = {knowledge: await api('/api/knowledge?recent=12')};
      else if (v === 'bridge'){
        // Every part of the module in one go: the divisions, the full deal
        // list, and the feed. The overview's own recent_deals is capped at 10,
        // which is right for "recent" and wrong for a division's pipeline —
        // so the pipeline reads this list instead.
        const [biz, deals, bridge, emailHealth, freight, annotations] = await Promise.all([
          api('/api/biz'), api('/api/biz/deals?limit=500'), api('/api/bridge'),
          // The monitor is an optional companion — if it isn't installed the
          // Alerts tab says so rather than the whole module failing to load.
          api('/api/biz/email').catch(() => null),
          api('/api/biz/freight').catch(() => null),
          // Same treatment: an empty or unreachable register must not take the
          // rest of the work OS down with it.
          api('/api/biz/annotations').catch(() => []),
        ]);
        this.data = {biz, deals, bridge, emailHealth, freight, annotations};
      }
      this.cache[v] = this.data;
      // Blanco may have moved on while this was in flight — a slow response
      // must never paint over the view he is looking at now.
      if (this.view !== v){ this.data = this.cache[this.view] || this.data; return; }
      // A quiet refresh is nobody's idea of urgent — it yields to typing.
      this.render({background: !!opts.quiet});
    } catch (err) {
      // With something already on screen, a failed refresh is a note, not a
      // wipe — the stale deck is more useful than an error page.
      if (cached && this.view === v){ this.toast(`Refresh failed — showing last known data.`); return; }
      if (this.view !== v) return;
      $('view').innerHTML = `<div class="err"><strong>Can't reach Blanco OS.</strong><br>${esc(err.message)}
        <br><br>Start it with <code>cd ~/.openclaw/workspace/blanco-os &amp;&amp; ./run.sh</code></div>`;
    }
  },

  /* Tasks, Investments & Ventures, Finance & Credit, Cert Track, Journal and
     Email all live under the one Personal tab now. Each still owns its own
     fetch (keys never collide, so this just merges onto `this.data` rather
     than replacing it — switching sub-tabs keeps what was already loaded). */
  async loadPersonalTab(tab){
    const merge = obj => { this.data = {...this.data, ...obj}; };
    // The tab's sub-agent panel loads its own thread and roster (loadDock) —
    // this used to fetch them here and flip the console to OpenClaw with it.
    if (tab === 'jobs'){
      merge({jobs: await api('/api/jobs')});
    } else if (tab === 'finance'){
      const monthly = this.payoffMonthly || null;
      const [finance, financePlan, notes, credit, creditPlan] = await Promise.all([
        api('/api/finance'),
        api('/api/finance/debts/payoff-plan' + (monthly ? '?monthly_payment=' + monthly : '')),
        api('/api/finance/notes'),
        api('/api/credit'),
        api('/api/credit/plan'),
      ]);
      merge({finance, financePlan, notes, credit, creditPlan});
    } else if (tab === 'certs'){
      merge({certs: await api('/api/certs')});
    } else if (tab === 'journal'){
      merge({journal: await api('/api/journal')});
    } else if (tab === 'email'){
      const params = new URLSearchParams({limit: '30'});
      if (this.mailQuery) params.set('q', this.mailQuery);
      if (this.mailCategory) params.set('category', this.mailCategory);
      const [inbox, rules] = await Promise.all([api('/api/email?' + params), api('/api/email/rules')]);
      merge({inbox, rules});
    }
  },

  personalTab: 'jobs',
  setPersonalTab(tab){
    this.personalTab = tab;
    const meta = PERSONAL_TABS.find(t => t.key === tab);
    if (meta && !this.data[meta.need]){
      this.loadPersonalTab(tab).then(() => { if (this.personalTab === tab) this.render(); });
    }
    this.render();
  },

  view_personal(){
    const tab = this.personalTab || 'jobs';
    const meta = PERSONAL_TABS.find(t => t.key === tab) || PERSONAL_TABS[0];
    // One nav entry now covers six modules — swap the header subtitle to say
    // which one is actually on screen.
    const subtitle = $('subtitle');
    if (subtitle) subtitle.textContent = meta.label;

    const tabStrip = `<div class="filters">
      ${PERSONAL_TABS.map(t => `<button class="${tab===t.key?'on':''}" onclick="App.setPersonalTab('${t.key}')">${esc(t.label)}</button>`).join('')}
    </div>`;

    const renderers = {
      jobs: () => this.view_jobs(),
      finance: () => this.view_finance(), certs: () => this.view_certs(),
      journal: () => this.view_journal(), email: () => this.view_email(),
    };
    const body = this.data[meta.need] ? renderers[tab]() : '<div class="empty">Loading…</div>';
    return `<div class="stack">${tabStrip}${body}</div>`;
  },

  /* Business: Investments & Ventures, moved out of Personal. Same panel,
     its own top-level entry, loaded by load() like any other view. */
  view_business(){
    return this.data.money ? this.view_money() : '<div class="empty">Loading…</div>';
  },

  /* Each Personal tab talks to the sub-agent that owns that domain —
     Investments on the ventures tab, Finance on finance & credit, and so on.
     The dock is a fixed corner widget rather than a panel in the page: hover
     opens it, clicking (or typing) pins it open. It reuses the #thread /
     #chatInput ids so sendChat, watchReply and scrollThread work unchanged,
     and it's only ever painted where the Command Deck console isn't. */
  agentDockTarget(){
    // Command Deck's overview is the console itself — no dock on top of it.
    const tab = {personal: this.personalTab || 'jobs', command: this.commandTab || 'overview',
                 bridge: this.bizTab || 'overview'}[this.view];
    return DOCK_AGENTS[tab ? this.view + '/' + tab : this.view] || null;
  },
  agentDockAgent(){
    const target = this.agentDockTarget();
    return target ? target.agent : null;
  },

  /* Each dock's thread is held here rather than in this.data: a view's
     background refresh replaces this.data wholesale, and would take a
     streaming reply with it. A Hermes (or Claude) dock gets its own thread in
     that commander; OpenClaw docks keep sharing thread #1, one agent's slice
     of it each, as they always have. */
  dockThreads: {},
  dockThread(){
    const target = this.agentDockTarget();
    if (!target) return null;
    const key = target.engine + ':' + target.agent;
    return this.dockThreads[key] || (this.dockThreads[key] = {...target, messages:[], agents:[]});
  },
  /* Reuse a thread already pointed at this agent — the same conversation then
     shows on the Command Deck under that commander — or open one. The promise
     is kept so two quick sends can't each create a thread. */
  ensureDockSession(thread){
    if (thread.engine === 'openclaw') return Promise.resolve(1);
    if (!thread.sessionPromise){
      thread.sessionPromise = (async () => {
        const sessions = await api('/api/chat/sessions?engine=' + encodeURIComponent(thread.engine));
        const found = sessions.find(s => s.agent === thread.agent);
        if (found) return found.id;
        const label = thread.agent.charAt(0).toUpperCase() + thread.agent.slice(1);
        const made = await api('/api/chat/sessions', {method:'POST', body: JSON.stringify({
          label, engine: thread.engine, agent: thread.agent,
        })});
        return made.id;
      })().catch(err => { thread.sessionPromise = null; throw err; });
    }
    return thread.sessionPromise;
  },
  async loadDock(opts={}){
    const thread = this.dockThread();
    if (!thread || (thread.loaded && !opts.force)) return;
    // render() calls this on every paint — a backend that's down would
    // otherwise raise a toast several times a second.
    if (!opts.force && thread.failedAt && Date.now() - thread.failedAt < 30000) return;
    if (thread.loading) return;
    thread.loading = true;
    try {
      const sid = await this.ensureDockSession(thread);
      const [agents, messages] = await Promise.all([
        api('/api/chat/agents?engine=' + encodeURIComponent(thread.engine)),
        api('/api/chat?limit=120&session_id=' + sid),
      ]);
      const mine = thread.engine === 'openclaw'
        ? messages.filter(m => m.agent === thread.agent) : messages;
      Object.assign(thread, {sessionId: sid, agents, messages: mine, loaded: true});
      this.paintAgentDock();
      const pending = messages.find(m => m.status === 'pending');
      if (pending && !this.chatStream) this.watchReply(pending.id);
    } catch (err) {
      thread.failedAt = Date.now();
      this.toast('Could not reach ' + thread.agent + ': ' + err.message);
    } finally { thread.loading = false; }
  },
  dockRoster(){
    const thread = this.dockThread();
    return thread ? thread.agents : (this.data.chatAgents || []);
  },

  paintAgentDock(){
    const host = $('agentDock');
    if (!host) return;
    const target = this.agentDockTarget();
    if (!target){
      host.hidden = true;
      host.innerHTML = '';
      return;
    }
    const id = target.agent;
    const who = this.dockRoster().find(a => a.id === id)
             || (target.engine === 'openclaw'
                  ? {name:'Sweet Jones', emoji:'🍯', role:''}
                  : {name: id.charAt(0).toUpperCase() + id.slice(1), emoji:'⚡', role:''});
    const msgs = this.threadMessages();
    const pending = msgs.some(m => m.status === 'pending');
    // A half-typed message must survive the repaint a background refresh causes.
    const draft = ($('chatInput') || {}).value || '';

    host.hidden = false;
    host.classList.toggle('pinned', this.agentDockPinned);
    host.innerHTML = `
      <div class="adbody">
        <div class="adhead">
          <span style="font-size:16px">${who.emoji}</span>
          <span class="nm">${esc(who.name)}</span>
          <span class="rl">${esc((who.role || '').slice(0, 46))}</span>
          <button class="x" onclick="App.closeAgentDock()" aria-label="Close">✕</button>
        </div>
        <div id="thread" class="adthread" style="display:flex;flex-direction:column;overflow-y:auto">
          ${msgs.length ? this.chatBubblesHTML(msgs, this.dockRoster())
                        : `<div class="empty">Nothing yet — ask ${esc(who.name)} about this page.</div>`}
        </div>
        <div class="adfoot">
          <textarea id="chatInput" class="search" rows="1"
                    style="flex:1;font-family:var(--sans);resize:none;padding:10px 12px;font-size:12px"
                    placeholder="Message ${esc(who.name)}…  (Enter to send${target.engine === 'claude' ? ' · start with @opus / @sonnet / @haiku to pick the model' : ''})"
                    onfocus="App.pinAgentDock()"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();App.sendChat()}"></textarea>
          <button class="ack" style="margin:0;align-self:stretch;padding:0 14px" onclick="App.sendChat()">Send</button>
        </div>
      </div>
      <button class="adpill" onclick="App.toggleAgentDock()">
        <span class="em">${who.emoji}</span>
        <span>ASK ${esc((who.name || '').toUpperCase())}</span>
        ${pending ? '<span class="dt"></span>' : ''}
      </button>`;
    const box = $('chatInput');
    if (box && draft){ box.value = draft; }
    if (this.agentDockPinned) this.scrollThread();
  },

  agentDockPinned: false,
  pinAgentDock(){
    if (this.agentDockPinned) return;
    this.agentDockPinned = true;
    $('agentDock')?.classList.add('pinned');
  },
  closeAgentDock(){
    this.agentDockPinned = false;
    $('agentDock')?.classList.remove('pinned');
  },
  toggleAgentDock(){
    if (this.agentDockPinned) return this.closeAgentDock();
    this.pinAgentDock();
    this.scrollThread();
    requestAnimationFrame(() => $('chatInput')?.focus());
  },

  /* Lives on <body> so a re-render can't clear it mid-message. */
  toast(msg){
    let el = $('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.style.cssText = 'position:fixed;right:20px;bottom:20px;z-index:110;padding:11px 16px;' +
        'border-radius:12px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.4);' +
        'backdrop-filter:blur(10px);font-family:var(--mono);font-size:11px;color:#ffd79a;' +
        'max-width:300px;line-height:1.5';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  },

  renderLoading(){
    this.renderNav();
    $('view').innerHTML = `<div class="stack"><div class="skel" style="height:130px"></div>
      <div class="tiles">${'<div class="skel"></div>'.repeat(6)}</div>
      <div class="skel" style="height:220px"></div></div>`;
  },

  render(opts = {}){
    // A background refresh must never rip the DOM out from under a sentence
    // being typed. Hold the repaint; the focusout handler runs it the moment
    // Blanco leaves the box.
    if (opts.background && this.isTyping()){ this.pendingRender = true; return; }
    this.pendingRender = false;
    const snap = this.captureFocus();
    this.renderNav();
    const fn = this['view_' + this.view];
    $('view').innerHTML = fn ? fn.call(this) : '<div class="empty">Unknown view</div>';
    // The view was just rebuilt from scratch — re-hydrate the player chrome
    // into the fresh DOM. The player itself lives on outside the view.
    this.paintQueue();
    this.paintPlayer();
    this.paintAgentDock();
    // A no-op once the dock's thread is loaded; the first paint of a Hermes
    // dock fetches its thread and roster, then repaints the dock alone.
    this.loadDock();
    // The open task lives outside the view, so a refresh repaints it in place
    // rather than closing it.
    if (this.openTaskId) this.paintTaskModal();
    // The HUD widgets orbit the terminal; maximised, it owns the screen and
    // they fade out. On <body> because they all live outside #view.
    document.body.classList.toggle('consolemax-on',
      !!this.consoleMax && this.view === 'command' && (this.commandTab || 'overview') === 'overview');
    const deckTabs = $('deckTabs');
    if (deckTabs){
      deckTabs.hidden = this.view !== 'command';
      if (this.view === 'command') deckTabs.innerHTML = this.deckTabsHTML();
    }
    // Command Deck's console and the corner agent dock share the #thread id,
    // so both get the same pending-reply pickup.
    if (this.view === 'command' || this.view === 'personal' || this.view === 'business'){
      this.scrollThread();
      if ((this.data.messages || []).some(m => m.status === 'pending')) this.watchReply();
    }
    // Last, so it wins over scrollThread() and over any value the view just
    // painted from server data: what was typed outranks what was fetched.
    this.restoreFocus(snap);
  },

  /* ---------------- command deck ---------------- */
  commandTab: 'overview',
  setCommandTab(tab){
    this.commandTab = tab;
    // Timer history/presets aren't part of the command-deck brief fetch —
    // pull them in lazily the first time the tab is opened.
    if (tab === 'timer' && !this.timerData()){
      api('/api/timer').then(timer => {
        // Into a cache, not this.data — the deck's brief refresh replaces
        // this.data wholesale and would wipe the dial mid-session.
        this.timerCache = timer;
        if (this.commandTab === 'timer') this.render();
      }).catch(() => {});
    }
    // Same lazily-loaded treatment: the brief fetch doesn't carry the board,
    // and the deck shouldn't pay for it unless the tab is actually opened.
    if (tab === 'calendar' && !this.scheduleBoard()){
      Promise.all([api('/api/tasks'), api('/api/tasks/timeline?days=60')])
        .then(([board, timeline]) => {
          // Into a cache, not this.data: the deck's periodic brief refresh
          // replaces this.data wholesale, which would wipe the board out from
          // under the tab a second after it loaded.
          this.boardCache = board; this.timelineCache = timeline;
          if (this.commandTab === 'calendar') this.render();
        }).catch(err => this.toast('Could not load the calendar: ' + err.message));
    }
    this.render();
  },
